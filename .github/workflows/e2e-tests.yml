name: E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # a run takes a few minutes; without a limit a hanging test holds the runner for GitHub's six hours
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven  # zizmor: ignore[cache-poisoning]

      # Playwright drives the real, locally installed Chrome via channel="chrome" (see
      # E2EBrowser) rather than a Playwright-managed Chromium build, so it must be present on
      # the runner. Firefox is Playwright's own managed build, installed via the Maven
      # exec-plugin execution below.
      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          chrome-version: stable

      - name: Install Playwright Firefox
        if: matrix.browser == 'firefox'
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -Pe2e test-compile org.codehaus.mojo:exec-maven-plugin:3.1.0:java@install-playwright-browsers

      - name: Run E2E tests (${{ matrix.browser }})
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: |
          ./mvnw test \
            --batch-mode \
            --no-transfer-progress \
            -Pe2e \
            -De2e.browsers="$E2E_BROWSER"

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports
          retention-days: 7
