name: Build JAR and Docker image and publish to GHCR
on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish, set by the release workflow"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # The release workflow hands over the tag it just pushed, because a tag pushed
  # with the GITHUB_TOKEN does not trigger the push event below. A tag pushed by
  # hand still takes that route.
  BUILD_REF: ${{ inputs.tag || github.ref }}
  PUBLISH: ${{ inputs.tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout the repository
      packages: write  # push the image to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Resolve image name
        if: env.PUBLISH == 'true'
        # Derive owner/repo from the repo coordinates, lowercased (GHCR requires
        # lowercase; github.repository preserves the original casing).
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          # Maven dependency cache. Accepted risk: publish steps are gated to
          # release tags, so a PR cannot poison a cache used by a release build.
          cache: maven  # zizmor: ignore[cache-poisoning]

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        run: |
          ./mvnw clean test \
            --batch-mode \
            --no-transfer-progress

      - name: Build Docker image with Paketo
        if: env.PUBLISH == 'true'
        env:
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          ./mvnw spring-boot:build-image \
            --batch-mode \
            --no-transfer-progress \
            -DskipTests \
            -Dsalat.image.name="$IMAGE_NAME" \
            -Dsalat.image.tag="$IMAGE_TAG"

      - name: Extract metadata
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the release version is tagged. The branch and latest tags the
          # step used to declare could never apply, because the publish steps
          # never run for a branch push.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}

      - name: Push Docker image
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.run_number }}
        run: |
          while IFS= read -r tag; do
            docker tag "$SOURCE_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"