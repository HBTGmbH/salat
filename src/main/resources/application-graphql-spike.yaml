# GraphQL-Spike (#1532), nur lokal zusammen mit dem Profil local: --spring.profiles.active=local,graphql-spike
# Ohne dieses Profil findet die Autokonfiguration kein Schema und startet nichts (de.hbt.salat.graphqlspike).
spring:
  graphql:
    http:
      path: /api/graphql
    schema:
      locations: classpath:graphql-spike/
      printer:
        enabled: true
    graphiql:
      enabled: true
salat:
  graphql-spike:
    # Die Kürzel, die den Endpunkt nutzen dürfen, kommaseparat. Im Repo bleibt die Liste leer; lokal per
    # Umgebungsvariable SALAT_GRAPHQLSPIKE_ALLOWEDSIGNS setzen.
    allowed-signs: ""
