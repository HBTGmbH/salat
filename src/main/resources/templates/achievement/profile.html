<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="section='',personName=${@authorizedEmployee.name},sectionTitle=#{main.profile.title},title=${personName}">
<head>
  <title th:text="#{main.profile.title}">Profil</title>
</head>
<main layout:fragment="content">
  <!--/* Nur die eigenen Achievements (#837, #1501): keine Rangliste, kein fremdes Profil. Die erreichten
         Stufen stehen nach Datum absteigend, die neueste zuerst, wahlweise nach Typ gruppiert (#1553).
         Die Sortierwahl merkt UiState; dahinter steht die naechste Stufe jedes
         Achievements als gesperrte Medaille. Jede Medaille ist ein Knopf: eine erreichte oeffnet den
         Dialog, mit dem sie angekuendigt wurde, samt Feier (achievement/popup, ohne Zitat); eine
         gesperrte ein Popover (Muster aus #1065, data-info-popover) mit dem, was fehlt, und wie man sie
         bekommt. Die Zahl wird per th:with gebunden - ein Bean-Aufruf ist im Fragment-Parameter nicht
         erlaubt. Ein jaehrliches Achievement traegt auf dem Schild das Jahr, die Tage stehen im Text
         (#1512). */-->
  <div class="card">
    <div class="card-header flex-wrap gap-3">
      <h3 class="card-title" th:text="#{main.achievement.title}">Achievements</h3>
      <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
        <span id="achievementSortLabel" th:text="#{main.achievement.sort.label}">Sortieren:</span>
        <div class="btn-group" role="group" aria-labelledby="achievementSortLabel">
          <a th:href="@{/profile(fAchievementSort='date')}" class="btn btn-sm"
             th:classappend="${achievementSort == 'date'} ? 'active btn-primary'"
             th:aria-current="${achievementSort == 'date'} ? 'true' : null"
             th:text="#{main.achievement.sort.date}">Zeitpunkt</a>
          <a th:href="@{/profile(fAchievementSort='type')}" class="btn btn-sm"
             th:classappend="${achievementSort == 'type'} ? 'active btn-primary'"
             th:aria-current="${achievementSort == 'type'} ? 'true' : null"
             th:text="#{main.achievement.sort.type}">Typ, dann Zeitpunkt</a>
        </div>
      </div>
    </div>
    <div class="card-body">
      <th:block th:if="${achievementSort == 'date'}">
        <ul th:replace="~{achievement/reached :: medals(${profile.reached()})}"></ul>
      </th:block>
      <th:block th:if="${achievementSort == 'type'}">
        <section th:each="group : ${@achievementViewHelper.reachedGroups(profile.reached())}" class="mb-4"
                 th:aria-labelledby="${'achievementGroup-' + group.definition().key}">
          <h4 class="subheader mb-3" th:id="${'achievementGroup-' + group.definition().key}"
              th:text="#{${group.definition().groupKey()}}">Loyalist</h4>
          <ul th:replace="~{achievement/reached :: medals(${group.items()})}"></ul>
        </section>
      </th:block>
      <!--/* Die gesperrten Medaillen stehen in einem eigenen Abschnitt, damit sie nicht wie Erreichtes
             gelesen werden; das Schloss an der Medaille sagt es zusaetzlich. */-->
      <th:block th:unless="${#lists.isEmpty(profile.next())}">
      <hr class="my-4" th:unless="${#lists.isEmpty(profile.reached())}"/>
      <h4 class="subheader mb-3" th:text="#{main.achievement.next.title}">Als Nächstes</h4>
      <ul class="list-unstyled d-flex flex-wrap gap-4 mb-0">
        <li th:each="item, stat : ${profile.next()}" class="achievement-tile text-center"
            th:with="definition=${item.definition()},plate=${@achievementViewHelper.plate(item.definition(), item.level(), today)},
                     detail=${'achievement-next-' + stat.index},
                     rank=#{${item.definition().rankKey(item.level())}},group=#{${item.definition().groupKey()}},
                     meaning=#{${item.definition().titleKey()}(${item.level()})},
                     goal=${rank == group ? meaning : group + ' · ' + meaning},
                     progress=${@achievementViewHelper.next(item, today)}">
          <button type="button" class="achievement-tile-button" th:data-info-popover="${'#' + detail}">
            <span th:replace="~{achievement/medal :: medal(${definition.pictogram}, 'locked', ${plate}, true)}"></span>
            <span class="d-block fw-bold mt-2 text-secondary" th:text="${rank}">Säule</span>
            <span class="d-block text-secondary small" th:text="${progress}">noch 4 Jahre 4 Monate</span>
          </button>
          <div th:id="${detail}" hidden>
            <div class="fw-bold" th:text="${rank}">Säule</div>
            <div th:text="#{main.achievement.popover.goal(${goal})}">Noch zu erreichen: Loyalist · 15 Jahre bei HBT</div>
            <div class="text-secondary" th:text="${progress}">noch 4 Jahre 4 Monate</div>
            <div class="mt-2">
              <span class="fw-bold" th:text="#{main.achievement.popover.how}">So geht's:</span>
              <span th:text="#{${definition.hintKey()}}">Einfach dabeibleiben.</span>
            </div>
          </div>
        </li>
      </ul>
      </th:block>
    </div>
  </div>
  <!--/* Je erreichter Medaille ihr Dialog, ausserhalb der Karte wie jeder Modal-Dialog. */-->
  <th:block th:each="item : ${profile.reached()}" th:with="modalId=${@achievementViewHelper.reachedModalId(item)}">
    <div th:replace="~{achievement/popup :: popup(${ {item} }, ${modalId}, false)}"></div>
  </th:block>
</main>
</html>
