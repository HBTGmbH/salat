<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="section='',personName=${@authorizedEmployee.name},sectionTitle=#{main.profile.title},title=${personName}">
<head>
  <title th:text="#{main.profile.title}">Profil</title>
</head>
<main layout:fragment="content">
  <!--/* Nur die eigenen Achievements (#837, #1501): keine Rangliste, kein fremdes Profil. Neben den
         erreichten Stufen steht die naechste als gesperrte Medaille, damit sichtbar ist, was noch kommt. */-->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title" th:text="#{main.achievement.title}">Achievements</h3>
    </div>
    <div class="card-body">
      <section th:each="group, groupStat : ${groups}" th:classappend="${groupStat.last} ? '' : 'mb-4'"
               th:with="definition=${group.definition()}">
        <h4 class="subheader mb-3" th:text="#{${definition.groupKey()}}">Loyalist</h4>
        <ul class="list-unstyled d-flex flex-wrap gap-4 mb-0">
          <!--/* plate per th:with: a bean call is not allowed in a fragment parameter */-->
          <li th:each="reached : ${group.reached()}" class="achievement-tile text-center"
              th:with="plate=${@achievementViewHelper.plate(reached.level())}">
            <span th:replace="~{achievement/medal :: medal(${definition.pictogram}, ${reached.tier().fileName()},
                  ${plate}, false)}"></span>
            <div class="fw-bold mt-2" th:text="#{${definition.rankKey(reached.level())}}">Urgestein</div>
            <div class="text-secondary small"
                 th:text="${#temporals.format(reached.achievedOn(), 'dd.MM.yyyy')}">01.01.2017</div>
          </li>
          <li th:if="${group.next() != null}" class="achievement-tile text-center"
              th:with="next=${group.next()},plate=${@achievementViewHelper.plate(next.level())}">
            <span th:replace="~{achievement/medal :: medal(${definition.pictogram}, 'locked', ${plate}, false)}"></span>
            <div class="fw-bold mt-2 text-secondary" th:text="#{${definition.rankKey(next.level())}}">Säule</div>
            <div class="text-secondary small" th:text="${@achievementViewHelper.next(definition, next, today)}">
              noch 4 Jahre 4 Monate
            </div>
          </li>
        </ul>
      </section>
    </div>
  </div>
</main>
</html>
