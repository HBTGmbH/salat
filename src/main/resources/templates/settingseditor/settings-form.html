<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}">

<head>
  <title th:text="#{main.settings.title}">Settings</title>
</head>

<body>

<main layout:fragment="content">

  <salat:form th:action="@{/settings/store}" th:object="${settingsForm}">
    <salat:inputs>
      <salat:textInput type="time"
                       th:field="*{workDayStart}"
                       th:label="#{main.settings.workdaystart.label}"
                       required="true" />

      <salat:checkboxSwitch th:field="*{considerMandatoryBreak}"
                            th:label="#{main.settings.mandatorybreak.label}" />

      <salat:select th:field="*{locale}"
                    th:label="#{main.settings.locale.label}">
        <option value="-browser-" th:text="#{main.settings.locale.browser}">— Browser —</option>
        <option value="de" th:text="#{main.settings.locale.de}">Deutsch</option>
        <option value="en" th:text="#{main.settings.locale.en}">English</option>
      </salat:select>

      <salat:select th:field="*{favoriteSuborderId}"
                    th:label="#{main.settings.timereport.favorite.label}">
        <option value="" th:text="#{main.settings.timereport.favorite.none}">— Kein Favorit —</option>
        <option th:each="s : ${suborders}"
                th:value="${s.id}"
                th:text="${s.label}"
                th:attr="data-subtext=${s.subtext}"></option>
      </salat:select>

      <salat:select th:field="*{durationInputMode}"
                    th:label="#{main.settings.timereport.durationinputmode.label}">
        <option value="remember" th:text="#{main.settings.timereport.durationinputmode.remember}">— Letzte Eingabe merken —</option>
        <option value="duration" th:text="#{main.settings.timereport.durationinputmode.duration}">Immer Dauer</option>
        <option value="beginEnd" th:text="#{main.settings.timereport.durationinputmode.beginend}">Immer Beginn / Ende</option>
      </salat:select>

      <salat:textInput th:field="*{notificationEmail}"
                       th:label="#{main.settings.notification.email.label}"
                       th:helpText="#{main.settings.notification.email.help}"
                       th:placeholder="${defaultEmail}"
                       maxlength="255" />

      <salat:textInput th:field="*{gravatarEmail}"
                       th:label="#{main.settings.gravatar.email.label}"
                       th:helpText="#{main.settings.gravatar.email.help}"
                       th:placeholder="${defaultEmail}"
                       maxlength="255" />
      <!--/* Bild und Link zum Gravatar standen bis #1231 im Nutzermenue unten links; dort ist kein
             zweites Bild mehr, und gepflegt wird die Adresse hier. Die Probe am Ende von
             layout/base.html sucht den Link ueber seine id und tauscht Text und Ziel, wenn
             zur Adresse kein Gravatar hinterlegt ist. */-->
      <div class="mb-3 d-flex align-items-center gap-3"
           th:with="gravatarEmail=${@employeePreferenceService.gravatarEmailForCurrentUser}">
        <img class="avatar avatar-md rounded flex-shrink-0" alt=""
             th:with="url=${@gravatarViewHelper.gravatarUrl(gravatarEmail)}" th:src="${url}"/>
        <a th:with="checkUrl=${@gravatarViewHelper.gravatarCheckUrl(gravatarEmail)}"
           href="https://gravatar.com"
           target="_blank"
           rel="noopener noreferrer"
           id="gravatar-link"
           th:text="#{main.gravatar.link.manage}"
           th:data-title-register="#{main.gravatar.link.register}"
           th:data-check-url="${checkUrl}">Gravatar verwalten</a>
      </div>

      <!--/* Beta features: one switch per BetaFeature constant; without one the section is gone */-->
      <th:block th:unless="${betaFeatureOptions.isEmpty()}">
        <hr id="beta"/>
        <div class="mb-3">
          <div class="d-flex align-items-center gap-2">
            <span class="form-label mb-0" th:text="#{main.settings.beta.label}">Beta-Funktionen</span>
            <span class="badge bg-azure-lt" th:text="#{main.beta.badge}">Beta</span>
          </div>
          <div class="form-text" th:text="#{main.settings.beta.help}">
            Zum Ausprobieren. Jederzeit wieder abschaltbar.
          </div>
          <div class="form-text mb-3" th:text="#{main.beta.feedback.hint}">
            Beta-Funktion — Feedback und Probleme bitte im Slack-Channel #salat
          </div>

          <label class="form-check form-switch" th:each="feature : ${betaFeatureOptions}">
            <input class="form-check-input" type="checkbox"
                   th:field="*{betaFeatures}" th:value="${feature.key}"/>
            <span class="form-check-label">
              <span th:text="#{${feature.labelKey()}}">Name der Funktion</span>
              <span class="d-block form-text mt-0" th:text="#{${feature.helpKey()}}">
                Was die Funktion anders macht.
              </span>
            </span>
          </label>
        </div>
      </th:block>

    </salat:inputs>
    <salat:buttons>
      <salat:formButtons th:saveLabel="#{main.button.save}" th:cancelHref="@{/}" />
    </salat:buttons>
  </salat:form>

</main>

</body>

</html>
