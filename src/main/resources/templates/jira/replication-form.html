<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="
        section='systemsettings',
        subSection='jira-replications',
        title=${isEdit} ? #{main.jira.replication.form.title.edit} : #{main.jira.replication.form.title.create},
        pageTitle=${isEdit} ? #{main.jira.replication.form.title.edit} : #{main.jira.replication.form.title.create},
        sectionTitle=#{main.general.mainmenu.system.text}
">
<main layout:fragment="content">

  <div th:if="${formErrors != null and not #lists.isEmpty(formErrors)}" class="alert alert-danger mb-3">
    <p th:each="e : ${formErrors}" th:text="${e}" class="mb-0"></p>
  </div>

  <salat:form th:action="@{/jira/replications/store}" th:object="${replicationForm}" th:id-property="*{id}">
    <salat:inputs>
      <salat:textInput th:field="*{name}" th:label="#{main.jira.replication.field.name}"
                       required="true" maxlength="255" />

      <div class="row">
        <div class="col-md-6">
          <!-- Plain select rather than salat:select, which does not forward the hx-* attributes. -->
          <div class="mb-3">
            <label class="form-label required" for="customerorderSign"
                   th:text="#{main.jira.replication.field.customerorderSign}">Auftrag</label>
            <select class="form-select tomselect" th:field="*{customerorderSign}"
                    th:hx-post="@{/jira/replications/suborders}"
                    hx-swap="none"
                    hx-include="closest form"
                    hx-trigger="change">
              <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag ---</option>
              <option th:each="co : ${customerorders}"
                      th:value="${co.sign}"
                      th:with="customerLabel=${@customerorderViewHelper.customerLabel(co)}"
                      th:attr="data-subtext=${customerLabel}"
                      th:text="|${co.sign} - ${co.shortdescription}| + ${@hiddenMarkerViewHelper.suffix(co.hide)}"></option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div th:replace="~{jira/replication-form :: scopeSuborderSelect(${suborders}, ${replicationForm.suborderSign}, null)}"></div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8">
          <salat:textInput th:field="*{baseUrl}" th:label="#{main.jira.replication.field.baseUrl}"
                           required="true" maxlength="255"
                           th:placeholder="#{main.jira.replication.field.baseUrl.placeholder}" />
        </div>
        <div class="col-md-4">
          <salat:select th:field="*{apiFlavor}" th:label="#{main.jira.replication.field.apiFlavor}" required="true">
            <option th:each="flavor : ${apiFlavors}" th:value="${flavor.name()}"
                    th:text="#{${flavor.label}}">Server</option>
          </salat:select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{username}" th:label="#{main.jira.replication.field.username}"
                           required="true" maxlength="255"
                           th:helpText="#{main.jira.replication.field.username.help}" />
        </div>
        <div class="col-md-6">
          <!-- Never prefilled: the stored password does not leave the service. An empty field keeps
               it, a filled one replaces it. -->
          <salat:textInput th:field="*{password}" type="password"
                           th:label="#{main.jira.replication.field.password}" maxlength="255"
                           th:helpText="${isEdit}
                               ? #{main.jira.replication.field.password.help.edit}
                               : #{main.jira.replication.field.password.help.create}" />
        </div>
      </div>

      <salat:textarea th:field="*{jql}" th:label="#{main.jira.replication.field.jql}" required="true"
                      rows="3" monospace="true" th:helpText="#{main.jira.replication.field.jql.help}" />

      <div class="row">
        <div class="col-md-8">
          <salat:textInput th:field="*{parentFieldNames}" th:label="#{main.jira.replication.field.parentFieldNames}"
                           maxlength="255" th:helpText="#{main.jira.replication.field.parentFieldNames.help}" />
        </div>
        <div class="col-md-4">
          <salat:textInput th:field="*{pageSize}" th:label="#{main.jira.replication.field.pageSize}"
                           th:helpText="#{main.jira.replication.field.pageSize.help}" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{additionalFieldNames}"
                           th:label="#{main.jira.replication.field.additionalFieldNames}"
                           maxlength="1000"
                           th:helpText="#{main.jira.replication.field.additionalFieldNames.help}" />
        </div>
        <div class="col-md-6">
          <salat:textInput th:field="*{inheritedFieldNames}"
                           th:label="#{main.jira.replication.field.inheritedFieldNames}"
                           maxlength="1000"
                           th:helpText="#{main.jira.replication.field.inheritedFieldNames.help}" />
        </div>
      </div>

      <!--/* Only for a stored replication (#1013): the catalogue is fetched with the credentials of
             the saved row, and the password field is never prefilled, so there is nothing to fetch
             with before the first save. */-->
      <div class="mb-3">
        <button th:if="${isEdit}" type="button" class="btn btn-outline-primary"
                data-bs-toggle="modal" data-bs-target="#fieldPickerModal"
                th:hx-get="@{/jira/replications/{id}/fields(id=${replicationForm.id})}"
                hx-target="#fieldPickerBody">
          <i class="icon ti ti-list-search"></i>
          <span th:text="#{main.jira.replication.fields.button}">Felder auswählen</span>
        </button>
        <button th:unless="${isEdit}" type="button" class="btn btn-outline-primary" disabled>
          <i class="icon ti ti-list-search"></i>
          <span th:text="#{main.jira.replication.fields.button}">Felder auswählen</span>
        </button>
        <div th:unless="${isEdit}" class="form-text"
             th:text="#{main.jira.replication.fields.button.disabled.help}">
          Erst speichern.
        </div>
      </div>

      <salat:checkboxSwitch th:field="*{enabled}" th:label="#{main.jira.replication.field.enabled}" />

      <!--/* Writing back to JIRA (#1007). The one switch here that needs more permission than the
             replication itself, so the help text says so right next to it. */-->
      <div class="row">
        <div class="col-md-6">
          <salat:checkboxSwitch th:field="*{worklogSyncEnabled}"
                                th:label="#{main.jira.replication.field.worklogSyncEnabled}" />
          <div class="form-text mb-3" th:text="#{main.jira.replication.field.worklogSyncEnabled.help}">
            Schreibrechte noetig.
          </div>
        </div>
        <div class="col-md-6">
          <div th:replace="~{fragments/form-fields :: dateInput(
            field='worklogSyncFrom', label=#{main.jira.replication.field.worklogSyncFrom}, required=false
          )}"></div>
          <div class="form-text mb-3" th:text="#{main.jira.replication.field.worklogSyncFrom.help}">
            Buchungen ab diesem Tag werden geschrieben.
          </div>
        </div>
      </div>

      <!--/* The watermark is not a form field: a date entered by hand would skip every ticket
             updated before it, for good. Resetting it is the one operation that makes sense, and it
             is a button of its own rather than an input. */-->
      <div th:if="${isEdit}" class="mb-0">
        <label class="form-label" th:text="#{main.jira.replication.field.lastMaxUpdated}">Wasserstand</label>
        <div class="d-flex align-items-center gap-2">
          <span th:if="${lastMaxUpdated != null}"
                th:text="${#temporals.format(lastMaxUpdated, 'dd.MM.yyyy HH:mm')}">01.01.2026 02:00</span>
          <span th:if="${lastMaxUpdated == null}" class="text-muted"
                th:text="#{main.jira.replication.watermark.none}">noch nie gelaufen</span>
        </div>
        <div class="form-text" th:text="#{main.jira.replication.field.lastMaxUpdated.help}">
          Wird von der Replikation fortgeschrieben.
        </div>
      </div>
    </salat:inputs>
    <salat:buttons>
      <salat:formButtons th:saveLabel="#{main.button.label.save.text}" th:cancelHref="@{/jira/replications}" />
    </salat:buttons>
  </salat:form>

  <!--/* HTMX OOB update: the suborders of the chosen order (#1025). */-->
  <div th:if="${htmxRequest}">
    <div th:replace="~{jira/replication-form :: scopeSuborderSelect(
            ${suborders}, ${replicationForm.suborderSign}, ${subordersChanged})}"></div>
  </div>

  <!--/* The picker dialogue (#1013). The shell stays in the page, the body is fetched per opening
         so a field added in JIRA in the meantime is there. `salat-resizable` lets it be dragged
         bigger from the large breakpoint upwards — with a few hundred fields to scan, how much of
         the list is visible at once is the user's call, not ours. */-->
  <div th:if="${isEdit}" class="modal modal-blur fade salat-resizable" id="fieldPickerModal"
       tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{main.jira.replication.fields.title}">JIRA-Felder auswählen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="fieldPickerBody">
          <div class="text-center text-secondary py-4">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            <span th:text="#{main.jira.replication.fields.loading}">Felder werden geladen …</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal"
                  th:text="#{main.general.button.cancel.text}">Abbrechen</button>
          <button type="button" class="btn btn-primary" id="fieldPickerApply" data-bs-dismiss="modal"
                  onclick="salatFieldPickerApply()"
                  th:text="#{main.jira.replication.fields.apply}">Übernehmen</button>
        </div>
      </div>
    </div>
  </div>

  <!--/* Its own form, outside the one above: resetting the watermark is an action on the stored
         record, not an unsaved edit of it. */-->
  <form th:if="${isEdit}" th:action="@{/jira/replications/{id}/reset-watermark(id=${replicationForm.id})}"
        method="post" class="mt-3"
        th:onsubmit="|return confirm('#{main.jira.replication.confirm.resetwatermark}');|">
    <button type="submit" class="btn btn-outline-secondary">
      <i class="icon ti ti-restore"></i>
      <span th:text="#{main.jira.replication.action.resetwatermark}">Wasserstand zurücksetzen</span>
    </button>
  </form>

</main>

<!--/*
  The scope below the chosen order (#1025). Rendered twice: inline in the form, and again as an
  out-of-band swap when the order changes — that is what the oob parameter is for. It uses
  name/th:selected rather than th:field because the out-of-band copy sits outside the form and has
  no th:object to bind against.

  The option value is the fully qualified sign, AUFTRAG/01/02: the suborder sign on its own is not
  unique, AUFTRAG/A/01 and AUFTRAG/B/01 may both exist.
*/-->
<div th:fragment="scopeSuborderSelect(suborders, selectedSign, oob)" class="mb-3"
     id="replicationSuborderSelect" th:attr="hx-swap-oob=${oob}">
  <label class="form-label" for="suborderSign"
         th:text="#{main.jira.replication.field.suborderSign}">Unterauftrag</label>
  <select class="form-select tomselect" id="suborderSign" name="suborderSign"
          th:disabled="${#lists.isEmpty(suborders)}">
    <option value="" th:text="#{main.jira.replication.field.suborderSign.wholeorder}">--- Ganzer Auftrag ---</option>
    <!--/* A hidden suborder only appears when the replication already points at it; say so. */-->
    <option th:each="so : ${suborders}"
            th:value="${so.completeOrderSign}"
            th:selected="${selectedSign != null and selectedSign == so.completeOrderSign}"
            th:text="|${so.completeOrderSign} - ${so.shortdescription}| + ${@hiddenMarkerViewHelper.suffix(so.hide)}"></option>
  </select>
  <div class="form-text" th:text="#{main.jira.replication.field.suborderSign.help}">
    Ohne Unterauftrag gilt die Replikation für den ganzen Auftrag.
  </div>
</div>

</html>
