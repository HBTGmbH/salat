<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* The body of the field picker (#1013), loaded into the dialogue by HTMX. Everything below the
       table is client side: which entries are ticked follows the two inputs of the form as they
       stand right now, not what was last saved. */-->
<div th:fragment="fieldPicker" id="fieldPickerContent">

  <div th:if="${fieldCatalog.hasError()}" class="alert alert-danger mb-0"
       th:text="#{main.jira.replication.fields.error(${fieldCatalog.errorMessage})}">
    Die Feldliste konnte nicht geladen werden.
  </div>

  <div th:if="${not fieldCatalog.hasError() and #lists.isEmpty(fieldCatalog.options)}"
       class="alert alert-info mb-0" th:text="#{main.jira.replication.fields.empty}">
    Keine Felder geliefert.
  </div>

  <div th:if="${not fieldCatalog.hasError() and not #lists.isEmpty(fieldCatalog.options)}">
    <div class="mb-3">
      <input type="text" class="form-control" id="fieldPickerFilter" autocomplete="off"
             th:placeholder="#{main.jira.replication.fields.filter}" />
    </div>

    <!--/* Scrolls vertically only. No table-responsive and no card-table here: the first is
           overflow-x, the second pads the outer cells for the edge of a card that does not exist in
           a dialogue.

           overflow-x stays at its computed value on purpose: with overflow-y set, CSS turns a
           visible overflow-x into auto, so a bar is possible whatever we write here. Rather than
           hide it - which would put rows out of reach - the table is built so that nothing can
           overflow: fixed layout, the three narrow columns in rem, the two text columns taking what
           is left and wrapping inside it. */-->
    <div class="border rounded" style="max-height: 55vh; overflow-y: auto;">
      <table class="table table-vcenter table-sm mb-0" style="table-layout: fixed; width: 100%;">
        <!--/* white-space on every heading: Tabler sets nowrap on a table head, so a compound such
               as "Response-Schlüssel" would run out of its cell on a narrow dialogue instead of
               breaking. It has to be per cell - an inherited value loses against that rule. */-->
        <thead class="sticky-top bg-body">
        <tr>
          <!--/* No width: the two text columns share whatever the fixed ones leave. */-->
          <th class="text-break" style="white-space: normal"
              th:text="#{main.jira.replication.fields.column.name}">Feld</th>
          <th class="text-break" style="white-space: normal"
              th:text="#{main.jira.replication.fields.column.key}">Response-Schlüssel</th>
          <!--/* rem, not per cent: "Replizieren" is one word of some 84px, and a share of the width
                 squeezes the heading out of its cell on a narrow dialogue. */-->
          <th class="d-none d-md-table-cell text-break" style="width: 7rem; white-space: normal"
              th:text="#{main.jira.replication.fields.column.type}">Wertform</th>
          <th class="text-center text-break" style="width: 7rem; white-space: normal"
              th:text="#{main.jira.replication.fields.column.replicate}">Replizieren</th>
          <th class="text-center text-break" style="width: 7rem; white-space: normal"
              th:text="#{main.jira.replication.fields.column.inherit}">Vererben</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="option : ${fieldCatalog.options}" class="field-picker-row"
            th:attr="data-search=${#strings.toLowerCase(option.name + ' ' + option.key)}">
          <td class="text-break">
            <span th:text="${option.name}">Kategorie</span>
            <span th:if="${option.secondLevel}" class="badge bg-azure-lt ms-1"
                  th:text="#{main.jira.replication.fields.secondlevel}">2. Ebene</span>
          </td>
          <!--/* break-all rather than the usual word wrap: a response key is one long token without
                 a space to break at, and a path only offers dots. */-->
          <td><code style="word-break: break-all;" th:text="${option.key}">customfield_10123</code></td>
          <td class="d-none d-md-table-cell text-break">
            <span th:if="${option.type != null}" class="text-secondary" th:text="${option.type}">select</span>
          </td>
          <td class="text-center">
            <input type="checkbox" class="form-check-input field-picker-replicate"
                   th:value="${option.key}" th:attr="aria-label=${option.key}" />
          </td>
          <td class="text-center">
            <input type="checkbox" class="form-check-input field-picker-inherit"
                   th:value="${option.key}" th:attr="aria-label=${option.key}" />
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <p class="form-text mb-0" th:text="#{main.jira.replication.fields.hint}">
      Von Hand eingetragene Pfade bleiben erhalten.
    </p>
  </div>

  <script th:inline="none">
    (function () {
      const content = document.getElementById('fieldPickerContent');
      if (!content) return;

      const replicateBoxes = content.querySelectorAll('.field-picker-replicate');
      const inheritBoxes = content.querySelectorAll('.field-picker-inherit');

      const entriesOf = input => input.value.split(',').map(s => s.trim()).filter(Boolean);

      // What the form holds right now decides what is ticked - not what was last saved. Someone who
      // typed a field and has not saved yet must not see it unticked here.
      const tick = (boxes, inputId) => {
        const entries = entriesOf(document.getElementById(inputId));
        boxes.forEach(box => box.checked = entries.includes(box.value));
      };
      tick(replicateBoxes, 'additionalFieldNames');
      tick(inheritBoxes, 'inheritedFieldNames');

      const filter = document.getElementById('fieldPickerFilter');
      if (filter) {
        filter.addEventListener('input', () => {
          const term = filter.value.trim().toLowerCase();
          content.querySelectorAll('.field-picker-row').forEach(row => {
            row.hidden = term !== '' && !row.dataset.search.includes(term);
          });
        });
      }

      // Merging, not overwriting: an entry the catalogue does not know is something somebody typed -
      // a path such as customfield_10200.child.value - and it stays. Only entries this dialogue
      // offers are governed by its checkboxes.
      const apply = (boxes, inputId) => {
        const input = document.getElementById(inputId);
        const offered = new Set(Array.from(boxes).map(box => box.value));
        const ticked = Array.from(boxes).filter(box => box.checked).map(box => box.value);
        const kept = entriesOf(input).filter(entry => !offered.has(entry));
        input.value = Array.from(new Set(kept.concat(ticked))).join(', ');
      };

      // A function rather than a listener on the button in the footer: that button lives in the page,
      // this body is swapped in again on every opening. A listener would pile up per opening and
      // would keep working on the checkboxes of the run that registered it.
      window.salatFieldPickerApply = function () {
        apply(replicateBoxes, 'additionalFieldNames');
        apply(inheritBoxes, 'inheritedFieldNames');
      };
    })();
  </script>
</div>

</body>
</html>
