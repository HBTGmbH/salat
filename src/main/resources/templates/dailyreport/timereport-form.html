<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="title=${pageTitle}">
<section layout:fragment="content">

  <div class="row align-items-start">

    <!-- ===== Main form column ===== -->
    <div class="col-lg-7">
      <div class="card">

        <!--/* data-submit-once (#1239): jeder Request legt eine eigene Buchung an; ein zweiter Klick,
               waehrend das Speichern noch laeuft, buchte doppelt */-->
        <form id="timereportMainForm"
              th:action="${isEdit} ? @{/dailyreport/timereports/{id}(id=${timereportForm.id})} : @{/dailyreport/timereports}"
              method="post"
              th:object="${timereportForm}"
              data-submit-once>

          <input type="hidden" th:if="${timereportForm.id != null}" th:field="*{id}"/>
          <!--/* nur wenn das Formular fuer einen genannten Vertrag geoeffnet wurde (#760); die
                 Aktualisierungen per HTMX nehmen das Feld ueber hx-include mit */-->
          <input type="hidden" th:if="${timereportForm.id == null and timereportForm.employeecontractId != null}"
                 th:field="*{employeecontractId}"/>
          <input type="hidden" th:field="*{durationMode}" id="durationModeField"/>
          <input type="hidden" id="saveAsFavField" name="saveAsFavorite" value="false"/>
          <input type="hidden" name="returnUrl" th:value="${returnUrl}"/>

          <div class="card-body">

            <div th:if="${selectedEmployeeName != null}" class="mb-3">
              <div class="form-label mb-1" th:text="#{main.employeecontract.employee.text}">Mitarbeiter</div>
              <div th:text="${selectedEmployeeName}"></div>
            </div>

            <!-- Row 1: Date + Duration/Begin-End -->
            <div class="row g-3 mb-3">

              <div class="col-auto">
                <label class="form-label required" th:text="#{main.timereport.form.date.label}">Datum</label>
                <input type="date" class="form-control" th:field="*{referenceday}"
                       hx-post="/dailyreport/timereports/refresh-orders"
                       hx-include="closest form"
                       hx-target="#orders-suborders-wrapper"
                       hx-swap="outerHTML"
                       hx-trigger="change"/>
              </div>

              <!--/* beginEnd: the entry mode the user prefers (#844), rendered server-side so the
                     form does not visibly flip modes after the first paint */-->
              <div class="col-auto" th:with="beginEnd=${timereportForm.durationMode == 'beginEnd'}">
                <label class="form-label required" for="durationTime">
                  <span th:text="#{main.timereport.form.duration.label}">Dauer</span>
                </label>
                <div class="d-flex flex-wrap align-items-start gap-2">

                  <!-- Toggle buttons -->
                  <div class="btn-group flex-shrink-0" role="group">
                    <button type="button" class="btn btn-outline-secondary" id="btnDuration"
                            th:classappend="${beginEnd} ? '' : 'active'"
                            onclick="showDuration()"
                            th:title="#{main.timereport.form.duration.mode.duration.tooltip}">
                      <i class="icon ti ti-hourglass m-0"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="btnBeginEnd"
                            th:classappend="${beginEnd} ? 'active' : ''"
                            onclick="showBeginEnd()"
                            th:title="#{main.timereport.form.duration.mode.beginend.tooltip}">
                      <i class="icon ti ti-clock-2 m-0"></i>
                    </button>
                  </div>

                  <!-- Duration entry -->
                  <div id="durationSection" class="d-flex align-items-center gap-2"
                       th:classappend="${beginEnd} ? 'd-none' : ''">
                    <input type="text" class="form-control" th:field="*{durationTime}"
                           placeholder="HH:MM" maxlength="8" inputmode="decimal"
                           style="width:auto" size="6"
                           data-time-mode="duration" data-time-step="15"
                           data-time-chips="15 30 60" data-time-chips-target="#durationChips"
                           th:attr="data-time-label-decrease=#{main.timeinput.decrease.tooltip},
                                    data-time-label-increase=#{main.timeinput.increase.tooltip},
                                    data-time-label-reset=#{main.timeinput.reset.tooltip},
                                    data-entry-focus=${entryFocus != null and entryFocus.name() == 'DURATION'} ? 'true' : null"
                           oninput="durationMask(event)" onblur="durationBlur(event)" onfocus="this.select()"/>
                    <!--/* Where the booking ends (#1263): whoever notes down points in time rather than
                           durations sees whether the duration fits without opening the daily view.
                           Filled by updateBookingEndHint below; text-nowrap keeps label and time
                           together when the row wraps on a phone. */-->
                    <span id="bookingEndHint" class="text-muted text-nowrap d-none">
                      <span th:text="#{main.timereport.form.duration.end.label}">bis ~</span>
                      <strong id="bookingEndTime"></strong>
                    </span>
                  </div>

                  <!-- Begin/End entry -->
                  <div id="beginEndSection" th:classappend="${beginEnd} ? '' : 'd-none'">
                    <!--/* flex-wrap: the two fields plus their steppers do not fit next to each other
                           on a phone, so they stack there and stay inline from md upwards */-->
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                      <input type="text" class="form-control" th:field="*{beginTime}"
                             id="beginTimeInput" style="width:auto" size="5"
                             oninput="timeMask(event); updateDurationBadge()"
                             onblur="timeBlur(event); updateDurationBadge()"
                             inputmode="numeric" maxlength="5" placeholder="HH:MM"
                             data-time-mode="time" data-time-step="15"
                             th:attr="data-time-label-decrease=#{main.timeinput.decrease.tooltip},
                                      data-time-label-increase=#{main.timeinput.increase.tooltip}"/>
                      <!--/* only meaningful while both fields sit next to each other */-->
                      <span class="text-muted d-none d-md-inline">–</span>
                      <input type="text" class="form-control" th:field="*{endTime}"
                             id="endTimeInput" style="width:auto" size="5"
                             oninput="timeMask(event); updateDurationBadge()"
                             onblur="timeBlur(event); updateDurationBadge()"
                             inputmode="numeric" maxlength="5" placeholder="HH:MM"
                             data-time-mode="time" data-time-step="15"
                             th:attr="data-time-label-decrease=#{main.timeinput.decrease.tooltip},
                                      data-time-label-increase=#{main.timeinput.increase.tooltip}"/>
                      <span class="badge bg-secondary-lt text-secondary ms-1" id="durationBadge"></span>
                    </div>
                  </div>

                </div>
                <!--/* Quick-add chips are rendered here (see data-time-chips-target) so that they get
                       the full width of the column instead of the width of the input itself */-->
                <div id="durationChips" class="mt-2"
                     th:classappend="${beginEnd} ? 'd-none' : ''"></div>
              </div>
            </div>

            <!-- Employee order (HTMX swap target for date changes) -->
            <!--/* data-absence-minutes (#1214): der Rest des Tagessolls, mit dem eine Abwesenheit
                   vorbelegt wird. Nur beim Anlegen gesetzt, und mit diesem Fragment bei jedem
                   Datumswechsel neu gerendert, damit er zum Tag im Formular passt.
                   data-booked-until-minutes (#1263): bis wann der Tag ohne die Buchung im Formular
                   gebucht ist; aus demselben Grund hier. Fehlt an einem Tag "nicht gearbeitet".
                   data-preselected-by-default: vorgewaehlt ist nur der erste der Liste, gewaehlt
                   hat ihn niemand */-->
            <div id="orders-suborders-wrapper" th:fragment="ordersAndSubordersFragment" class="mb-3">
              <label class="form-label required" th:text="#{main.timereport.form.suborder.label}">Unterauftrag</label>
              <select class="form-select tomselect"
                      name="suborderId" id="suborderId"
                      data-favorite-target="/dailyreport/timereports/preferences/favorite-suborder"
                      th:attr="data-favorite-id=${favoriteSuborderId},
                               data-absence-minutes=${absenceDurationMinutes},
                               data-booked-until-minutes=${bookedUntilMinutes},
                               data-preselected-by-default=${suborderPreselectedByDefault == true} ? 'true' : null,
                               data-entry-focus=${entryFocus != null and entryFocus.name() == 'SUBORDER'} ? 'true' : null"
                      hx-post="/dailyreport/timereports/refresh-sidebar"
                      hx-include="closest form"
                      hx-target="#form-sidebar"
                      hx-swap="outerHTML"
                      hx-trigger="change">
                <option value="" th:text="#{main.timereport.form.suborder.placeholder}">— Unterauftrag wählen —</option>
                <option th:each="s : ${suborders}"
                        th:value="${s.id}"
                        th:text="${s.label}"
                        th:attr="data-subtext=${s.subtext},data-cnr=${s.commentNecessary},data-training=${s.trainingFlag},data-absence=${s.absence},data-standby=${s.standby}"
                        th:selected="${timereportForm.suborderId != null and timereportForm.suborderId == s.id}"></option>
              </select>
              <small id="suborderId-subtext" class="form-text text-muted mt-1"></small>
            </div>

            <!--/* Ticket reference (#982): free text, with suggestions from the tickets replicated for
                   the branch of the selected suborder (#1025) — the suborder itself, its parents and
                   the order-wide replication. Stored is the number alone. Sits above the comment:
                   picking a ticket writes its title into an untouched comment, so it is read before
                   it. The select itself is the context: the endpoint takes the id and resolves the
                   branch on the server, so no sign travels through the browser. */-->
            <div class="mb-3">
              <label class="form-label" for="ticketReference"
                     th:text="#{main.timereport.form.ticketreference.label}">Ticket</label>
              <input type="text" class="form-control tomselect" id="ticketReference"
                     th:field="*{ticketReference}" maxlength="64"
                     data-remote-url="/jira/tickets/suggestions"
                     data-remote-context-field="#suborderId"
                     data-remote-context-param="suborderId"
                     data-fill-target="#commentField"
                     th:attr="data-create-label=#{main.timereport.form.ticketreference.create},
                              placeholder=#{main.timereport.form.ticketreference.placeholder}"/>
              <small class="form-text text-muted mt-1"
                     th:text="#{main.timereport.form.ticketreference.help}"></small>
            </div>

            <!-- Comment -->
            <div class="mb-3">
              <label id="commentLabel"
                     th:class="${'form-label' + (commentNecessary == true ? ' required' : '')}"
                     th:text="#{main.timereport.form.comment.label}">Kommentar</label>
              <textarea id="commentField" class="form-control" th:field="*{comment}" rows="3"
                        th:attr="required=${commentNecessary == true ? 'required' : null},
                                 data-entry-focus=${entryFocus != null and entryFocus.name() == 'COMMENT'} ? 'true' : null"
                        th:placeholder="#{main.timereport.form.comment.placeholder}"></textarea>
            </div>

            <!-- Training -->
            <div class="mb-3">
              <label class="form-check form-switch">
                <!--/* explicit id: Thymeleaf numbers the generated ids of checkboxes (training1, ...),
                       but applySuborderTrainingDefault() needs a stable one */-->
                <input class="form-check-input" type="checkbox" id="trainingSwitch" th:field="*{training}"/>
                <span class="form-check-label" th:text="#{main.timereport.form.training.label}">Fortbildung</span>
              </label>
            </div>

            <!-- Share toggle (create and edit, only for own timereports) -->
            <div class="mb-3" th:if="${canShare}">
              <label class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="shareToggle" name="shareWithColleagues"
                       onchange="loadShareRecipients()"/>
                <span class="form-check-label" th:text="#{main.timereport.form.share.label}">Mit Kollegen teilen</span>
              </label>
              <div id="shareRecipientsSection" class="mt-3 d-none">
                <div id="shareRecipientsContainer">
                </div>
              </div>
            </div>

            <!-- Serial booking (create only) -->
            <div class="mb-3" th:unless="${isEdit}">
              <button type="button" class="btn btn-outline-secondary" onclick="toggleSerial(event)">
                <i class="ti ti-repeat me-1"></i>
                <span th:text="#{main.timereport.form.serial.button}">Für mehrere Arbeitstage wiederholen…</span>
              </button>
              <div class="mt-3 d-none" id="serialSection">
                <label class="form-label" th:text="#{main.timereport.form.serial.label}">Wiederholen für</label>
                <div class="d-flex gap-2 align-items-center">
                  <select class="form-select" th:field="*{numberOfSerialDays}" style="width:210px">
                    <option value="1" th:text="#{main.timereport.form.serial.none}">Nicht wiederholen</option>
                    <!--/* 2..MAX_SERIAL_BOOKING_DAYS from the controller, so the list cannot drift apart again (#826) */-->
                    <option th:each="days : ${serialDayOptions}"
                            th:value="${days}"
                            th:text="${days} + ' ' + #{main.timereport.form.serial.days.label}">2 Arbeitstage</option>
                  </select>
                  <span class="text-muted small" th:text="#{main.timereport.form.serial.hint}"></span>
                </div>
              </div>
            </div>

          </div><!-- end card-body -->

          <!--/* Footer: Save + Cancel. flex-wrap so the buttons stack instead of overflowing once
                 "Speichern und neu" (#843) is in the row as well */-->
          <div class="card-footer d-flex flex-wrap gap-2">
            <!--/* data-submit-shortcut: Ctrl+Enter bzw. ⌘Enter speichert von jedem Feld des
                   Formulars aus, auch aus dem Kommentar (#1016) */-->
            <button type="submit" class="btn btn-primary" data-submit-shortcut
                    th:attr="data-entry-focus=${entryFocus != null and entryFocus.name() == 'SAVE'} ? 'true' : null">
              <i class="ti ti-device-floppy me-1"></i>
              <span th:text="#{main.timereport.form.save}">Speichern</span>
            </button>
            <!--/* #843: a named submit button, so the server can tell the two save actions apart
                   without a hidden field. Enter still triggers plain "Speichern" (the first one). */-->
            <button type="submit" class="btn btn-outline-primary" th:unless="${isEdit}"
                    name="saveAndNew" value="true"
                    th:title="#{main.timereport.form.saveandnew.tooltip}">
              <i class="ti ti-clock-plus me-1"></i>
              <span th:text="#{main.timereport.form.saveandnew}">Speichern und neu</span>
            </button>
            <button type="button" class="btn btn-outline-secondary" onclick="toggleSaveAsFav()">
              <i class="ti ti-star me-1"></i>
              <span th:text="#{main.timereport.form.savefav.button}">Als Favorit speichern</span>
            </button>
            <!--/* #1192: nur wo das Loeschen gelingen wuerde. Der Knopf gehoert ueber form= zum
                   Loeschformular unter diesem Formular — Formulare lassen sich nicht schachteln —, und
                   traegt data-confirm selbst: so greift auch die Sperre in salat.css, bevor das Skript
                   geladen ist. Enter und Ctrl+Enter bleiben beim Speichern, denn der Knopf gehoert
                   nicht zu diesem Formular. Der Dialog nennt den gespeicherten Stand. */-->
            <button type="submit" form="timereportDeleteForm" class="btn btn-outline-danger ms-auto"
                    th:if="${deletableTimereport != null}"
                    th:with="trDuration=${@durationUtils.format(deletableTimereport.duration)}"
                    data-confirm
                    th:data-confirm-title="#{main.daily.delete.modal.title}"
                    th:data-confirm-detail="${#temporals.format(deletableTimereport.referenceday, 'dd.MM.yyyy') + ' · ' + deletableTimereport.employeeName + ' | ' + deletableTimereport.employeeSign}"
                    th:data-confirm-detail-secondary="|${deletableTimereport.completeOrderSign} · ${trDuration}${#strings.isEmpty(deletableTimereport.taskdescription) ? '' : ' · ' + deletableTimereport.taskdescription}|"
                    th:data-confirm-label="#{main.daily.delete.modal.confirm}"
                    data-confirm-variant="danger">
              <i class="ti ti-trash me-1"></i>
              <span th:text="#{main.general.button.delete.text}">Löschen</span>
            </button>
            <a th:href="${returnUrl != null} ? ${returnUrl} : @{/dailyreport/daily(mode='daily',date=${timereportForm.referenceday})}"
               class="btn btn-secondary"
               th:classappend="${deletableTimereport == null} ? 'ms-auto' : ''"
               th:text="#{main.timereport.form.cancel}">Abbrechen</a>
          </div>

          <!-- Save as favourite panel (hidden by default) -->
          <div class="card-footer d-none" id="saveAsFavSection">
            <div class="d-flex gap-2 align-items-center">
              <i class="ti ti-star text-yellow me-1"></i>
              <span class="text-muted small" th:text="#{main.timereport.form.savefav.label}">Favorit speichern?</span>
              <button type="submit" class="btn btn-primary text-nowrap ms-auto"
                      onclick="document.getElementById('saveAsFavField').value='true'">
                <i class="ti ti-star me-1"></i>
                <span th:text="#{main.timereport.form.savefav.action}">Speichern &amp; Favorit</span>
              </button>
            </div>
          </div>

        </form>
        <form id="timereportDeleteForm" method="post" th:if="${deletableTimereport != null}"
              th:action="@{/dailyreport/timereports/{id}/delete(id=${deletableTimereport.id})}">
          <input type="hidden" name="returnUrl" th:value="${returnUrl}"/>
        </form>
      </div>
    </div><!-- end main col -->

    <!-- ===== Sidebar column ===== -->
    <div class="col-lg-5">
      <div id="form-sidebar" th:fragment="sidebarFragment"
           th:attr="hx-swap-oob=${oobSidebar == true ? 'outerHTML' : null}">

        <!-- Today's bookings -->
        <div class="card mb-3">
          <div class="card-header">
            <h3 class="card-title" th:text="#{main.timereport.sidebar.bookings.title}">Buchungen</h3>
            <div class="card-options">
              <span class="text-muted small"
                    th:text="${#temporals.format(timereportForm.referenceday, 'EEE d MMM', #locale)}"></span>
            </div>
          </div>
          <div th:if="${#lists.isEmpty(todaysBookings)}"
               class="card-body text-muted small"
               th:text="#{main.timereport.sidebar.bookings.nomatch}">
            Noch keine Buchungen.
          </div>
          <div class="list-group list-group-flush" th:unless="${#lists.isEmpty(todaysBookings)}">
            <div class="list-group-item" th:each="tr : ${todaysBookings}">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <div class="fw-medium small" th:text="${tr.completeOrderSign}"></div>
                  <div class="text-muted" style="font-size:0.75rem"
                       th:if="${tr.taskdescription != null and !tr.taskdescription.isEmpty()}"
                       th:text="${tr.taskdescription}"></div>
                </div>
                <span class="badge bg-blue-lt ms-2"
                      th:text="${@durationUtils.format(tr.duration)}"></span>
              </div>
            </div>
          </div>
        </div>

        <!--/* Recent comments. Each entry brings the ticket reference of the booking its comment
               comes from (#1029) - on the same suborder that is as a rule exactly the fitting one.
               The reference is the subtext, the same shape the ticket field gives its suggestions:
               with the pair, the same comment can appear twice and only the reference tells the two
               entries apart. */-->
        <div class="card" th:if="${timereportForm.suborderId != null and not #lists.isEmpty(recentBookings)}">
          <div class="card-header">
            <h3 class="card-title" th:text="#{main.timereport.sidebar.recentcomments.title}">Letzte Kommentare</h3>
          </div>
          <div class="list-group list-group-flush">
            <button type="button"
                    class="list-group-item list-group-item-action text-start py-2 px-3"
                    th:each="rb : ${recentBookings}"
                    th:attr="data-comment=${rb.comment},data-ticket=${rb.ticketReference}"
                    onclick="applyRecentBooking(this)">
              <span style="white-space: pre-wrap" th:text="${rb.comment}"></span>
              <small th:if="${not #strings.isEmpty(rb.ticketReference)}"
                     class="d-block text-muted text-truncate mt-1"
                     th:text="${rb.ticketReference}"></small>
            </button>
          </div>
          <div class="card-footer text-muted small" th:text="#{main.timereport.sidebar.recentcomments.hint}"></div>
        </div>

      </div><!-- end #form-sidebar -->
    </div><!-- end sidebar col -->

  </div><!-- end row -->

  <script th:inline="javascript" th:if="${liveBookingStartMinutes != null}">
    var liveBookingStartMinutes = /*[[${liveBookingStartMinutes}]]*/ null;
  </script>
  <script th:inline="none">
    // the quick-add chips (#830) belong to the duration field and live outside #durationSection,
    // so they have to follow the mode toggle explicitly
    function toggleDurationChips(visible) {
      var chips = document.getElementById('durationChips');
      if (chips) chips.classList.toggle('d-none', !visible);
    }
    function showDuration() {
      document.getElementById('durationSection').classList.remove('d-none');
      document.getElementById('beginEndSection').classList.add('d-none');
      document.getElementById('btnDuration').classList.add('active');
      document.getElementById('btnBeginEnd').classList.remove('active');
      document.getElementById('durationModeField').value = 'duration';
      toggleDurationChips(true);
    }
    function showBeginEnd() {
      document.getElementById('durationSection').classList.add('d-none');
      document.getElementById('beginEndSection').classList.remove('d-none');
      document.getElementById('btnDuration').classList.remove('active');
      document.getElementById('btnBeginEnd').classList.add('active');
      document.getElementById('durationModeField').value = 'beginEnd';
      toggleDurationChips(false);
    }
    function toggleSaveAsFav() {
      document.getElementById('saveAsFavSection').classList.toggle('d-none');
    }
    function toggleSerial(e) {
      e.preventDefault();
      document.getElementById('serialSection').classList.toggle('d-none');
    }
    // #1029: an entry of the recent comments card carries the ticket reference of the booking its
    // comment comes from and fills both fields. The comment is overwritten unconditionally, as it
    // always was. An entry without a reference leaves the ticket field alone - emptying it would
    // discard a ticket just chosen without being asked to.
    function applyRecentBooking(btn) {
      var ta = document.querySelector('textarea[name="comment"]');
      if (ta) {
        ta.value = btn.dataset.comment || '';
        // the text is the user's from here on: the ticket field must not overwrite it when a
        // suggestion is picked afterwards (salat.js, data-fill-target)
        delete ta.salatAutoFilled;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }
      var ticket = btn.dataset.ticket;
      if (!ticket) return;
      var field = document.getElementById('ticketReference');
      if (!field) return;
      // TomSelect ignores a value that is not one of its options, so the reference is added as one
      // before it is selected; writing field.value alone would leave the widget empty
      if (field.tomselect) {
        field.tomselect.addOption({ value: ticket });
        field.tomselect.addItem(ticket, true);
      } else {
        field.value = ticket;
      }
    }
    function updateCommentRequired() {
      var sel = document.getElementById('suborderId');
      var label = document.getElementById('commentLabel');
      var ta = document.getElementById('commentField');
      if (!sel || !label || !ta) return;
      var opt = sel.options[sel.selectedIndex];
      var required = opt && opt.dataset.cnr === 'true';
      if (required) {
        label.classList.add('required');
        ta.setAttribute('required', 'required');
      } else {
        label.classList.remove('required');
        ta.removeAttribute('required');
      }
    }
    // #836: a suborder can carry a default flag for project based training. Picking such a
    // suborder switches "Fortbildung" on - and only ever on, never off again, so that neither a
    // manual choice nor the stored value of an edited booking is silently discarded. Called from
    // the change event only: the state the server rendered is authoritative for the first paint.
    function applySuborderTrainingDefault() {
      var sel = document.getElementById('suborderId');
      var box = document.getElementById('trainingSwitch');
      if (!sel || !box) return;
      var opt = sel.options[sel.selectedIndex];
      if (opt && opt.dataset.training === 'true') box.checked = true;
    }
    // #1214: an absence - sickness, vacation and the like - is booked with what is left of the
    // target of the day, which the server renders on the select for a new booking only. Only an
    // absence somebody chose counts: picked in the list, or handed to the form as favourite,
    // deeplink or palette command. The first of the list, preselected for want of anything else,
    // proposes nothing - otherwise every new booking would open with the rest of the day, and it
    // would stay when the project is picked. A field is
    // filled only while it is untouched: empty, or still holding exactly what an earlier prefill
    // wrote there - the same rule as data-fill-target in salat.js. Whatever somebody typed stays,
    // also on the next change of the suborder. Another order type proposes nothing and leaves an
    // earlier proposal standing; a new day without a rest takes back a proposal still untouched.
    var chosenSuborderId = null;
    function rememberChosenSuborder(e) {
      chosenSuborderId = e.target.value;
    }
    function applyAbsenceDuration() {
      var sel = document.getElementById('suborderId');
      if (!sel || !('absenceMinutes' in sel.dataset)) return;
      var opt = sel.options[sel.selectedIndex];
      if (!opt || opt.dataset.absence !== 'true' || sel.value !== chosenSuborderId) return;
      var minutes = Number(sel.dataset.absenceMinutes) || 0;
      prefillUntouched(document.getElementById('durationTime'), minutes > 0 ? timeInputFormat(minutes) : '');
      // in begin/end mode the end follows the begin; without a begin, or past midnight, there is no end
      var begin = parseTimeValue(document.getElementById('beginTimeInput').value);
      var end = minutes > 0 && begin !== null && begin + minutes < 24 * 60 ? timeInputFormat(begin + minutes) : '';
      prefillUntouched(document.getElementById('endTimeInput'), end);
      updateDurationBadge();
      updateBookingEndHint();
    }
    function prefillUntouched(field, value) {
      if (!field || (field.value !== '' && field.value !== field.salatPrefilled)) return;
      field.value = value;
      field.salatPrefilled = value;
    }
    // #982/#1025: the suggestions belong to the branch of the selected suborder, and the select
    // itself is what the remote field reads as its context - so there is nothing to keep in step,
    // only the loaded list to throw away. The entered reference is deliberately left alone: it is
    // free text and may well fit the new suborder.
    function clearTicketSuggestions() {
      document.getElementById('ticketReference')?.tomselect?.clearOptions();
    }
    document.addEventListener('DOMContentLoaded', function() {
      var sel = document.getElementById('suborderId');
      if (sel) {
        sel.addEventListener('change', updateCommentRequired);
        sel.addEventListener('change', applySuborderTrainingDefault);
        sel.addEventListener('change', rememberChosenSuborder);
        sel.addEventListener('change', applyAbsenceDuration);
        sel.addEventListener('change', clearTicketSuggestions);
      }
      if (sel && sel.dataset.preselectedByDefault !== 'true') chosenSuborderId = sel.value;
      document.getElementById('beginTimeInput').addEventListener('change', applyAbsenceDuration);
      updateCommentRequired();
    });
    // also after a change of date: the swapped select brings the rest of the new day along. Where
    // refresh-orders had to fall back to the first suborder of the new day, nobody chose that one
    document.addEventListener('htmx:after:swap', function() {
      var sel = document.getElementById('suborderId');
      if (sel) {
        sel.addEventListener('change', updateCommentRequired);
        sel.addEventListener('change', applySuborderTrainingDefault);
        sel.addEventListener('change', rememberChosenSuborder);
        sel.addEventListener('change', applyAbsenceDuration);
        sel.addEventListener('change', clearTicketSuggestions);
      }
      updateCommentRequired();
      applyAbsenceDuration();
    });
    function updateDurationBadge() {
      // parseTimeValue (salat.js) also understands the half-typed values a text field produces
      var begin = parseTimeValue(document.getElementById('beginTimeInput').value);
      var end = parseTimeValue(document.getElementById('endTimeInput').value);
      var badge = document.getElementById('durationBadge');
      var mins = begin !== null && end !== null ? end - begin : 0;
      badge.textContent = mins > 0
        ? Math.floor(mins / 60) + 'h' + String(mins % 60).padStart(2, '0')
        : '';
    }
    // #1263: where the booking ends - booked up to so far, from the select, plus the duration in the
    // field. Standby is no working time and moves nothing, and past midnight there is no time of day
    // to show; both leave the hint out, as does a day marked as not worked, which carries no value.
    function updateBookingEndHint() {
      var hint = document.getElementById('bookingEndHint');
      var sel = document.getElementById('suborderId');
      if (!hint || !sel) return;
      var opt = sel.options[sel.selectedIndex];
      var bookedUntil = 'bookedUntilMinutes' in sel.dataset ? Number(sel.dataset.bookedUntilMinutes) : null;
      var minutes = parseDurationValue(document.getElementById('durationTime').value);
      var end = bookedUntil !== null && minutes > 0 && !(opt && opt.dataset.standby === 'true')
        ? bookedUntil + minutes : null;
      if (end === null || end > 24 * 60) {
        hint.classList.add('d-none');
        return;
      }
      document.getElementById('bookingEndTime').textContent = timeInputFormat(end);
      hint.classList.remove('d-none');
    }
    function loadShareRecipients() {
      var shareToggle = document.getElementById('shareToggle');
      var shareSection = document.getElementById('shareRecipientsSection');
      if (!shareToggle || !shareSection) return;

      if (shareToggle.checked) {
        shareSection.classList.remove('d-none');
        var suborderId = document.getElementById('suborderId')?.value;
        var date = document.getElementById('referenceday')?.value;

        if (!suborderId || !date) {
          document.getElementById('shareRecipientsContainer').innerHTML = '';
          return;
        }

        var params = new URLSearchParams();
        params.append('suborderId', suborderId);
        params.append('date', date);
        var url = '/dailyreport/timereports/share-recipients?' + params.toString();

        htmx.ajax('GET', url, {target: '#shareRecipientsContainer', swap: 'innerHTML'});
      } else {
        // #1196: out of the form, not just out of sight - the choice is a required field, and a
        // hidden one blocks the submit without the browser being able to say why
        shareSection.classList.add('d-none');
        document.getElementById('shareRecipientsContainer').innerHTML = '';
      }
    }

    // loadShareRecipients empties the list where suborder or date are missing, so a date without
    // a single suborder does not leave the colleagues of the previous one standing
    function refreshShareRecipientsIfEnabled() {
      if (document.getElementById('shareToggle')?.checked) loadShareRecipients();
    }

    // #1184: delegated at the form instead of attached to the fields - a date change replaces
    // #orders-suborders-wrapper, and a listener on the suborder select would be gone with it. The
    // date refreshes once its own swap is done, because refresh-orders may pick another suborder
    // for the new day. Both handlers look at the field the event comes from, so neither the swap of
    // the list itself nor a change inside it asks for the list again (07f9f838: a listener on every
    // swap reloaded it endlessly).
    document.addEventListener('DOMContentLoaded', function() {
      var form = document.getElementById('timereportMainForm');
      form.addEventListener('change', function(e) {
        if (e.target.id === 'suborderId') {
          refreshShareRecipientsIfEnabled();
          updateBookingEndHint();
        }
      });
      form.addEventListener('htmx:after:swap', function(e) {
        if (e.target.id === 'referenceday') {
          refreshShareRecipientsIfEnabled();
          updateBookingEndHint();
        }
      });
      // every way the duration changes - typing, stepper, chips, reset - fires input (salat.js)
      form.addEventListener('input', function(e) {
        if (e.target.id === 'durationTime') updateBookingEndHint();
      });
      // #1196: a list that arrives after sharing was switched off again must not bring the
      // required choice back into the form
      document.getElementById('shareRecipientsContainer')?.addEventListener('htmx:before:swap', function(e) {
        if (!document.getElementById('shareToggle').checked) e.preventDefault();
      });
    });
    // durationMask/durationBlur/parseTimeValue live in /js/salat.js (#830). That file is loaded at
    // the end of the body, i.e. after this block, so nothing here may call into it at parse time —
    // hence DOMContentLoaded rather than an IIFE.
    document.addEventListener('DOMContentLoaded', function () {
      // An empty durationMode means nobody has decided yet (#844): the user has no stored entry
      // mode, and this is not a validation re-render of a submitted one. Only then may the live
      // booking pick the mode; a stored preference always wins over it.
      var mode = document.getElementById('durationModeField').value;
      var liveBooking = typeof liveBookingStartMinutes !== 'undefined'
        && liveBookingStartMinutes !== null;

      // prefill begin/end from the start of the working day, but never overwrite what is already
      // there — the server renders the submitted values on a validation re-render
      if (liveBooking) {
        var beginInput = document.getElementById('beginTimeInput');
        var endInput = document.getElementById('endTimeInput');
        if (!beginInput.value && !endInput.value) {
          var startH = Math.floor(liveBookingStartMinutes / 60);
          var startM = liveBookingStartMinutes % 60;
          beginInput.value =
            String(startH).padStart(2, '0') + ':' + String(startM).padStart(2, '0');
          var now = new Date();
          var nowMins = now.getHours() * 60 + now.getMinutes();
          var endMins = nowMins === 0 ? 0 : Math.ceil(nowMins / 15) * 15;
          endInput.value =
            String(Math.floor(endMins / 60) % 24).padStart(2, '0') + ':' + String(endMins % 60).padStart(2, '0');
          // a proposal like the absence's (#1214), which may therefore replace it
          endInput.salatPrefilled = endInput.value;
        }
      }

      // the server already rendered the mode; re-applying it keeps the chips and the hidden field
      // in sync and resolves the empty case into a concrete mode before the first submit
      if (mode === 'beginEnd' || (mode === '' && liveBooking)) {
        showBeginEnd();
      } else {
        showDuration();
      }
      // a form opened on an absence without a duration (favourite, deeplink, command palette) gets
      // the rest of the day as well; a duration it was handed is not empty and therefore wins.
      // After the live booking, whose begin the end of the absence follows
      applyAbsenceDuration();
      // the badge and the end of the booking are computed on the client only, so they have to be
      // filled once for whatever values the server rendered
      updateDurationBadge();
      updateBookingEndHint();
    });
  </script>

</section>

<!--/*
  Composite fragment returned by refresh-orders: invisible to the page renderer
  (outside layout:fragment="content") but reachable by HTMX fragment requests.
  Primary swap = ordersAndSubordersFragment; OOB swap = sidebarFragment.
*/-->
<th:block th:fragment="ordersRefreshCompositeFragment">
  <th:block th:replace="~{:: ordersAndSubordersFragment}"/>
  <th:block th:replace="~{:: sidebarFragment}"/>
</th:block>


</html>
