<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" th:with="title=${pageTitle}">
<section layout:fragment="content">

<th:block th:replace="~{fragments/matrix-table :: matrixStyles}"></th:block>

<!-- Filter bar -->
<div class="card mb-3">
  <div class="card-body py-2">
    <div class="d-flex gap-2 align-items-center flex-wrap">

      <!-- Month navigation -->
      <th:block th:replace="~{fragments/month-picker :: monthPicker('matrix-month', null, ${yearMonth})}"></th:block>
      <!--/* month and year have to be named explicitly: the matrix remembers them as UiState, and
             UiStateFilter refills a missing request parameter from that state - a link without them
             would land on the remembered month again instead of the current one (#923) */-->
      <a class="btn btn-sm btn-outline-secondary"
         th:with="currentYearMonth=${@dateUtils.currentYearMonth}"
         th:href="@{/dailyreport/matrix(fMonth=${currentYearMonth.monthValue},fYear=${currentYearMonth.year})}"
         th:text="#{main.general.month.current}">Aktueller Monat</a>
    </div>
  </div>
</div>

<!-- Matrix table -->
<div class="card">
  <th:block th:replace="~{fragments/matrix-table :: matrixTable(${matrixData}, ${showBeginBreakEnd}, ${selectedContractId > 0})}"></th:block>
  <!--/* same place as in the single overview: below the month, away from the navigation. The action
         touches every open workday of the month at once and can only be undone day by day (#855) */-->
  <div class="card-footer d-flex justify-content-between align-items-center gap-3 flex-wrap"
       id="matrix-fill-not-worked"
       th:if="${!monthReleased and selectedContractId > 0}">
    <!--/* the explanation used to be a title attribute, which never shows up on touch and does
           nothing to make the action findable in the first place */-->
    <span class="text-secondary small"
          th:text="#{main.general.button.fillopenworkdaysnotworked.alttext.text}">
      Alle Arbeitstage, an denen nichts gebucht wurde, werden auf 'nicht gearbeitet' gesetzt.
    </span>
    <form method="post" th:action="@{/dailyreport/matrix/fill-not-worked}"
          data-confirm
          th:data-confirm-title="#{main.matrix.fillnotworked.confirm.title}"
          th:data-confirm-text="#{main.matrix.fillnotworked.confirm.text}"
          th:data-confirm-detail="${#temporals.format(yearMonth.atDay(1), 'MMMM yyyy')}"
          th:data-confirm-label="#{main.matrix.fillnotworked.button.text}"
          data-confirm-variant="warning">
      <input type="hidden" name="month" th:value="${yearMonth.monthValue}"/>
      <input type="hidden" name="year" th:value="${yearMonth.year}"/>
      <!--/* warning, like the "Nicht gearbeitet" badge this action produces */-->
      <button type="submit" class="btn btn-outline-warning text-nowrap">
        <i class="ti ti-calendar-off me-1"></i>
        <span th:text="#{main.matrix.fillnotworked.button.text}">Rest nicht gearbeitet</span>
      </button>
    </form>
  </div>
</div>

<!-- Quick Actions -->
<div class="row g-3 mt-3">

  <div class="col-12 col-sm-4 d-flex">
    <a th:href="@{/dailyreport/timereports/new}" class="card card-link h-100 w-100 text-decoration-none">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-auto">
            <span class="avatar avatar-rounded bg-azure-lt text-azure" style="font-size: 1.4rem;">
              <i class="bi bi-plus-circle"></i>
            </span>
          </div>
          <div class="col">
            <div class="fw-medium" th:text="#{main.general.mainmenu.newreport.text}">Neue Buchung</div>
            <div class="text-muted small" th:text="#{main.welcome.action.logwork.subtitle.text}">Arbeitszeit erfassen</div>
          </div>
          <div class="col-auto text-muted">
            <i class="bi bi-chevron-right"></i>
          </div>
        </div>
      </div>
    </a>
  </div>

  <div class="col-12 col-sm-4 d-flex">
    <a th:href="@{/dailyreport/dashboard}" class="card card-link h-100 w-100 text-decoration-none">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-auto">
            <span class="avatar avatar-rounded bg-indigo-lt text-indigo" style="font-size: 1.4rem;">
              <i class="bi bi-grid-3x3-gap"></i>
            </span>
          </div>
          <div class="col">
            <div class="fw-medium" th:text="#{main.general.mainmenu.dashboard.text}">Dashboard</div>
            <div class="text-muted small" th:text="#{main.welcome.action.dashboard.subtitle.text}">Dashboard anzeigen</div>
          </div>
          <div class="col-auto text-muted">
            <i class="bi bi-chevron-right"></i>
          </div>
        </div>
      </div>
    </a>
  </div>

  <div class="col-12 col-sm-4 d-flex">
    <a th:href="@{/release}" class="card card-link h-100 w-100 text-decoration-none">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-auto">
            <span class="avatar avatar-rounded bg-green-lt text-green" style="font-size: 1.4rem;">
              <i class="bi bi-check-circle"></i>
            </span>
          </div>
          <div class="col">
            <div class="fw-medium" th:text="#{main.general.mainmenu.release.text}">Freigabe</div>
            <div class="text-muted small" th:text="#{main.welcome.action.release.subtitle.text}">Buchungen freigeben</div>
          </div>
          <div class="col-auto text-muted">
            <i class="bi bi-chevron-right"></i>
          </div>
        </div>
      </div>
    </a>
  </div>

</div>

</section>

<th:block layout:fragment="scripts">
<th:block th:replace="~{fragments/matrix-table :: matrixScript}"></th:block>
<script>
// the month picker only reports the selected month as "yyyy-MM" - navigating is up to this page
document.getElementById('matrix-month')?.addEventListener('change', function () {
  const url = new URL('/dailyreport/matrix', window.location.origin);
  const [yearRaw, monthRaw] = this.value.split('-');
  const year = Number.parseInt(yearRaw, 10);
  const month = Number.parseInt(monthRaw, 10);

  // the matrix always shows some month, so a cleared selection means "back to the default month"
  if (Number.isInteger(year) && Number.isInteger(month)) {
    url.searchParams.set('fMonth', String(month));
    url.searchParams.set('fYear', String(year));
  }
  location.href = url.toString();
});
</script>
</th:block>
</html>
