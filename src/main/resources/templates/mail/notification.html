<!DOCTYPE html>
<!--/* Eine Benachrichtigung als Mail (#1505): Titel als Ueberschrift, die Beschreibung mit ihren
       Zeilenumbruechen, das Ziel als Schaltflaeche mit der Adresse darunter. Die Schaltflaeche ist
       eine Tabellenzelle mit Hintergrund, die Outlook auch ohne CSS-Unterstuetzung zeigt. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: mail(~{::#content}, #{main.mail.footer.notification}, ${settingsUrl})}">
<body>
<div id="content">
  <p style="margin:0 0 16px;" th:text="#{main.notification.email.greeting(${firstname})}">Hallo Person B,</p>
  <h1 th:style="|margin:0 0 12px;font-size:18px;line-height:1.3;color:${colors.text};|" th:text="${title}">
    Person A hat eine Buchung mit dir geteilt.
  </h1>
  <p th:unless="${#lists.isEmpty(descriptionLines)}" style="margin:0 0 20px;">
    <th:block th:each="line, row : ${descriptionLines}"><th:block th:text="${line}">Auftrag: ABC-12</th:block><br th:unless="${row.last}"></th:block>
  </p>
  <th:block th:if="${actionUrl}">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td th:style="|background:${colors.primary};border-radius:4px;|">
          <a th:href="${actionUrl}" th:text="${actionLabel}"
             th:style="|display:inline-block;padding:10px 20px;color:${colors.primaryText};font-weight:600;text-decoration:none;|">
            Buchung erstellen
          </a>
        </td>
      </tr>
    </table>
    <p th:style="|margin:10px 0 0;font-size:12px;color:${colors.muted};word-break:break-all;|"
       th:text="#{main.mail.button.fallback(${actionUrl})}">Falls die Schaltfläche nicht geht: https://…</p>
  </th:block>
</div>
</body>
</html>
