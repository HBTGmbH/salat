<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='budgets',
        title=${isEdit} ? #{main.budget.form.title.edit} : #{main.budget.form.title.create},sectionTitle=#{main.general.mainmenu.budget.text},
        pageTitle=${isEdit} ? #{main.budget.form.title.edit} : #{main.budget.form.title.create},sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div th:if="${formErrors != null and not #lists.isEmpty(formErrors)}" class="alert alert-danger mb-3">
    <p th:each="e : ${formErrors}" th:text="${e}" class="mb-0"></p>
  </div>

  <salat:form th:action="@{/budget/store}" th:object="${budgetForm}" th:id-property="*{id}">
    <salat:inputs>
      <salat:textInput th:field="*{name}" th:label="#{main.budget.field.name}" required="true" maxlength="255" />
      <div class="row">
        <div class="col-md-6">
          <!-- Plain select rather than salat:select, which does not forward the hx-* attributes. -->
          <div class="mb-3">
            <label class="form-label" for="customerorderSign"
                   th:text="#{main.budget.field.customerorderSign}">Auftrag</label>
            <select class="form-select tomselect" th:field="*{customerorderSign}"
                    th:hx-post="@{/budget/suborders}"
                    hx-swap="none"
                    hx-include="closest form"
                    hx-trigger="change">
              <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag ---</option>
              <option th:each="co : ${customerorders}"
                      th:value="${co.sign}"
                      th:text="|${co.sign} - ${co.shortdescription}|"></option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div th:replace="~{fragments/suborder-select :: suborderSelect(${suborders}, *{suborderSign}, null)}"></div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{validFrom}" type="date" th:label="#{main.budget.field.validFrom}" required="true" />
        </div>
        <div class="col-md-6">
          <salat:textInput th:field="*{validUntil}" type="date" th:label="#{main.budget.field.validUntil}" required="true" />
        </div>
      </div>
      <salat:textInput th:field="*{alertThresholdPercent}" type="number" th:label="#{main.budget.field.alertThresholdPercent}" />
      <salat:select th:field="*{progressMode}" th:label="#{main.budget.field.progressMode}">
        <option value="" th:text="#{main.budget.field.progressMode.none}">--- Kein Fortschritt ---</option>
        <option th:each="mode : ${progressModes}"
                th:value="${mode.name()}"
                th:text="#{|main.budget.field.progressMode.${mode.name()}|}"></option>
      </salat:select>
      <salat:checkboxSwitch th:field="*{active}" th:label="#{main.general.active.text}" />
    </salat:inputs>
    <salat:buttons>
      <salat:formButtons th:saveLabel="${isEdit} ? #{main.button.label.edit.text} : #{main.button.label.save.text}" th:cancelHref="@{/budget}" />
    </salat:buttons>
  </salat:form>

  <!-- HTMX OOB updates -->
  <div th:if="${htmxRequest}">
    <div th:replace="~{fragments/suborder-select :: suborderSelect(${suborders}, ${budgetForm.suborderSign}, ${subordersChanged})}"></div>
  </div>

</main>
</html>
