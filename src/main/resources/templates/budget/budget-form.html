<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='budgets',
        title=${isEdit} ? #{main.budget.form.title.edit} : #{main.budget.form.title.create},sectionTitle=#{main.general.mainmenu.budget.text},
        pageTitle=${isEdit} ? #{main.budget.form.title.edit} : #{main.budget.form.title.create},sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div th:if="${formErrors != null and not #lists.isEmpty(formErrors)}" class="alert alert-danger mb-3">
    <p th:each="e : ${formErrors}" th:text="${e}" class="mb-0"></p>
  </div>

  <!--/*
    Which level applies to this order, and what that allows (#914, #1004). The list below offers the
    whole suborder tree, so whether a pick fits is decided by the saving — this badge is where the
    person reads the level they have to match.
  */-->
  <div class="alert alert-info mb-3">
    <div th:if="${currentLevel != null}">
      <strong th:text="#{main.budget.level.current} + ': '">Aktuell geltende Ebene</strong>
      <span class="badge bg-blue-lt" th:if="${currentLevel.perSuborder()}"
            th:text="#{main.budget.level.suborder(${currentLevel.level()})}">Unterauftragsebene 2</span>
      <span class="badge bg-blue-lt" th:unless="${currentLevel.perSuborder()}"
            th:text="#{${'main.budget.level.' + currentLevel.mode().name()}}">Auftragsweit</span>
    </div>
    <div class="small" th:text="#{main.budget.level.hint}">
      Alle zeitgleich gültigen Pläne eines Auftrags liegen auf derselben Ebene.
    </div>
  </div>

  <salat:form th:action="@{/budget/store}" th:object="${budgetForm}" th:id-property="*{id}">
    <salat:inputs>
      <salat:textInput th:field="*{name}" th:label="#{main.budget.field.name}" required="true" maxlength="255" />
      <div class="row">
        <div class="col-md-6">
          <!--/* Plain select rather than salat:select, which does not forward the hx-* attributes. */-->
          <div class="mb-3">
            <label class="form-label" for="customerorderId"
                   th:text="#{main.budget.field.customerorderSign}">Auftrag</label>
            <select class="form-select tomselect" th:field="*{customerorderId}"
                    th:hx-post="@{/budget/suborders}"
                    hx-swap="none"
                    hx-include="closest form"
                    hx-trigger="change">
              <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag ---</option>
              <option th:each="co : ${customerorders}"
                      th:value="${co.id}"
                      th:with="subtext=${@customerorderViewHelper.customerLabel(co)}"
                      th:attr="data-subtext=${subtext}"
                      th:text="${@customerorderViewHelper.label(co)} + ${@hiddenMarkerViewHelper.suffix(co.hide)}"></option>
            </select>
          </div>
        </div>
        <!--/*
          Wer einen Unterauftrag wählt, bekommt beim Anlegen dessen Festpreis-Kennzeichen vorbelegt
          (#1404). Der Auslöser sitzt auf dieser Hülle und nicht auf der Auswahl: die Auswahl wird
          beim Wechsel des Auftrags per OOB ersetzt, und ein Listener an ihr ginge dabei verloren;
          das change-Ereignis steigt bis hierher auf.
        */-->
        <div class="col-md-6" th:hx-post="@{/budget/fixed-price}" hx-swap="none" hx-include="closest form"
             hx-trigger="change">
          <div th:replace="~{fragments/suborder-select :: suborderSelect(${suborders}, *{suborderId}, null)}"></div>
        </div>
      </div>
      <div th:replace="~{budget/budget-form :: fixedPriceField(${budgetForm.fixedPrice}, ${fixedPriceMismatch}, null)}"></div>
      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{validFrom}" type="date" th:label="#{main.budget.field.validFrom}" required="true" />
        </div>
        <div class="col-md-6">
          <salat:textInput th:field="*{validUntil}" type="date" th:label="#{main.budget.field.validUntil}" required="true" />
        </div>
      </div>
      <salat:textInput th:field="*{alertThresholdPercent}" type="number" th:label="#{main.budget.field.alertThresholdPercent}" />
      <salat:select th:field="*{progressMode}" th:label="#{main.budget.field.progressMode}">
        <option value="" th:text="#{main.budget.field.progressMode.none}">--- Kein Fortschritt ---</option>
        <option th:each="mode : ${progressModes}"
                th:value="${mode.name()}"
                th:text="#{|main.budget.field.progressMode.${mode.name()}|}"></option>
      </salat:select>
      <salat:checkboxSwitch th:field="*{active}" th:label="#{main.general.active.text}" />
    </salat:inputs>
    <salat:buttons>
      <salat:formButtons th:saveLabel="${isEdit} ? #{main.button.label.edit.text} : #{main.button.label.save.text}" th:cancelHref="@{/budget}" />
    </salat:buttons>
  </salat:form>

  <!-- HTMX OOB updates -->
  <div th:if="${htmxRequest}">
    <div th:replace="~{fragments/suborder-select :: suborderSelect(${suborders}, ${budgetForm.suborderId}, ${subordersChanged})}"></div>
    <div th:if="${fixedPriceChanged}"
         th:replace="~{budget/budget-form :: fixedPriceField(${budgetForm.fixedPrice}, ${fixedPriceMismatch}, true)}"></div>
  </div>

</main>

<!--/*
  Das Festpreis-Kennzeichen des Plans (#1404). Zweimal gerendert wie die Unterauftragsauswahl:
  im Formular und als OOB-Ersatz, wenn die Wahl des Unterauftrags es vorbelegt. Deshalb name und
  th:checked statt th:field — die OOB-Kopie steht ausserhalb des Formulars. Der Widerspruch zum
  Kennzeichen des Unterauftrags ist nur ein Hinweis; es gilt das des Plans.
*/-->
<div th:fragment="fixedPriceField(checked, mismatch, oob)" class="mb-3" id="fixedPriceField"
     th:attr="hx-swap-oob=${oob}">
  <!--/* Spring setzt das Feld zurück, wenn der Schalter aus ist und nichts mitschickt. */-->
  <input type="hidden" name="_fixedPrice" value="on"/>
  <label class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="fixedPrice" name="fixedPrice" value="true"
           th:checked="${checked == true}"/>
    <span class="form-check-label" th:text="#{main.budget.field.fixedPrice}">Festpreis</span>
  </label>
  <div class="form-text" th:text="#{main.budget.field.fixedPrice.help}">
    Ein Festpreis-Plan erzielt Umsatz über Pauschalen und misst den Fortschritt manuell.
  </div>
  <div class="form-text text-warning" th:if="${mismatch}">
    <i class="icon ti ti-alert-triangle"></i>
    <span th:text="${checked == true} ? #{main.budget.fixedprice.mismatch.planfixed}
                                      : #{main.budget.fixedprice.mismatch.suborderfixed}">
      Der Unterauftrag ist als Festpreis-Angebot gekennzeichnet, der Plan nicht.</span>
  </div>
</div>

</html>
