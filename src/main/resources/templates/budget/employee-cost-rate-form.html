<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='employee-cost',
        title=${isEdit} ? #{main.employeecost.rate.form.title.edit} : #{main.employeecost.rate.form.title.create},
        pageTitle=${isEdit} ? #{main.employeecost.rate.form.title.edit} : #{main.employeecost.rate.form.title.create},
        sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div th:if="${formErrors != null and not #lists.isEmpty(formErrors)}" class="alert alert-danger mb-3">
    <p th:each="e : ${formErrors}" th:text="${e}" class="mb-0"></p>
  </div>

  <!-- The category travels as a hidden field: it is the group this period belongs to, and changing it
       would be a rename of the whole category — which happens on the category page (#954). -->
  <salat:form th:action="@{/budget/employee-cost/rates/store}" th:object="${costForm}" th:id-property="*{id}">
    <salat:inputs>
      <input type="hidden" th:field="*{name}"/>
      <div class="mb-3">
        <label class="form-label" th:text="#{main.employeecost.field.name}">Kostenkategorie</label>
        <div class="form-control-plaintext" th:text="*{name}">Kategorie</div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <salat:textInput th:field="*{costEuro}" type="text" th:label="#{main.employeecost.field.costEuro}" required="true" />
        </div>
        <div class="col-md-4">
          <salat:textInput th:field="*{validFrom}" type="date" th:label="#{main.employeecost.field.validFrom}" required="true" />
        </div>
        <div class="col-md-4">
          <salat:textInput th:field="*{validUntil}" type="date" th:label="#{main.employeecost.field.validUntil}"
                           th:helpText="#{main.employeecost.validuntil.hint}" />
        </div>
      </div>
    </salat:inputs>
    <salat:buttons>
      <salat:formButtons th:saveLabel="${isEdit} ? #{main.button.label.edit.text} : #{main.button.label.save.text}"
                         th:cancelHref="@{/budget/employee-cost/category(name=${costForm.name})}" />
    </salat:buttons>
  </salat:form>

</main>
</html>
