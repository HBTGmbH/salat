<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='pricing',
        title=${isEdit} ? #{main.pricing.form.title.edit} : #{main.pricing.form.title.create},
        pageTitle=${isEdit} ? #{main.pricing.form.title.edit} : #{main.pricing.form.title.create},
        sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div th:if="${formErrors != null and not #lists.isEmpty(formErrors)}" class="alert alert-danger mb-3">
    <p th:each="e : ${formErrors}" th:text="${e}" class="mb-0"></p>
  </div>

  <salat:form th:action="@{/budget/pricing/store}" th:object="${pricingForm}" th:id-property="*{id}">
    <salat:inputs>
      <div class="row">
        <div class="col-md-6">
          <!-- Plain select rather than salat:select, which does not forward the hx-* attributes. -->
          <div class="mb-3">
            <label class="form-label" for="customerorderSign"
                   th:text="#{main.pricing.field.customerorderSign}">Auftrag</label>
            <select class="form-select tomselect" th:field="*{customerorderSign}"
                    th:hx-post="@{/budget/pricing/suborders}"
                    hx-swap="none"
                    hx-include="closest form"
                    hx-trigger="change">
              <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag ---</option>
              <option th:each="co : ${customerorders}"
                      th:value="${co.sign}"
                      th:text="${co.hide}
                            ? |${co.sign} - ${co.shortdescription} (#{main.general.hidden.suffix})|
                            : |${co.sign} - ${co.shortdescription}|"></option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div th:replace="~{fragments/suborder-picker :: suborderPicker(${suborders}, null)}"></div>
          <salat:textInput th:field="*{suborderSign}" th:label="#{main.pricing.field.suborderSign}"
                           maxlength="255" th:helpText="#{main.pricing.field.suborderSign.help}" />
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <salat:select th:field="*{employeeSign}" th:label="#{main.pricing.field.employeeSign}">
            <option value="" th:text="#{main.pricing.field.employeeSign.all}">--- Alle Mitarbeiter ---</option>
            <option th:each="emp : ${employees}"
                    th:value="${emp.sign}"
                    th:text="|${emp.sign} - ${emp.firstname} ${emp.lastname}|"></option>
          </salat:select>
        </div>
        <div class="col-md-6">
          <salat:textInput th:field="*{description}" th:label="#{main.pricing.field.description}" maxlength="255" />
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <salat:textInput th:field="*{priceEuro}" type="text" th:label="#{main.pricing.field.priceEuro}" required="true" />
        </div>
        <div class="col-md-4">
          <salat:textInput th:field="*{validFrom}" type="date" th:label="#{main.pricing.field.validFrom}" required="true" />
        </div>
        <div class="col-md-4">
          <salat:textInput th:field="*{validUntil}" type="date" th:label="#{main.pricing.field.validUntil}" />
        </div>
      </div>
    </salat:inputs>
    <salat:buttons>
      <salat:formButtons th:saveLabel="${isEdit} ? #{main.button.label.edit.text} : #{main.button.label.save.text}" th:cancelHref="@{/budget/pricing}" />
    </salat:buttons>
  </salat:form>

  <!-- HTMX OOB updates -->
  <div th:if="${htmxRequest}">
    <div th:replace="~{fragments/suborder-picker :: suborderPicker(${suborders}, ${subordersChanged})}"></div>
  </div>

  <script th:inline="none">
    // Delegated so the handler survives the out-of-band swap of the picker.
    document.addEventListener('change', function (event) {
      const picker = event.target.closest('[data-suborder-picker]');
      if (!picker || !picker.value) return;
      const field = document.getElementById('suborderSign');
      if (field) {
        field.value = picker.value;
      }
    });
  </script>

</main>
</html>
