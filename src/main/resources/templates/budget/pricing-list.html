<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='pricing',
        title=#{main.pricing.list.title},
        pageTitle=#{main.pricing.list.title},
        sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div class="card mb-3">
    <div class="card-body">
      <form method="get" th:action="@{/budget/pricing}" data-filter-form="pricing">
        <div class="row g-2 align-items-end">
          <div class="col-md-6">
            <label class="form-label" th:text="#{main.suborder.customerorder.text}">Auftrag</label>
            <!-- No submit button: the select filters on change (#952). -->
            <select class="form-select tomselect" name="coSign" th:attr="data-value=${coSign}"
                    onchange="form.requestSubmit()">
              <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag ---</option>
              <option th:each="option : ${customerorderOptions}"
                      th:value="${option.sign}"
                      th:attr="data-subtext=${option.customerLabel}"
                      th:text="${option.label}"
                      th:selected="${coSign != null and coSign == option.sign}"></option>
            </select>
          </div>
          <div class="col-auto ms-auto" th:if="${isManager}">
            <a class="btn btn-success" th:href="@{/budget/pricing/create}">
              <i class="icon ti ti-plus"></i>
              <span th:text="#{main.pricing.button.create}">Neuer Stundensatz</span>
            </a>
          </div>
        </div>
        <div class="row g-2 align-items-end mt-2">
          <div class="col-auto ms-2">
            <label class="form-check form-switch">
              <!-- Prefixed: the plan list has a switch of the same meaning but a different subject,
                   and the UiState parameter mapping is global (#952). -->
              <input class="form-check-input" type="checkbox" name="pricingShowInactive" value="true" th:checked="${showInactive}"/>
              <input type="hidden" name="pricingShowInactive" value="false"/>
              <span class="form-check-label" th:text="#{main.pricing.filter.showinactive}">Inaktive anzeigen</span>
            </label>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive card">
    <table class="table table-vcenter card-table">
      <thead>
        <tr>
          <th th:text="#{main.pricing.field.customerorderSign}">Auftrag</th>
          <th th:text="#{main.pricing.field.suborderSign}">Unterauftrag</th>
          <th th:text="#{main.pricing.field.employeeSign}">Mitarbeiter</th>
          <th th:text="#{main.pricing.field.description}">Beschreibung</th>
          <th th:text="#{main.pricing.field.priceEuro}">€/h</th>
          <th class="d-none d-md-table-cell" th:text="#{main.pricing.field.valid}">Gültig</th>
          <th class="w-1" th:if="${isManager}"></th>
          <th class="w-1" th:if="${isManager}"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(pricings)}">
          <td colspan="8" class="text-center text-muted py-4" th:text="#{main.general.norecords.text}">Keine Einträge vorhanden</td>
        </tr>
        <tr th:each="p : ${pricings}" th:classappend="${!p.currentlyValid} ? 'table-danger' : ''"
            th:with="order=${orders.get(p.customerorderSign)}">
          <td>
            <div>
              <span th:text="${p.customerorderSign}"></span>
              <span class="ms-1 small" th:text="${order?.shortdescription}"></span>
            </div>
            <div class="small text-muted" th:text="${@customerorderViewHelper.customerLabel(order)}"></div>
          </td>
          <td th:text="${p.suborderSign} ?: '-'"></td>
          <td th:text="${p.employeeSign} ?: '-'"></td>
          <td th:text="${p.description} ?: '-'"></td>
          <td th:text="#{main.budget.format.amount(${p.priceCentsPerHour / 100.0})}"></td>
          <!--/* One column like everywhere else in the module; 31.12.2999 means "no end". */-->
          <td class="d-none d-md-table-cell small text-muted">
            <span th:text="${#temporals.format(p.validFrom, 'dd.MM.yyyy')}"></span>
            –
            <span th:if="${p.validUntil.year != 2999}" th:text="${#temporals.format(p.validUntil, 'dd.MM.yyyy')}"></span>
            <span th:unless="${p.validUntil.year != 2999}" th:text="#{main.general.validity.open}">offen</span>
          </td>
          <td th:if="${isManager}">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/budget/pricing/{id}/edit(id=${p.id})}">
              <i class="icon ti ti-pencil m-0"></i>
            </a>
          </td>
          <td th:if="${isManager}">
            <form th:action="@{/budget/pricing/{id}/delete(id=${p.id})}" method="post"
                  th:onsubmit="|return confirm('#{main.general.confirmdelete.text}');|">
              <button type="submit" class="btn btn-outline-danger btn-sm">
                <i class="icon ti ti-trash m-0"></i>
              </button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script th:inline="none">
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.querySelector('form[data-filter-form]');
      if (!form) return;
      form.querySelectorAll('input[type="checkbox"][name]').forEach(function (el) {
        el.addEventListener('change', function () { form.requestSubmit(); });
      });
    });
  </script>

</main>
</html>
