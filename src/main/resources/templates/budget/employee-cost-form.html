<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='employee-cost',
        title=#{main.employeecost.form.title.create},
        pageTitle=#{main.employeecost.form.title.create},
        sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div th:if="${formErrors != null and not #lists.isEmpty(formErrors)}" class="alert alert-danger mb-3">
    <p th:each="e : ${formErrors}" th:text="${e}" class="mb-0"></p>
  </div>

  <!-- Name and first rate only. The validity of that rate is set by the service to today with an
       open end; further periods and any correction happen on the category page (#954). -->
  <salat:form th:action="@{/budget/employee-cost/store}" th:object="${costForm}" th:id-property="*{id}">
    <salat:inputs>
      <salat:textInput th:field="*{name}" th:label="#{main.employeecost.field.name}" required="true" maxlength="255" />
      <div class="row">
        <div class="col-md-4">
          <salat:textInput th:field="*{costEuro}" type="text" th:label="#{main.employeecost.field.costEuro}"
                           required="true" th:helpText="#{main.employeecost.create.hint}" />
        </div>
      </div>
    </salat:inputs>
    <salat:buttons>
      <salat:formButtons th:saveLabel="#{main.button.label.save.text}" th:cancelHref="@{/budget/employee-cost}" />
    </salat:buttons>
  </salat:form>

</main>
</html>
