<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='employee-cost',
        title=${isEdit} ? #{main.employeecost.assignment.form.title.edit} : #{main.employeecost.assignment.form.title.create},
        pageTitle=${isEdit} ? #{main.employeecost.assignment.form.title.edit} : #{main.employeecost.assignment.form.title.create},
        sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div th:if="${formErrors != null and not #lists.isEmpty(formErrors)}" class="alert alert-danger mb-3">
    <p th:each="e : ${formErrors}" th:text="${e}" class="mb-0"></p>
  </div>

  <salat:form th:action="@{/budget/employee-cost/assignments/store}"
              th:object="${assignmentForm}" th:id-property="*{id}">
    <salat:inputs>
      <!--/* Preselected with the category the form was opened from, but still a select: retargeting an
             assignment to another category has to stay possible, otherwise the hint of BU-0014 —
             retarget the assignments before deleting a rate — would lead nowhere. */-->
      <salat:select th:field="*{employeeCostName}" th:label="#{main.employeecost.field.name}" required="true">
        <option value="" th:text="#{main.employeecost.assignment.select.category}">--- Kostenkategorie ---</option>
        <option th:each="name : ${costNames}" th:value="${name}" th:text="${name}"></option>
      </salat:select>
      <!--/* A hidden employee only appears when the assignment already references them; say so. */-->
      <!--/* A person the migration could not resolve cannot be offered; the empty choice names the stored sign. */-->
      <salat:select th:field="*{employeeId}" th:label="#{main.employeecost.assignment.field.employeeSign}" required="true">
        <option value=""
                th:text="${unresolvedEmployeeSign} != null ? #{main.budget.employeesign.unresolved.option(${unresolvedEmployeeSign})} : #{main.employeecost.assignment.select.employee}">--- Mitarbeiter ---</option>
        <option th:each="emp : ${employees}"
                th:value="${emp.id}"
                th:text="${@employeeLabelViewHelper.label(emp)} + ${@hiddenMarkerViewHelper.suffix(emp.hide)}"></option>
      </salat:select>
      <!--/* Choosing an order narrows the suborders to its own (#1343); with both chosen the suborder applies
             and the order only filtered. A hidden order or suborder only appears when the assignment
             already references it; say so. Plain select rather than salat:select, which does not
             forward the hx-* attributes. */-->
      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label" for="customerorderId"
                   th:text="#{main.budget.field.customerorderSign}">Auftrag</label>
            <select class="form-select tomselect" th:field="*{customerorderId}"
                    th:hx-post="@{/budget/employee-cost/assignments/suborders}"
                    hx-swap="none"
                    hx-include="closest form"
                    hx-trigger="change">
              <option value="" th:text="#{main.employeecost.assignment.select.customerorder.none}">--- Kein Auftrag ---</option>
              <option th:each="co : ${customerorders}"
                      th:value="${co.id}"
                      th:with="subtext=${@customerorderViewHelper.customerLabel(co)}"
                      th:attr="data-subtext=${subtext}"
                      th:text="${@customerorderViewHelper.label(co)} + ${@hiddenMarkerViewHelper.suffix(co.hide)}"></option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div th:replace="~{fragments/suborder-select :: suborderSelect(${suborders}, *{suborderId}, null)}"></div>
        </div>
      </div>
      <p class="form-text mt-n2 mb-3" th:text="#{main.employeecost.assignment.scope.hint}">
        Nur ein Auftrag: Die Zuordnung gilt für alle seine Unteraufträge. Mit Unterauftrag gilt sie nur für diesen.
      </p>
      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{validFrom}" type="date" th:label="#{main.employeecost.field.validFrom}" required="true" />
        </div>
        <div class="col-md-6">
          <salat:textInput th:field="*{validUntil}" type="date" th:label="#{main.employeecost.field.validUntil}"
                           th:helpText="#{main.employeecost.validuntil.hint}" />
        </div>
      </div>
    </salat:inputs>
    <salat:buttons>
      <!--/* Called from a budget plan there is no category yet (#964), and a cancel carrying an empty
             name would land on a category page that does not exist. Checked for empty rather than for
             null: on a re-render after a failed save the select binds the empty option as "". */-->
      <salat:formButtons th:saveLabel="${isEdit} ? #{main.button.label.edit.text} : #{main.button.label.save.text}"
                         th:cancelHref="${not #strings.isEmpty(assignmentForm.employeeCostName)} ? @{/budget/employee-cost/category(name=${assignmentForm.employeeCostName})} : @{/budget/employee-cost}" />
    </salat:buttons>
  </salat:form>

  <!-- HTMX OOB updates -->
  <div th:if="${htmxRequest}">
    <div th:replace="~{fragments/suborder-select :: suborderSelect(${suborders}, ${assignmentForm.suborderId}, ${subordersChanged})}"></div>
  </div>

</main>
</html>
