<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='dashboard',
        title=#{main.budget.dashboard.title},sectionTitle=#{main.general.mainmenu.budget.text},
        pageTitle=#{main.budget.dashboard.title},sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <!-- Filter form without a submit button: every select filters on change (#952). Both selects
       always submit their parameter; the empty option clears the remembered choice instead of
       leaving the previous one in place. -->
  <div class="card mb-4">
    <div class="card-body">
      <form method="get" th:action="@{/budget/dashboard}" th:object="${filter}" class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label" th:text="#{main.budget.dashboard.filter.segment}">Kundensegment</label>
          <select class="form-select tomselect" th:field="*{budgetSegmentId}" onchange="form.requestSubmit()">
            <option value="" th:text="#{main.budget.dashboard.filter.all}">Alle</option>
            <option th:each="segment : ${segments}"
                    th:value="${segment.id}"
                    th:text="${segment.name}"></option>
          </select>
        </div>
        <div class="col-md-4" th:if="${showResponsibleFilter}">
          <label class="form-label" th:text="#{main.budget.dashboard.filter.responsible}">Auftragsverantwortlicher</label>
          <select class="form-select tomselect" th:field="*{budgetResponsibleId}" onchange="form.requestSubmit()">
            <option value="" th:text="#{main.budget.dashboard.filter.all}">Alle</option>
            <option th:each="employee : ${responsibles}"
                    th:value="${employee.id}"
                    th:text="|${employee.sign} - ${employee.name}|"></option>
          </select>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive card">
    <table class="table table-vcenter card-table">
      <thead>
        <tr>
          <th th:text="#{main.budget.dashboard.col.order}">Auftrag</th>
          <th th:text="#{main.budget.dashboard.col.budget}">Budgetplan</th>
          <th th:text="#{main.budget.dashboard.col.valid}">Gültig</th>
          <th class="text-end" th:text="#{main.budget.dashboard.col.budgetEuro}">Budget (€)</th>
          <th class="text-end" th:text="#{main.budget.dashboard.col.coveredRevenue}">Ist-Erlös (€)</th>
          <th th:text="#{main.budget.dashboard.col.utilization}">Auslastung</th>
          <th class="text-center" th:text="#{main.budget.dashboard.col.status}">Status</th>
          <th th:text="#{main.budget.dashboard.col.action}">Aktion</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(rows)}">
          <td colspan="8" class="text-center text-muted py-3" th:text="#{main.budget.dashboard.empty}">Keine aktiven Budgetpläne vorhanden.</td>
        </tr>
        <tr th:each="row : ${rows}" th:with="customerorder=${customerorders.get(row.customerorderSign())}">
          <td>
            <div>
              <span class="text-muted small" th:text="${row.customerorderSign()}"></span>
              <span class="ms-1 small" th:text="${row.customerorderName()}"></span>
            </div>
            <!--/* The customer belongs to the order, not to the plan — taken from the order of the row. */-->
            <div class="small text-muted" th:text="${@customerorderViewHelper.customerLabel(customerorder)}"></div>
          </td>
          <td>
            <a th:href="@{/budget/{id}(id=${row.budgetId()})}" th:text="${row.budgetName()}"></a>
          </td>
          <!--/* Same as in the plan list: 31.12.2999 means "no end", not a date to read. */-->
          <td class="small text-muted">
            <span th:text="${#temporals.format(row.validFrom(), 'dd.MM.yyyy')}"></span>
            –
            <span th:if="${row.validUntil().year != 2999}" th:text="${#temporals.format(row.validUntil(), 'dd.MM.yyyy')}"></span>
            <span th:unless="${row.validUntil().year != 2999}" th:text="#{main.general.validity.open}">offen</span>
          </td>
          <td class="text-end small" th:text="${row.hasBudget()} ? #{main.budget.format.amount(${row.budgetEuro()})} : '—'"></td>
          <td class="text-end small" th:text="${row.hasBudget()} ? #{main.budget.format.amount(${row.coveredRevenueEuro()})} : '—'"></td>
          <td style="min-width: 160px;">
            <div th:if="${row.hasBudget()}">
              <div class="progress" style="height: 8px;">
                <!-- Red once the budget is exceeded; the warning level is the plan's own
                     alertThresholdPercent, and without one there is simply no warning. -->
                <div class="progress-bar"
                     th:classappend="${row.isOverBudget()} ? 'bg-danger' : (${row.isAboveThreshold()} ? 'bg-warning' : 'bg-success')"
                     role="progressbar"
                     th:style="'width: ' + ${#numbers.formatDecimal(row.progressBarPercent(), 1, 0)} + '%'">
                </div>
              </div>
              <!-- th:class, not classappend: text-muted would otherwise override text-danger. -->
              <small th:class="${row.isOverBudget()} ? 'text-danger fw-bold' : 'text-muted'"
                     th:text="${#numbers.formatDecimal(row.utilizationPercent(), 1, 1)} + ' %'"></small>
            </div>
            <span th:unless="${row.hasBudget()}" class="text-muted">—</span>
          </td>
          <td class="text-center">
            <!-- text-white is needed: on the solid red the inherited text colour is unreadable. -->
            <span th:if="${row.isOverBudget()}" class="badge bg-danger text-white" th:text="#{main.budget.dashboard.status.overbudget}">Überbucht</span>
            <span th:if="${!row.isOverBudget() and row.isAboveThreshold()}" class="badge bg-warning-lt" th:text="#{main.budget.dashboard.status.alert}">Alert</span>
            <!-- OK does not require a configured threshold: every plan with a budget amount is
                 judged against 100 %, the threshold only adds the amber step in between. -->
            <span th:if="${row.hasBudget() and !row.isOverBudget() and !row.isAboveThreshold()}" class="badge bg-success-lt" th:text="#{main.budget.dashboard.status.ok}">OK</span>
            <span th:unless="${row.hasBudget()}" class="text-muted">—</span>
          </td>
          <td>
            <a class="btn btn-sm btn-outline-secondary"
               th:href="@{/budget/controlling(customerorderSign=${row.customerorderSign()},from=${#temporals.format(row.validFrom(),'yyyy-MM-dd')},until=${#temporals.format(row.validUntil(),'yyyy-MM-dd')})}"
               th:text="#{main.budget.dashboard.link.controlling}">Controlling</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>
</html>
