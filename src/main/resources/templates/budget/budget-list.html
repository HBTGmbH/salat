<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='budgets',
        title=#{main.budget.list.title},sectionTitle=#{main.general.mainmenu.budget.text},
        pageTitle=#{main.budget.list.title},sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div class="card mb-3">
    <div class="card-body">
      <form method="get" th:action="@{/budget}" data-filter-form="budget">
        <div class="row g-2 align-items-end">
          <div class="col-md-6">
            <label class="form-label" th:text="#{main.suborder.customerorder.text}">Auftrag</label>
            <!-- No submit button: the select filters on change (#952). -->
            <select class="form-select tomselect" name="fCustomerOrderSign" th:attr="data-value=${fCustomerOrderSign}"
                    onchange="form.requestSubmit()">
              <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag ---</option>
              <option th:each="co : ${customerorders}"
                      th:value="${co.sign}"
                      th:with="customerLabel=${@customerorderViewHelper.customerLabel(co)}"
                      th:attr="data-subtext=${customerLabel}"
                      th:text="|${co.sign} - ${co.shortdescription}|"
                      th:selected="${fCustomerOrderSign != null and fCustomerOrderSign == co.sign}"></option>
            </select>
          </div>
          <div class="col-auto ms-auto" th:if="${isManager}">
            <a class="btn btn-success" th:href="@{/budget/create}">
              <i class="icon ti ti-plus"></i>
              <span th:text="#{main.budget.button.create}">Neuer Budgetplan</span>
            </a>
          </div>
        </div>
        <div class="row g-2 align-items-end mt-2">
          <div class="col-auto ms-2">
            <label class="form-check form-switch">
              <!-- Prefixed: the rate list has a switch of the same meaning but a different subject,
                   and the UiState parameter mapping is global (#952). -->
              <input class="form-check-input" type="checkbox" name="fBudgetShowInactive" value="true" th:checked="${showInactive}"/>
              <input type="hidden" name="fBudgetShowInactive" value="false"/>
              <span class="form-check-label" th:text="#{main.budget.filter.showinactive}">Inaktive anzeigen</span>
            </label>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive card">
    <table class="table table-vcenter card-table">
      <thead>
        <tr>
          <th th:text="#{main.budget.field.name}">Name</th>
          <th class="d-none d-md-table-cell" th:text="#{main.budget.field.customerorderSign}">Auftrag</th>
          <th class="d-none d-md-table-cell" th:text="#{main.budget.field.suborderSign}">Unterauftrag</th>
          <th class="d-none d-lg-table-cell" th:text="#{main.budget.field.valid}">Gültig</th>
          <!--/* Bounded so the signs wrap early enough (#1047): without a limit the auto layout
                 widens the column until a plan with many bookings pushes the other columns out of
                 the table, which is horizontal scrolling instead of a taller row. */-->
          <th class="d-none d-md-table-cell w-25" th:text="#{main.budget.field.employees}">Mitarbeitende</th>
          <th class="w-1"></th>
          <th class="w-1" th:if="${isManager}"></th>
          <th class="w-1" th:if="${isManager}"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(budgets)}">
          <td th:colspan="${isManager} ? 8 : 6" class="text-center text-muted py-4" th:text="#{main.general.norecords.text}">Keine Einträge vorhanden</td>
        </tr>
        <tr th:each="b : ${budgets}" th:classappend="${b.active != true} ? 'table-secondary' : ''"
            th:with="order=${orders.get(b.customerorderSign)},suborder=${suborders.get(b.suborderSign)},employees=${employeesByBudget.get(b.id)}">
          <td>
            <a th:href="@{/budget/{id}(id=${b.id})}" th:text="${b.name}"></a>
          </td>
          <td class="d-none d-md-table-cell">
            <div>
              <span th:text="${b.customerorderSign}"></span>
              <span class="ms-1 small" th:text="${order?.shortdescription}"></span>
            </div>
            <div class="small text-muted" th:text="${@customerorderViewHelper.customerLabel(order)}"></div>
          </td>
          <td class="d-none d-md-table-cell">
            <div th:text="${b.suborderSign} ?: '—'"></div>
            <div class="small text-muted" th:text="${suborder?.shortdescription}"></div>
          </td>
          <!--/* 31.12.2999 is how an open end is expressed throughout the module (→ OrderPricing);
                  printing the sentinel as a date is of no use to anybody. */-->
          <td class="d-none d-lg-table-cell small text-muted">
            <span th:text="${#temporals.format(b.validFrom, 'dd.MM.yyyy')}"></span>
            –
            <span th:if="${b.validUntil.year != 2999}" th:text="${#temporals.format(b.validUntil, 'dd.MM.yyyy')}"></span>
            <span th:unless="${b.validUntil.year != 2999}" th:text="#{main.general.validity.open}">offen</span>
          </td>
          <!--/* Who booked on this plan (#964), alphabetically — signs only, but all of them
                 (#1047). No hours, no rates and no findings: the overview answers the question
                 before those, and the detail page has the full card. Who all books on a plan is
                 what the overview is opened for, so the badges wrap inside the cell rather than
                 being cut off; the column is bounded in the header, so the row grows downwards and
                 the table does not grow sideways. A plan without bookings leaves the cell empty
                 rather than showing a zero that would read like something went wrong. */-->
          <td class="d-none d-md-table-cell">
            <div class="d-flex flex-wrap gap-1">
              <span th:each="e : ${employees}" class="badge bg-secondary-lt"
                    th:title="${e.employeeName}"
                    th:text="${e.employeeSign}"></span>
            </div>
          </td>
          <td>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/budget/{id}(id=${b.id})}">
              <!--/* Anzeigen traegt kein Auge: das gehoert dem Ein-/Ausblenden-Umschalter der Flags-Spalte
                     (Style Guide 5.2 und 5.4). */-->
              <i class="icon ti ti-notes m-0"></i>
            </a>
          </td>
          <td th:if="${isManager}">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/budget/{id}/edit(id=${b.id})}">
              <i class="icon ti ti-pencil m-0"></i>
            </a>
          </td>
          <td th:if="${isManager}">
            <form th:action="@{/budget/{id}/toggle-active(id=${b.id})}" method="post">
              <button type="submit" class="btn btn-sm"
                      th:classappend="${b.active == true} ? 'btn-outline-warning' : 'btn-outline-success'"
                      th:title="${b.active == true} ? #{main.budget.button.deactivate} : #{main.budget.button.activate}">
                <i class="icon m-0" th:classappend="${b.active == true} ? 'ti ti-player-pause' : 'ti ti-player-play'"></i>
              </button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script th:inline="none">
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.querySelector('form[data-filter-form]');
      if (!form) return;
      form.querySelectorAll('input[type="checkbox"][name]').forEach(function (el) {
        el.addEventListener('change', function () { form.requestSubmit(); });
      });
    });
  </script>

</main>
</html>
