<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='employee-cost',
        title=#{main.employeecost.list.title},
        pageTitle=#{main.employeecost.list.title},
        sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <div class="d-flex justify-content-end mb-3">
    <a class="btn btn-success" th:href="@{/budget/employee-cost/create}">
      <i class="icon ti ti-plus"></i>
      <span th:text="#{main.employeecost.button.create}">Neue Kostenkategorie</span>
    </a>
  </div>

  <!-- One row per category, not per rate period: a rate that changed over time is several
       employee_cost records sharing one name, and that is one category (#954). -->
  <div class="table-responsive card">
    <table class="table table-vcenter card-table">
      <thead>
        <tr>
          <th th:text="#{main.employeecost.field.name}">Name</th>
          <th th:text="#{main.employeecost.category.employees}">Aktuell zugeordnete Mitarbeiter</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(categories)}">
          <td colspan="2" class="text-center text-muted py-4" th:text="#{main.general.norecords.text}">Keine Einträge vorhanden</td>
        </tr>
        <tr th:each="category : ${categories}">
          <td>
            <a th:href="@{/budget/employee-cost/category(name=${category.name()})}"
               th:text="${category.name()}"></a>
          </td>
          <td th:if="${category.hasEmployees()}" th:text="${#strings.listJoin(category.employeeSigns(), ', ')}"></td>
          <td th:unless="${category.hasEmployees()}" class="text-muted">—</td>
        </tr>
      </tbody>
    </table>
  </div>

</main>
</html>
