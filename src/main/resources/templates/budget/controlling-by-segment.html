<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='controlling-by-segment',
        title=#{main.controlling.bysegment.title},sectionTitle=#{main.general.mainmenu.budget.text},
        pageTitle=#{main.controlling.bysegment.title},sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <!--
    Das Controlling aller budgetierten Aufträge, nach Kundensegment gruppiert (#779). Jede Zeile ist
    die Summenzeile eines Auftrags aus der Einzelansicht, und der Button daneben führt genau dorthin
    — mit demselben Zeitraum, damit die Zahlen dort wiedergefunden werden.

    Die Spalten entscheidet die Auswertung einmal für die ganze Seite: die Tabellen stehen
    untereinander, und wandernde Spalten würden Zeilen vergleichbar aussehen lassen, die es nicht
    sind. Deshalb nimmt jede Tabelle hier ${result.columns()} statt eigener Spalten.
  -->

  <!-- Filter form -->
  <div class="card mb-4">
    <div class="card-body">
      <form method="get" th:action="@{/budget/controlling/by-segment}" th:object="${filter}"
            class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label" th:text="#{main.controlling.filter.from}">Von</label>
          <input type="date" class="form-control" th:field="*{from}"/>
        </div>
        <div class="col-md-3">
          <label class="form-label" th:text="#{main.controlling.filter.until}">Bis</label>
          <input type="date" class="form-control" th:field="*{until}"/>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">
            <i class="icon ti ti-chart-bar"></i>
            <span th:text="#{main.controlling.button.show}">Auswerten</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="card" th:if="${result.isEmpty()}">
    <div class="card-body text-center text-muted py-3"
         th:text="#{main.controlling.empty}">Keine Daten im gewählten Zeitraum</div>
  </div>

  <div class="card mb-3" th:each="segment : ${result.segments()}">
    <div class="card-header d-flex align-items-center">
      <h3 class="card-title mb-0"
          th:text="${segment.hasSegment()} ? ${segment.segmentName()} : #{main.controlling.bysegment.nosegment}">
        Segment
      </h3>
      <div class="text-muted small ms-auto"
           th:text="#{main.controlling.bysegment.ordercount(${#lists.size(segment.orders())})}">5 Aufträge</div>
    </div>
    <div class="table-responsive">
      <table class="table table-vcenter card-table">
        <thead th:replace="~{budget/controlling-section :: headers(${result.columns()}, true, ${result.filter().getFrom()}, #{main.controlling.bysegment.col.order}, true)}"></thead>
        <tbody>
          <!-- th:each auf einem äußeren Block: th:replace hat die höhere Präzedenz und würde sonst
               vor der Schleife ausgewertet. -->
          <th:block th:each="order : ${segment.orders()}">
            <tr th:replace="~{budget/controlling-section :: row(${result.columns()}, ${order.total()}, true, 'small', '',
                              @{/budget/controlling(customerorderSign=${order.customerorderSign()},
                                from=${result.filter().getFrom()},until=${result.filter().getUntil()})})}"></tr>
          </th:block>
          <!-- Die Summenzeile führt nirgends hin und bekommt den leeren String, damit ihre Zellen
               unter denen der Auftragszeilen bleiben. -->
          <tr th:replace="~{budget/controlling-section :: row(${result.columns()}, ${segment.total()}, true, 'fw-bold', 'table-active fw-bold', '')}"></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>
</html>
