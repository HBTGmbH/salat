<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='controlling',
        title=#{main.controlling.title},sectionTitle=#{main.general.mainmenu.budget.text},
        pageTitle=#{main.controlling.title},sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <!-- Filter form -->
  <div class="card mb-4">
    <div class="card-body">
      <form method="get" th:action="@{/budget/controlling}" th:object="${filter}" class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label" th:text="#{main.controlling.filter.customerorder}">Auftrag</label>
          <select class="form-select tomselect" th:field="*{customerorderSign}">
            <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag wählen ---</option>
            <option th:each="co : ${customerorders}"
                    th:value="${co.sign}"
                    th:text="|${co.sign} - ${co.shortdescription}|"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label" th:text="#{main.controlling.filter.from}">Von</label>
          <input type="date" class="form-control" th:field="*{from}"/>
        </div>
        <div class="col-md-2">
          <label class="form-label" th:text="#{main.controlling.filter.until}">Bis</label>
          <input type="date" class="form-control" th:field="*{until}"/>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">
            <i class="icon ti ti-chart-bar"></i>
            <span th:text="#{main.controlling.button.show}">Auswerten</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Error -->
  <div class="alert alert-danger" th:if="${controllingError != null}" th:text="${controllingError}"></div>

  <!-- One evaluation per budget period, plus one for the time no plan covers -->
  <div class="card" th:if="${result != null and result.isEmpty()}">
    <div class="card-body text-center text-muted py-3" th:text="#{main.controlling.empty}">Keine Daten im gewählten Zeitraum</div>
  </div>

  <div class="card mb-3" th:each="section : ${result?.sections()}">
    <div class="card-header d-block">
      <h3 class="card-title mb-0" th:text="#{${'main.controlling.section.' + section.kind().name()}}">Auswertung</h3>
      <div class="text-muted small">
        <span th:if="${section.period() != null}"
              th:text="|${#temporals.format(section.period().getFrom(), 'dd.MM.yyyy')} – ${#temporals.format(section.period().getUntil(), 'dd.MM.yyyy')}|"></span>
        <span th:if="${not #lists.isEmpty(section.budgetNames())}"
              th:text="' · ' + ${#strings.listJoin(section.budgetNames(), ', ')}"></span>
      </div>
    </div>
    <div class="table-responsive"
         th:replace="~{budget/controlling-section :: table(${section}, ${isManager})}"></div>
  </div>

</main>
</html>
