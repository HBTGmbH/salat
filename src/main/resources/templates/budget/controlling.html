<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="
        section='budget',
        subSection='controlling',
        title=#{main.controlling.title},sectionTitle=#{main.general.mainmenu.budget.text},
        pageTitle=#{main.controlling.title},sectionTitle=#{main.general.mainmenu.budget.text}
">
<main layout:fragment="content">

  <!-- Filter form -->
  <div class="card mb-4">
    <div class="card-body">
      <form method="get" th:action="@{/budget/controlling}" th:object="${filter}" class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label" th:text="#{main.controlling.filter.customerorder}">Auftrag</label>
          <select class="form-select tomselect" th:field="*{customerorderSign}">
            <option value="" th:text="#{main.customerorder.select.please}">--- Auftrag wählen ---</option>
            <option th:each="co : ${customerorders}"
                    th:value="${co.sign}"
                    th:text="|${co.sign} - ${co.shortdescription}|"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label" th:text="#{main.controlling.filter.from}">Von</label>
          <input type="date" class="form-control" th:field="*{from}"/>
        </div>
        <div class="col-md-2">
          <label class="form-label" th:text="#{main.controlling.filter.until}">Bis</label>
          <input type="date" class="form-control" th:field="*{until}"/>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">
            <i class="icon ti ti-chart-bar"></i>
            <span th:text="#{main.controlling.button.show}">Auswerten</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Error -->
  <div class="alert alert-danger" th:if="${controllingError != null}" th:text="${controllingError}"></div>

  <!-- One evaluation per budget period, plus one for the time no plan covers -->
  <div class="card" th:if="${result != null and result.isEmpty()}">
    <div class="card-body text-center text-muted py-3" th:text="#{main.controlling.empty}">Keine Daten im gewählten Zeitraum</div>
  </div>

  <div class="card mb-3" th:each="section : ${result?.sections()}">
    <!--
      Four lines: what is being looked at (order, customer) and which budget answers for it (name
      with its kind, and the plan's own validity). The evaluated window sits in the filter above the
      card; the period here is the one of the plan, which is usually the longer of the two.
    -->
    <div class="card-header d-flex align-items-start">
      <div class="me-auto">
        <h3 class="card-title mb-0"
            th:text="|${result.customerorderSign()} ${result.customerorderDescription()}|">1612 SST 2025-2028</h3>
        <div th:if="${result.customerName() != null}"
             th:text="|${result.customerShortname()} ${result.customerName()}|">Kunde</div>
        <div class="text-muted small">
          <span th:if="${not #lists.isEmpty(section.budgetNames())}"
                th:text="${#strings.listJoin(section.budgetNames(), ', ')} + ' '"></span>
          <span th:text="${#lists.isEmpty(section.budgetNames())}
                         ? #{${'main.controlling.section.' + section.kind().name()}}
                         : '(' + #{${'main.controlling.section.' + section.kind().name()}} + ')'">Auftragsweites Budget</span>
        </div>
        <div class="text-muted small" th:if="${section.hasPlanPeriod()}"
             th:text="|${#temporals.format(section.planFrom(), 'dd.MM.yyyy')} – ${#temporals.format(section.planUntil(), 'dd.MM.yyyy')}|">
          01.01.2026 – 31.12.2999
        </div>
        <div class="text-muted small" th:if="${section.kind().name() == 'UNPLANNED'}"
             th:text="#{main.controlling.section.UNPLANNED.hint}">Diese Buchungen zählen gegen kein Budget.</div>
      </div>
      <!-- Straight into the bulk assignment, order and period already filled in (#913) -->
      <a class="btn btn-outline-primary btn-sm ms-2"
         th:if="${section.kind().name() == 'UNPLANNED' and isManager}"
         th:href="@{/budget/bulk-assignment(customerorderSign=${result.customerorderSign()},
                    from=${result.filter().getFrom()},until=${result.filter().getUntil()})}">
        <i class="icon ti ti-arrow-right"></i>
        <span th:text="#{main.controlling.section.UNPLANNED.assign}">Zuordnen</span>
      </a>
    </div>
    <div th:replace="~{budget/controlling-section :: table(${section}, ${isManager}, ${result.filter().getFrom()})}"></div>
  </div>

</main>
</html>
