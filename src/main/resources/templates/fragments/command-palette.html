<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Die Befehlspalette (#1155, ADR-0030). Sie liegt einmal in layout/base.html; das Verhalten
       steht in salat.js, kein Template bringt dafuer eigenes JavaScript mit.

       Ein natives <dialog> statt eines Bootstrap-Modals: showModal() oeffnet synchron und ohne
       Ueberblendung, der Fokus steht also im Feld, bevor der naechste Buchstabe ankommt. Ein
       Modal nimmt die Tastatur erst nach seiner Einblendung an.

       Was die Palette anbietet, liest sie aus der gerenderten Seite: die Navigation aus der
       Sidebar, die Einstellungen aus den Bedienelementen mit data-palette-command (Moduswechsel
       und Einstellungsseite in der Kopfzeile, der Faltknopf der Sidebar). Hier stehen nur die
       Texte, die es auf der Seite sonst nicht gibt - die Woerter fuer die Tagesspruenge, die
       Gruppen und die Bedienhinweise. Heute ist der Tag des Servers, damit "gestern" denselben Tag
       meint wie die Einzeluebersicht: die Seite bringt Uhrzeit und Zeitzone des Servers mit.

       Nur die Geschaeftsobjekte kommen vom Server (#1157, ADR-0031): data-search-url ist die
       Objektsuche, deren Fragment salat.js unter die Treffer der Seite haengt. */-->
<dialog th:fragment="commandPalette" id="commandPalette" class="command-palette p-0"
        aria-labelledby="commandPaletteTitle"
        th:with="now=${@serverTimeHelper.epochMillis}, zone=${@serverTimeHelper.timeZone}"
        th:data-now="${now}"
        th:data-time-zone="${zone}"
        th:data-search-url="@{/palette/search}"
        th:data-targets-more="#{main.palette.targets.more}"
        th:data-daily-url="@{/dailyreport/daily}"
        th:data-label-daily="#{main.general.mainmenu.daily.text}"
        th:data-kind-day="#{main.palette.kind.day}"
        th:data-kind-settings="#{main.palette.kind.settings}"
        th:data-group-recent="#{main.palette.group.recent}"
        th:data-group-pages="#{main.palette.group.pages}"
        th:data-day-today="#{main.palette.day.today}"
        th:data-day-yesterday="#{main.palette.day.yesterday}"
        th:data-day-daybeforeyesterday="#{main.palette.day.daybeforeyesterday}"
        th:data-day-tomorrow="#{main.palette.day.tomorrow}"
        th:data-weekdays="|#{main.matrixoverview.weekdays.monday.text},#{main.matrixoverview.weekdays.tuesday.text},#{main.matrixoverview.weekdays.wednesday.text},#{main.matrixoverview.weekdays.thursday.text},#{main.matrixoverview.weekdays.friday.text},#{main.matrixoverview.weekdays.saturday.text},#{main.matrixoverview.weekdays.sunday.text}|">
  <h2 class="visually-hidden" id="commandPaletteTitle" th:text="#{main.palette.title}">Befehlspalette</h2>
  <div class="command-palette-search">
    <i class="ti ti-search text-secondary" aria-hidden="true"></i>
    <!--/* Die Ziele eines Objekts (#1157): die Zeile sagt, von welcher Suche und welchem Treffer sie
           kommen; der Knopf fuehrt zurueck wie ←. */-->
    <span class="command-palette-crumb" id="commandPaletteCrumb" hidden>
      <button type="button" class="btn btn-ghost-secondary btn-icon command-palette-back" data-palette-back
              th:aria-label="#{main.palette.targets.back}" th:title="#{main.palette.targets.back}">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
      </button>
      <span class="text-secondary command-palette-crumb-query" data-part="query"></span>
      <span class="text-secondary" aria-hidden="true">›</span>
      <span class="command-palette-crumb-object" data-part="object"></span>
    </span>
    <input type="text" class="command-palette-input" id="commandPaletteInput"
           role="combobox" aria-autocomplete="list" aria-expanded="true"
           aria-controls="commandPaletteList"
           autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
           th:aria-label="#{main.palette.input.label}"
           th:placeholder="#{main.palette.input.placeholder}"/>
    <!--/* Auf dem Telefon gibt es kein Esc, und eine lange Trefferliste laesst vom Hintergrund zum
           Danebentippen nichts uebrig. */-->
    <button type="button" class="btn btn-ghost-secondary btn-icon command-palette-close"
            data-command-palette-close
            th:aria-label="#{main.button.close}" th:title="#{main.button.close}">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>
  </div>
  <!--/* tabindex="-1": eine Liste, die scrollt, nehmen Chrome und Firefox sonst in die
         Tab-Reihenfolge auf - der Fokus gehoert aber ins Feld, dort wirken Pfeile und Enter. */-->
  <div class="command-palette-list" id="commandPaletteList" role="listbox" tabindex="-1"
       th:aria-label="#{main.palette.title}"></div>
  <!--/* Der Text kommt erst mit dem leeren Ergebnis hinein: eine Statusregion, die zusammen mit
         ihrem Inhalt erscheint, liest ein Screenreader nicht vor. */-->
  <div class="command-palette-empty text-secondary" id="commandPaletteEmpty" role="status"
       th:data-text="#{main.palette.empty}"></div>
  <div class="command-palette-footer text-secondary small" aria-hidden="true">
    <span><kbd>↑</kbd> <kbd>↓</kbd> <span th:text="#{main.palette.hint.select}">auswählen</span></span>
    <span><kbd>↵</kbd> <span th:text="#{main.palette.hint.run}">ausführen</span></span>
    <span><kbd>→</kbd> <span th:text="#{main.palette.hint.targets}">Ziele</span></span>
    <span><kbd>Esc</kbd> <span th:text="#{main.palette.hint.close}">schließen</span></span>
  </div>
</dialog>

</body>
</html>
