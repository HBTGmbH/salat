<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  The matrix of one month for one contract: table, sum rows and the footer with actual, target and
  difference. Shown on the matrix overview and on the dashboard (#878); the month navigation and the
  action "Rest nicht gearbeitet" stay with the overview, which is why they are not part of it.
  Styles and script come along as fragments of their own, so both pages include the same ones.
  The table keeps its id: script, styles and tests find it as #matrix, and a page shows it once.
*/-->

<style th:fragment="matrixStyles">
  .matrix-first-col {
    background: var(--tblr-card-bg, var(--tblr-body-bg));
    border-right: 1.5px solid;
    color:  var(--tblr-table-color) !important;
  }
  .matrix-last-col {
    border-left: 1.5px solid;
    color: var(--tblr-table-color) !important;
  }
  .matrix-day-col:not(:last-child) {
    border-right: 1px solid;
  }
  #matrix > thead {
    border-bottom: 1.5px solid;
  }
  #matrix > thead * th {
    color:  var(--tblr-table-color);
  }

  #matrix > tbody * td:not(:last-child):not(.matrix-first-col) {
    border-right: 1px solid;
  }

  #matrix > tfoot * td:not(:last-child):not(.matrix-first-col) {
    border-right: 1px solid;
  }

  /* Der Rand nimmt die Farbe der Fuellung; in der Schriftfarbe waere er auf dem Rot weiss. */
  #matrix > tfoot * td.matrix-error {
    border: 1.5px solid var(--salat-danger-fill) !important;
  }

  #matrix > tfoot {
    border-top: 1.5px solid;
  }
  #matrix > tfoot > tr:first-child {
    border-bottom: 1.5px solid;
  }
  #matrix > tfoot > tr:first-child > td {
    font-weight: bold;
  }
  #matrix > tfoot > tr > td:first-child {
    text-align: right;
  }
  .matrix-day-col { min-width: 2.5rem; }
  #matrix > thead th.matrix-day-col {
    cursor: pointer;
  }
  #matrix .matrix-col-hover {
    background-color: var(--salat-day-hover-bg) !important;
    color: var(--salat-day-hover-color) !important;
  }
  #matrix thead .matrix-col-hover {
    background-color: var(--salat-day-hover-head-bg) !important;
  }
  /* Fehlerzellen tragen das satte Rot der roten Badge mit heller Schrift (--salat-danger-fill in
     salat.css, 4,8:1). Die Regel steht nach dem Spalten-Hover: ein Fehler bleibt auch dann rot. */
  #matrix .matrix-error {
    background-color: var(--salat-danger-fill) !important;
    color: var(--tblr-white) !important;
  }
  /* Heute traegt an beiden Enden der Spalte einen Balken: oben an der Kopfzelle, unten an der
     letzten Zeile der Tabelle. Ein Rahmen wuerde in der zusammengelegten Tabelle die ganze Zeile
     verschieben; der Schatten liegt innen und vor Tablers eigenem Zustandsschatten der Zelle. An
     einem nicht gearbeiteten Tag reicht die Zelle in Beginn ueber Pause und Ende hinweg. */
  #matrix { --matrix-today-bar: 4px; }
  #matrix > thead .matrix-today {
    box-shadow: inset 0 var(--matrix-today-bar) 0 var(--salat-today),
                inset 0 0 0 9999px var(--tblr-table-bg-state, var(--tblr-table-bg-type, var(--tblr-table-accent-bg)));
  }
  #matrix > tfoot > tr:last-child > .matrix-today,
  #matrix > tfoot td[rowspan="3"].matrix-today {
    box-shadow: inset 0 calc(-1 * var(--matrix-today-bar)) 0 var(--salat-today),
                inset 0 0 0 9999px var(--tblr-table-bg-state, var(--tblr-table-bg-type, var(--tblr-table-accent-bg)));
  }
  .matrix-today-legend {
    box-shadow: inset 0 3px 0 var(--salat-today), inset 0 -3px 0 var(--salat-today);
  }
  /* Das Zebra mischt gegen die Textfarbe statt gegen Schwarz bzw. Weiss und dreht sich damit mit
     dem Farbmodus von selbst - eine Regel statt zweier. Ergebnis hell #f7f8f8, dunkel #27303e. */
  .matrix-row-even td:not([class*="bg-"]) {
    background-color: color-mix(in srgb, var(--tblr-body-color) 4%, transparent);
  }
  .matrix-detail-popover.popover {
    border: none;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.22);
    max-width: 360px;
  }
  /* Die Glasflaeche leitet sich aus der Kartenflaeche her und folgt damit dem Farbmodus; die
     Pfeilfarbe nimmt dieselbe Mischung. Die Schattenwerte bleiben rgba - dafuer gibt es in Tabler
     kein Token. */
  .matrix-detail-popover .popover-body {
    background: color-mix(in srgb, var(--tblr-bg-surface) 85%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
  }
  [data-bs-theme="dark"] .matrix-detail-popover.popover {
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 3px rgba(255, 255, 255, 0.18);
  }
  .matrix-detail-popover .popover-arrow::after {
    border-top-color: color-mix(in srgb, var(--tblr-bg-surface) 85%, transparent);
  }
</style>

<th:block th:fragment="matrixTable(matrixData, showBeginBreakEnd, showNotWorked)">
<div class="table-responsive">
  <table class="table table-vcenter table-sm card-table" id="matrix">

    <thead>
      <tr>
        <th class="matrix-first-col text-nowrap"
            th:text="#{main.matrixoverview.table.order}">Auftrag</th>
        <th th:each="dh : ${matrixData.dayHeaders}"
            class="text-center matrix-day-col px-1 text-nowrap"
            th:classappend="${dh.publicHoliday ? 'bg-warning-lt ' : (dh.weekend ? 'bg-azure-lt ' : '')} + ${dh.today ? 'matrix-today' : ''}"
            th:title="${dh.holidayName}"
            th:attr="data-daily-url=@{/dailyreport/daily(mode='daily',date=${dh.date})}">
          [[${dh.day}]]<br>
          <span style="font-size:0.7rem"
                th:text="${#strings.substring(#messages.msg(dh.weekdayKey), 0, 2)}">Mo</span>
          <!--/* Fuer den Namen ist die Spalte zu schmal: Tooltip, und fuer Screenreader steht er im Text.
                 Auf dem Smartphone fuehrt ein Tipp in die Tagesansicht, die ihn nennt. */-->
          <span th:if="${dh.holidayName != null}" class="visually-hidden" th:text="${dh.holidayName}"></span>
        </th>
        <th class="matrix-last-col text-center px-1 fw-bold text-nowrap"
            th:text="#{main.matrixoverview.table.sum.text}">Σ</th>
      </tr>
    </thead>

    <tbody>

      <!-- Empty state -->
      <tr th:if="${#lists.isEmpty(matrixData.rows) and #lists.isEmpty(matrixData.standbyRows)}">
        <td th:colspan="${#lists.size(matrixData.dayHeaders) + 2}" class="text-center py-3"
            th:text="#{main.matrixoverview.table.empty.text}">
          Keine Buchungen in diesem Monat.
        </td>
      </tr>

      <!--/* th:each and th:replace on one element would run the replace first, leaving the
             iteration variable undefined - the block keeps the two apart */-->
      <th:block th:each="row, rs : ${matrixData.rows}">
        <tr th:replace="~{fragments/matrix-row :: matrixRow(${row}, ${rs.even}, ${matrixData.dayHeaders}, false)}"></tr>
      </th:block>

    </tbody>

    <tfoot>
      <tr class="table-group-divider fw-medium">
        <td class="matrix-first-col text-nowrap"
            th:text="#{main.matrixoverview.table.overall.text}">GESAMT</td>
        <td th:each="fd, fs : ${matrixData.footerDays}"
            class="text-center px-1"
            th:classappend="${matrixData.dayHeaders[fs.index].today ? 'matrix-today ' : ''} + ${fd.totalError ? 'matrix-error' : (fd.publicHoliday ? 'bg-warning-lt' : (fd.weekend ? 'bg-azure-lt' : ''))}">
          <span th:if="${not fd.empty}" th:text="${fd.workingTimeString}">7:30</span>
          <!--/* ohne Beginn, Pause und Ende (externer Vertrag) steht die Markierung hier, #1159 */-->
          <th:block th:if="${showNotWorked and fd.notWorked and not showBeginBreakEnd}"><span
              th:replace="~{fragments/not-worked :: badge(true)}"></span></th:block>
        </td>
        <td class="matrix-last-col text-center px-1 fw-bold" th:text="${matrixData.totalString}">0:00</td>
      </tr>

      <!--/* Standby below the sum row: own row totals, no share in any sum of the day or month (#463) */-->
      <th:block th:each="row, rs : ${matrixData.standbyRows}">
        <tr th:replace="~{fragments/matrix-row :: matrixRow(${row}, ${rs.even}, ${matrixData.dayHeaders}, true)}"></tr>
      </th:block>

      <!--/* An einem nicht gearbeiteten Tag bleiben Beginn, Pause und Ende leer; die Zelle in der Zeile
             Beginn reicht deshalb ueber alle drei und traegt die Markierung, in Pause und Ende entfaellt
             sie fuer diesen Tag (#1159). cellIndex zaehlt in diesen beiden Zeilen danach nicht mehr die
             Spalte - matrixScript rechnet sie deshalb aus dem Raster. */-->
      <tr th:if="${showBeginBreakEnd}" class="small">
        <td class="matrix-first-col text-nowrap" th:text="#{main.matrixoverview.table.startofwork.text}">Beginn</td>
        <th:block th:each="fd, fs : ${matrixData.footerDays}">
          <td th:if="${showNotWorked and fd.notWorked}" rowspan="3"
              class="text-center px-1"
              th:classappend="${matrixData.dayHeaders[fs.index].today ? 'matrix-today ' : ''} + ${fd.publicHoliday ? 'bg-warning-lt' : (fd.weekend ? 'bg-azure-lt' : '')}">
            <span th:replace="~{fragments/not-worked :: badge(true)}"></span>
          </td>
          <td th:unless="${showNotWorked and fd.notWorked}"
              class="text-center px-1"
              th:classappend="${matrixData.dayHeaders[fs.index].today ? 'matrix-today ' : ''} + ${fd.beginError ? 'matrix-error' : (fd.publicHoliday ? 'bg-warning-lt' : (fd.weekend ? 'bg-azure-lt' : ''))}">
            <span th:if="${fd.beginString != null}" th:text="${fd.beginString}">08:00</span>
          </td>
        </th:block>
        <td class="matrix-last-col"></td>
      </tr>

      <tr th:if="${showBeginBreakEnd}" class="small">
        <td class="matrix-first-col text-nowrap" th:text="#{main.matrixoverview.table.breakduration.text}">Pause</td>
        <td th:each="fd, fs : ${matrixData.footerDays}"
            th:unless="${showNotWorked and fd.notWorked}"
            class="text-center px-1"
            th:classappend="${matrixData.dayHeaders[fs.index].today ? 'matrix-today ' : ''} + ${fd.breakError ? 'matrix-error' : (fd.publicHoliday ? 'bg-warning-lt' : (fd.weekend ? 'bg-azure-lt' : ''))}">
          <span th:if="${fd.breakString != null}" th:text="${fd.breakString}">0:30</span>
        </td>
        <td class="matrix-last-col"></td>
      </tr>

      <tr th:if="${showBeginBreakEnd}" class="small">
        <td class="matrix-first-col text-nowrap" th:text="#{main.matrixoverview.table.endofwork.text}">Ende</td>
        <td th:each="fd, fs : ${matrixData.footerDays}"
            th:unless="${showNotWorked and fd.notWorked}"
            class="text-center px-1"
            th:classappend="${matrixData.dayHeaders[fs.index].today ? 'matrix-today ' : ''} + ${fd.publicHoliday ? 'bg-warning-lt' : (fd.weekend ? 'bg-azure-lt' : '')}">
          <span th:if="${fd.endString != null}" th:text="${fd.endString}">17:00</span>
        </td>
        <td class="matrix-last-col"></td>
      </tr>

    </tfoot>

  </table>
</div>

<div class="card-footer d-flex gap-3 flex-wrap align-items-center">
  <span th:if="${matrixData.totalString != null}">
    <span th:text="#{main.matrixoverview.headline.actualtime.text}">IST-Stunden:</span>
    <strong th:text="${matrixData.totalString}">0:00</strong>
  </span>
  <span th:if="${matrixData.targetString != null}">
    <span th:text="#{main.matrixoverview.headline.targettime.text}">SOLL-Stunden:</span>
    <strong th:text="${matrixData.targetString}">0:00</strong>
  </span>
  <span th:if="${matrixData.diffString != null}"
        th:classappend="${matrixData.diffNegative ? 'text-warning' : 'text-success'}">
    <span th:text="#{main.matrixoverview.headline.difference.text}">Differenz:</span>
    <strong th:text="${matrixData.diffString}">+0:00</strong>
  </span>
  <span th:if="${matrixData.prevDayDiffString != null}"
        th:classappend="${matrixData.prevDayDiffNegative ? 'text-warning' : 'text-success'}">
    <span th:text="#{main.matrixoverview.headline.prevdaydiff.text}">Stand gestern:</span>
    <strong th:text="${matrixData.prevDayDiffString}">+0:00</strong>
  </span>
  <span class="ms-auto small">
    <span class="badge badge-tint bg-azure-lt me-1" th:text="#{main.matrixoverview.legend.weekend.text}">Sa/So</span>
    <span class="badge badge-tint bg-warning-lt me-1" th:text="#{main.matrixoverview.legend.publicholiday.text}">Feiertag</span>
    <span class="me-1" th:if="${showNotWorked}"><span th:replace="~{fragments/not-worked :: badge(false)}"></span></span>
    <span class="badge me-1 matrix-today-legend" th:text="#{main.daily.nav.today.text}">Heute</span>
  </span>
</div>
</th:block>

<script th:fragment="matrixScript">
document.querySelectorAll('td .matrix-cell-detail').forEach(detail => {
  new tabler.bootstrap.Popover(detail.closest('td'), {
    html: true,
    content: detail.innerHTML,
    trigger: 'hover focus',
    placement: 'top',
    customClass: 'matrix-detail-popover'
  });
});

// Whole-column click and hover highlight → daily report for that day
(function () {
  const table = document.getElementById('matrix');
  const headers = Array.from(table.querySelectorAll('thead th'));

  // The column of every cell, laid out from the grid: a not-worked day spans Beginn, Pause and Ende
  // with one cell (#1159), so cellIndex and nth-child count one short in the two rows below it.
  const columnOf = new Map();
  const cellsByColumn = [];
  const covered = [];
  Array.from(table.rows).forEach((row, r) => {
    let col = 0;
    Array.from(row.cells).forEach(cell => {
      while (covered[r]?.[col]) col++;
      columnOf.set(cell, col);
      (cellsByColumn[col] ??= []).push(cell);
      for (let below = 1; below < cell.rowSpan; below++) (covered[r + below] ??= [])[col] = true;
      col += cell.colSpan;
    });
  });

  function cellsInColumn(colIdx) {
    return cellsByColumn[colIdx] ?? [];
  }

  // Apply pointer cursor to every cell in a navigable day column
  headers.forEach((th, i) => {
    if (th.dataset.dailyUrl) cellsInColumn(i).forEach(c => c.style.cursor = 'pointer');
  });

  // Column hover highlight
  let activeColIdx = -1;
  table.addEventListener('mouseover', e => {
    const cell = e.target.closest('td, th');
    if (!cell) return;
    const colIdx = columnOf.get(cell);
    if (colIdx === activeColIdx) return;
    cellsInColumn(activeColIdx).forEach(c => c.classList.remove('matrix-col-hover'));
    activeColIdx = colIdx;
    if (headers[colIdx]?.dataset.dailyUrl) {
      cellsInColumn(colIdx).forEach(c => c.classList.add('matrix-col-hover'));
    }
  });
  table.addEventListener('mouseleave', () => {
    cellsInColumn(activeColIdx).forEach(c => c.classList.remove('matrix-col-hover'));
    activeColIdx = -1;
  });

  // Click
  table.addEventListener('click', e => {
    const cell = e.target.closest('td, th');
    if (!cell) return;
    const url = headers[columnOf.get(cell)]?.dataset.dailyUrl;
    if (url) location.href = url;
  });
}());
</script>

</body>
</html>
