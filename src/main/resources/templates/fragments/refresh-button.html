<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  „Aktualisieren" im Kopf einer Liste, die sich im Hintergrund ändert (#1286, #1287): ein Lauf, der
  weiterläuft, nachdem die Seite zurückgekehrt ist, und die geplanten Läufe dazu. Ein Fragment,
  damit der Knopf in jeder solchen Liste gleich aussieht und an derselben Stelle sitzt — rechts im
  Kopf der Liste. Den Rahmen dafür setzt die Seite: card-actions neben einem Kartentitel, oder die
  Zeile über der Liste, wenn die Liste in einem Tab steht.

  Klein (btn-sm): ein Knopf in voller Höhe machte einen Kartenkopf höher als seine Nachbarn, und
  neben Tabs säßen die Tabs nicht mehr auf seiner Unterkante.

  Ein Link auf die Liste, kein location.reload(): der UiState-Filter ergänzt die gemerkten Filter,
  wenn der Parameter fehlt, und der Link geht auch ohne Skript und mit mittlerer Maustaste. Steht die
  Liste in einem Tab, gibt die Seite den Tab als Fragment im href mit; dass ein solcher Link die
  Seite trotzdem neu lädt, besorgt salat.js (data-refresh-link).

  Beschriftet wie die Exportknöpfe der Buchungsliste: Icon und Text, der Text ist der zugängliche
  Name. Keine eigene Farbe, btn-outline-secondary trägt beide Farbmodi.
*/-->
<a th:fragment="refreshButton(href)" class="btn btn-sm btn-outline-secondary" th:href="${href}" data-refresh-link>
  <i class="icon ti ti-refresh" aria-hidden="true"></i><span th:text="#{main.general.button.refresh}">Aktualisieren</span>
</a>

</body>
</html>
