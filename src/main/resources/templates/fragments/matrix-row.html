<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  One order line of the matrix overview. Used twice: for the orders above the sum row and for the
  standby orders below it (#463), which are the same line with a marker and no share in any sum.
*/-->
<tr th:fragment="matrixRow(row, even, dayHeaders, standby)"
    th:classappend="${even ? 'matrix-row-even' : ''}">
  <td class="matrix-first-col text-nowrap">
    <span class="small nowrap" style="display: block">
      <!--/* the marker sits in the first line and is icon-only: the order column is narrow (#463) */-->
      <i th:if="${standby}" class="ti ti-bell text-orange me-1" data-standby-badge
         th:title="#{main.matrixoverview.table.standby.hint}"></i>
      <span th:text="|${row.customerOrderSign} · ${row.customerOrderDesc} · ${row.customer}|">1417 · Alpha · Kunde</span>
    </span>
    <span style="display: block" th:text="|${row.suborderSign} · ${row.suborderDesc}|">01 · DEV-BACKEND</span>
  </td>
  <td th:each="cell, cs : ${row.cells}"
      class="text-center px-1"
      th:classappend="${dayHeaders[cs.index].today ? 'matrix-today ' : ''} + ${cell.publicHoliday ? 'bg-warning-lt' : (cell.weekend ? 'bg-azure-lt' : '')}">
    <span th:if="${not cell.empty}" th:text="${cell.durationString}">7:30</span>
    <!--/* #1469: the cell earns a time surcharge, the details below name each flag */-->
    <i th:if="${cell.surchargeCredit != null and !cell.surchargeCredit.zero}" class="ti ti-percentage text-teal ms-1"
       th:with="surchargeTitle=#{main.surcharge.matrix.title(${@surchargeViewHelper.credit(cell.surchargeCredit)})}"
       th:title="${surchargeTitle}" th:aria-label="${surchargeTitle}"></i>
    <!--/* the ticket references stand before the comment, as they did in it before #1326 */-->
    <div th:if="${not cell.empty and not #lists.isEmpty(cell.details)}" class="matrix-cell-detail d-none">
      <div th:each="d : ${cell.details}"
           th:with="label=${#strings.trim(#strings.listJoin(d.ticketReferences, ' ') + ' ' + (d.taskDescription ?: ''))}"
           class="text-start py-1">
        <span th:text="${d.durationString + (label ne '' ? ': ' + label : '')}">1:00: MOS-16345 did something</span>
        <span th:if="${d.surchargeKind != null}" class="badge bg-teal-lt ms-1"
              th:text="${@surchargeViewHelper.flagWithCredit(d.surchargeKind, d.surchargePercent, d.surchargeCredit)}">Nacht 25 % · +1:00</span>
      </div>
    </div>
  </td>
  <td class="matrix-last-col text-center px-1 fw-medium" th:text="${row.totalString}">0:00</td>
</tr>

</body>
</html>
