<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  Suborder select bound to the field "suborderId", holding the id of the suborder (#1205); it shows
  the suborder by its complete order sign.
  Rendered twice: inline in the form, and again as an htmx out-of-band swap when the customer order
  changes, which is what the oob parameter is for. It uses name/th:selected rather than th:field
  because the out-of-band copy sits outside the form and has no th:object to bind against.
*/-->
<div th:fragment="suborderSelect(suborders, selected, oob)" class="mb-3" id="suborderIdInput"
     th:attr="hx-swap-oob=${oob}">
  <label class="form-label" for="suborderId"
         th:text="#{main.budget.field.suborderSign}">Unterauftrag</label>
  <select class="form-select tomselect" id="suborderId" name="suborderId"
          th:disabled="${#lists.isEmpty(suborders)}">
    <option value="" th:text="#{main.budget.field.suborderSign.none}">--- Kein Unterauftrag ---</option>
    <!--/* A hidden suborder only appears when the record already references it; say so. */-->
    <option th:each="so : ${suborders}"
            th:value="${so.id}"
            th:selected="${selected != null and selected == so.id}"
            th:with="subtext=${@suborderLabelViewHelper.subtext(so)}"
            th:attr="data-subtext=${subtext}"
            th:text="${@suborderLabelViewHelper.label(so)} + ${@hiddenMarkerViewHelper.suffix(so.hide)}"></option>
  </select>
</div>

</body>
</html>
