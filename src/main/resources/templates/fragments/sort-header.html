<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* A sortable column header, shared by the lists that sort in the query (booking list, ticket page):
       it names the column, shows the direction and hands the new value to the filter form on click.
       The same column twice turns the direction round. Reads sort and sortDescending of the page. */-->
<th th:fragment="sortHeader(column, label, cssClass)" th:class="${cssClass}">
  <a href="#" class="text-reset text-decoration-none text-nowrap"
     th:data-sort="${sort == column and !sortDescending} ? '-' + ${column} : ${column}">
    <span th:text="${label}">Spalte</span>
    <i th:if="${sort != column}" class="ti ti-arrows-sort opacity-50"></i>
    <i th:if="${sort == column and !sortDescending}" class="ti ti-sort-ascending"></i>
    <i th:if="${sort == column and sortDescending}" class="ti ti-sort-descending"></i>
  </a>
</th>

</body>
</html>
