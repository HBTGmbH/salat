<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:salat="http://hbt.de/salat/thymeleaf"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="section='reports',subSection='reports',title=${pageTitle},sectionTitle=#{main.general.mainmenu.reporting.text}">
<main layout:fragment="content">
  <form th:action="@{/reporting/reports/store}" th:object="${report}" method="post" class="card">
    <div class="card-body">
        <input type="hidden" th:field="*{id}" />

        <salat:textInput th:field="*{name}" th:label="'Report Name'" required="true" maxlength="255" />

        <!--/* The group (#1523): a manager chooses it, also a personal group or none. A people lead has no
               choice, their reports go into their personal group - shown, not asked. */-->
        <th:block th:if="${chooseGroup}">
          <salat:select th:field="*{groupId}" th:label="#{main.reporting.group.label}"
                        allowEmptyOption="true">
            <option value="" th:text="#{main.reporting.group.none.option}">— Ohne Gruppe —</option>
            <option th:each="group : ${groups}" th:value="${group.id()}"
                    th:text="${group.name()}"
                    th:attr="data-subtext=${group.personal()} ? #{main.reporting.group.personal} : null"></option>
          </salat:select>
        </th:block>
        <div class="mb-3" th:unless="${chooseGroup}">
          <div class="form-label" th:text="#{main.reporting.group.label}">Gruppe</div>
          <div>
            <i class="ti ti-user text-secondary me-1" aria-hidden="true"></i>
            <span th:text="${targetGroup.name()}">Person A</span>
            <span class="text-secondary small ms-2" th:text="#{main.reporting.group.personal}">persönliche Gruppe</span>
          </div>
        </div>

        <salat:textarea th:field="*{sql}" th:label="'SQL'" required="true" rows="15" monospace="true" th:helpText="${'Use named parameters like :startDate, :endDate'}" />
    </div>

    <div class="card-footer">
      <div th:replace="~{fragments/form-fields :: formButtons(
        saveLabel=${isEdit ? 'Save Report' : 'Create Report'},
        cancelHref=@{/reporting/reports}
      )}"></div>
    </div>
  </form>
  <div class="card mt-4">
    <div class="card-header">
      <h3>Authorizations</h3>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
          <tr>
            <th>User</th>
            <th>Access Level</th>
            <th>Validity</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="auth : ${reportAuthorizations}">
            <td th:text="${auth.userSign}">user</td>
            <td th:text="${auth.accessLevel}">WRITE</td>
            <td th:text="${auth.validity}">2024-01-01..</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</html>
