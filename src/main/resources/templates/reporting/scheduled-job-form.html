<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:salat="http://hbt.de/salat/thymeleaf"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="section='reports',subSection='scheduled-report-jobs',title=${pageTitle},sectionTitle=#{main.general.mainmenu.reporting.text}">
<main layout:fragment="content">
  <div class="card">
    <div class="card-body">
      <form th:action="@{/reporting/jobs/store}" th:object="${job}" method="post">

        <input type="hidden" th:field="*{id}" />

        <salat:textInput th:field="*{name}" th:label="'Job Name'" required="true" maxlength="255" />

        <salat:select th:field="*{reportDefinitionId}" th:label="'Report'" required="true">
          <option value="" th:text="'-- Select Report --'"></option>
          <option th:each="option : ${reportDefinitions}" th:value="${option.id}" th:text="${option.name}"></option>
        </salat:select>

        <salat:textarea th:field="*{reportParameters}" th:label="'Report Parameters (JSON)'" required="false" rows="5" monospace="true" th:helpText="#{reporting.scheduledjob.reportParameters.help}" />

        <salat:textarea th:field="*{recipientEmails}" th:label="'Recipient Emails'" required="true" rows="3" th:helpText="'Comma or semicolon separated email addresses'" />

        <div th:replace="~{fragments/form-fields :: checkboxSwitch(
          field='enabled', label='Enabled'
        )}"></div>

        <div th:replace="~{fragments/form-fields :: checkboxSwitch(
          field='suppressEmptyResults', label=#{reporting.scheduledjob.suppressEmptyResults.label}
        )}"></div>

        <salat:textInput th:field="*{cronExpression}" th:label="'Cron Expression (optional)'" required="false" maxlength="255" th:helpText="'Leave empty for default schedule (Daily at 5:00 AM)'" />

        <salat:textarea th:field="*{description}" th:label="'Description'" required="false" rows="3" />

        <div th:replace="~{fragments/form-fields :: formButtons(
          saveLabel='Save Scheduled Job', cancelHref=@{/reporting/jobs}
        )}"></div>

      </form>
    </div>
  </div>
  <div class="card mt-4" th:if="${scheduledTask != null}">
    <div class="card-body">
      <h3>Next execution</h3>
      <p th:text="${#temporals.format(scheduledTask.nextExecution, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01 05:00:00</p>
    </div>
  </div>
</main>
</html>
