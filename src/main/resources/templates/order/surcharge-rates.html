<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* The time surcharge rates (#1469), the same fields on the order and the suborder form. On the order
       an empty percent means no surcharge of that kind, on a suborder it inherits, and the hint under
       the field says what. The night times belong to the night rate and only count with it: a night
       percent above 0 makes them required (data-surcharge-night-percent, handled in salat.js). The unit
       stands next to the number as in the ticket reference setting of the same forms (#1326). */-->
<fieldset th:fragment="ratesInput(inheritable)" class="mb-3">
  <legend class="form-label" th:text="#{main.surcharge.section.title}">Zeitzuschläge aufs Arbeitszeitkonto</legend>
  <div class="row g-2">
    <div class="col-md-4">
      <label class="form-label" for="surchargeNightPercent" th:text="#{main.surcharge.kind.night}">Nacht</label>
      <div class="input-group" th:classappend="${#fields.hasErrors('surchargeRates.nightPercent')} ? 'has-validation'">
        <input type="number" class="form-control" id="surchargeNightPercent" min="0" max="1000" step="1"
               th:field="*{surchargeRates.nightPercent}" th:errorclass="is-invalid"
               data-surcharge-night-percent
               th:placeholder="${inheritable} ? #{main.surcharge.inherit.placeholder} : null"/>
        <span class="input-group-text">%</span>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('surchargeRates.nightPercent')}"
             th:errors="*{surchargeRates.nightPercent}"></div>
      </div>
    </div>
    <div class="col-6 col-md-4">
      <label class="form-label" for="surchargeNightFrom" th:text="#{main.surcharge.night.from}">Nacht von</label>
      <input type="text" class="form-control" id="surchargeNightFrom" th:field="*{surchargeRates.nightFrom}"
             th:errorclass="is-invalid" data-surcharge-night-time
             oninput="timeMask(event)" onblur="timeBlur(event)"
             inputmode="numeric" maxlength="5" placeholder="HH:MM"
             data-time-mode="time" data-time-step="15"
             th:attr="data-time-label-decrease=#{main.timeinput.decrease.tooltip},
                      data-time-label-increase=#{main.timeinput.increase.tooltip}"/>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('surchargeRates.nightFrom')}"
           th:errors="*{surchargeRates.nightFrom}"></div>
    </div>
    <div class="col-6 col-md-4">
      <label class="form-label" for="surchargeNightUntil" th:text="#{main.surcharge.night.until}">bis</label>
      <input type="text" class="form-control" id="surchargeNightUntil" th:field="*{surchargeRates.nightUntil}"
             th:errorclass="is-invalid" data-surcharge-night-time
             oninput="timeMask(event)" onblur="timeBlur(event)"
             inputmode="numeric" maxlength="5" placeholder="HH:MM"
             data-time-mode="time" data-time-step="15"
             th:attr="data-time-label-decrease=#{main.timeinput.decrease.tooltip},
                      data-time-label-increase=#{main.timeinput.increase.tooltip}"/>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('surchargeRates.nightUntil')}"
           th:errors="*{surchargeRates.nightUntil}"></div>
    </div>
  </div>
  <th:block th:if="${inheritable}">
    <small th:replace="~{:: inheritedHint(kind='NIGHT', oob=false)}"></small>
  </th:block>
  <div class="row g-2 mt-1">
    <div class="col-md-4" th:each="field : ${ {'saturday', 'sunday', 'holiday'} }"
         th:with="path=|surchargeRates.${field}Percent|">
      <label class="form-label" th:for="|surcharge${#strings.capitalize(field)}Percent|"
             th:text="#{|main.surcharge.kind.${field}|}">Samstag</label>
      <div class="input-group" th:classappend="${#fields.hasErrors(path)} ? 'has-validation'">
        <input type="number" class="form-control" th:id="|surcharge${#strings.capitalize(field)}Percent|"
               min="0" max="1000" step="1"
               th:field="*{__${path}__}" th:errorclass="is-invalid"
               th:placeholder="${inheritable} ? #{main.surcharge.inherit.placeholder} : null"/>
        <span class="input-group-text">%</span>
        <div class="invalid-feedback" th:if="${#fields.hasErrors(path)}" th:errors="*{__${path}__}"></div>
      </div>
      <th:block th:if="${inheritable}">
        <small th:replace="~{:: inheritedHint(kind=${#strings.toUpperCase(field)}, oob=false)}"></small>
      </th:block>
    </div>
  </div>
  <small class="form-hint mt-2" th:text="${inheritable} ? #{main.surcharge.suborder.help} : #{main.surcharge.order.help}">Gilt für alle Unteraufträge ohne eigenen Satz.</small>
</fieldset>

<!--/* swapped out of band when the order or the parent changes, see SuborderController */-->
<small th:fragment="inheritedHint(kind, oob)" class="form-hint" th:id="|surchargeInheritedHint-${kind}|"
       th:hx-swap-oob="${oob} ? 'true' : null"
       th:text="${@surchargeViewHelper.inherited(inheritedSurcharges, kind)}">Ohne eigenen Satz gilt: 25 %, vom Auftrag 4711.</small>

</body>
</html>
