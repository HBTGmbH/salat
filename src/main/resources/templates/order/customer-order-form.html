<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:salat="http://hbt.de/salat/thymeleaf"
      layout:decorate="~{layout/base}"
      th:with="section='orders',subSection='customerorders',title=${pageTitle},sectionTitle=#{main.general.mainmenu.orders.text}">
<main layout:fragment="content">

  <form th:action="@{/orders/customerorders/store}" th:object="${customerorderForm}" method="post" class="card">
    <div class="card-body">
      <input type="hidden" th:field="*{id}" />
      <th:block th:each="sid : *{storedResponsibleHbtIds}">
        <input type="hidden" name="storedResponsibleHbtIds" th:value="${sid}" />
      </th:block>
      <input type="hidden" th:field="*{storedRespContrEmployeeId}" />

      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label required" th:for="customerId" th:text="#{main.customerorder.customer.text}">Customer</label>
            <select class="form-select tomselect" id="customerId" th:field="*{customerId}"
                    th:errorclass="is-invalid" required>
              <option value="" th:text="#{main.general.selectone.text}">-- Select --</option>
              <option th:each="c : ${customers}"
                      th:value="${c.id}"
                      th:text="${@customerLabelViewHelper.label(c)} + ${@hiddenMarkerViewHelper.suffix(c.hide)}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></div>
          </div>
        </div>
        <!--/* #1536: only customers marked as intermediary; a stored one stays offered */-->
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label" th:for="intermediaryId" th:text="#{main.customerorder.intermediary.text}">Intermediary</label>
            <select class="form-select tomselect" id="intermediaryId" th:field="*{intermediaryId}"
                    th:errorclass="is-invalid">
              <option value="" th:text="#{main.customerorder.intermediary.none}">-- no intermediary --</option>
              <option th:each="c : ${intermediaries}"
                      th:value="${c.id}"
                      th:text="${@customerLabelViewHelper.label(c.shortname, c.name)} + ${@hiddenMarkerViewHelper.suffix(c.hide)}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('intermediaryId')}" th:errors="*{intermediaryId}"></div>
            <div class="form-text" th:text="#{main.customerorder.intermediary.hint}">Invoice attachments go to the intermediary.</div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{sign}" th:label="#{main.customerorder.sign.text}" required="true" maxlength="30"
                           th:readonly="${signLocked}"
                           th:helpText="${signLocked} ? #{main.order.sign.locked.help} : ''" />
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label" th:text="#{main.customerorder.orderType.text}">Order Type</label>
            <select class="form-select" id="orderType" th:field="*{orderType}">
              <option th:each="ot : ${orderTypes}"
                      th:value="${ot.name()}"
                      th:text="#{${ot.label}}"></option>
            </select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <salat:textInput th:field="*{description}" th:label="#{main.customerorder.description.text}" required="true" maxlength="255" />
        </div>
        <div class="col-md-4">
          <salat:textInput th:field="*{shortdescription}" th:label="#{main.customerorder.shortdescription.text}" required="false" maxlength="70" />
        </div>
        <div class="col-md-4">
          <salat:textInput th:field="*{orderCustomer}" th:label="#{main.customerorder.ordercustomer.text}" required="false" maxlength="30" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div th:replace="~{fragments/form-fields :: dateInput(
            field='validFrom', label=#{main.customerorder.validfrom.text}, required=true
          )}"></div>
        </div>
        <div class="col-md-6">
          <div th:replace="~{fragments/form-fields :: dateInput(
            field='validUntil', label=#{main.customerorder.validuntil.text}, required=false
          )}"></div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <salat:select th:field="*{responsibleHbtIds}" th:label="#{main.customerorder.responsiblehbt.execution.text}" required multiple>
            <option th:each="e : ${employees}" th:value="${e.id}" th:data-chip="${e.sign}"
                    th:text="${@employeeLabelViewHelper.label(e)} + ${@hiddenMarkerViewHelper.suffix(e.hide)}"></option>
          </salat:select>
        </div>
        <div class="col-md-6">
          <salat:select th:field="*{respContrEmployeeId}" th:label="#{main.customerorder.responsiblehbt.contract.text}" required>
            <option th:each="e : ${employees}" th:value="${e.id}"
                    th:text="${@employeeLabelViewHelper.label(e)} + ${@hiddenMarkerViewHelper.suffix(e.hide)}"></option>
          </salat:select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{responsibleCustomerTechnical}" th:label="#{main.customerorder.responsiblecustomer.tech.text}" required="true" maxlength="30" />
        </div>
        <div class="col-md-6">
          <salat:textInput th:field="*{responsibleCustomerContractually}" th:label="#{main.customerorder.responsiblecustomer.contract.text}" required="true" maxlength="30" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <salat:textInput th:field="*{debithours}" th:label="#{main.general.debithours.text}" required="false" maxlength="10" />
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label" th:text="#{main.general.debithoursunit.text}">Debit Unit</label>
            <select class="form-select" id="debithoursunit" th:field="*{debithoursunit}">
              <option value="" th:text="#{main.general.selectone.text}">--</option>
              <option value="0" th:text="#{main.general.totaltime.text}">Total</option>
              <option value="1" th:text="#{main.general.year.text}">Year</option>
              <option value="12" th:text="#{main.general.month.text}">Month</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div th:replace="~{order/ticket-reference-policy :: policyInput(inheritable=false)}"></div>
        </div>
      </div>

      <div th:replace="~{order/surcharge-rates :: ratesInput(inheritable=false)}"></div>

      <div th:replace="~{fragments/form-fields :: checkboxSwitch(
        field='hide', label=#{main.general.hide}
      )}"></div>

      <div class="row">
        <div class="col-md-6">
          <!--/* Tags (#847): existing ones are offered with their use, a new name is created on saving. */-->
          <salat:select th:field="*{tagNames}" th:label="#{main.tag.tags.text}" multiple allowCreate="true"
                        th:createLabel="#{main.tag.create.text}" th:data-tag-colors="${tagColors}">
            <option th:each="t : ${tagChoices}" th:value="${t.name}" th:text="${t.name}"
                    th:data-color="${t.color != null} ? ${t.color.cssName()} : null"
                    th:with="subtext=${@tagViewHelper.usage(t)}" th:attr="data-subtext=${subtext}"></option>
          </salat:select>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <div th:with="saveLabel=${isEdit} ? #{main.general.button.save.text} : #{main.general.button.create.text}"
           th:replace="~{fragments/form-fields :: formButtons(
             saveLabel=${saveLabel},
             cancelHref=@{/orders/customerorders}
           )}"></div>
    </div>
  </form>

</main>
</html>
