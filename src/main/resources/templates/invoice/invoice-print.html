<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{main.general.mainmenu.invoice.title.text} + ' / ' + ${invoiceData.customer.name} + ' / ' + ${invoiceData.customerOrderSign}">Invoice</title>
  <link rel="stylesheet" th:href="@{/style/print.css}" media="print"/>
  <link rel="stylesheet" th:href="@{/style/invoiceprint.css}" media="all"/>
  <style th:utext="${customCss}"></style>
</head>
<body>
  <div style="width: 95%; margin: 0 auto">
    <form onsubmit="javascript:window.print();return false;" class="hiddencontent">
      <div align="right">
        <input class="hiddencontent" type="submit" value="Drucken"/>
      </div>
      <div class="invoice_hint">
        <span th:text="#{main.invoice.scroll.text}"></span>
      </div>
    </form>
    <div>
      <img th:src="@{${logoUrl}}" class="hbt_logo" alt="Logo"/>
      <img th:if="${claimUrl}" th:src="@{${claimUrl}}" class="hbt_claim" alt="Claim"/>
    </div>
    <table style="clear: both; float: left">
      <tr>
        <td class="invoice_title" th:text="${invoiceForm.titleinvoiceattachment}"></td>
      </tr>
      <tr>
        <td class="invoice_address_line"></td>
      </tr>
      <tr>
        <td class="invoice_address_line" th:text="${invoiceForm.customername}"></td>
      </tr>
      <tr>
        <td class="invoice_address_line" th:utext="${invoiceForm.customeraddressFormatted}"></td>
      </tr>
      <tr th:if="${!#strings.isEmpty(invoiceForm.endcustomername)}">
        <td class="invoice_address_line">
          <span th:text="#{main.invoice.endcustomer.text}">Endkunde</span>: <span th:text="${invoiceForm.endcustomername}"></span>
        </td>
      </tr>
      <tr>
        <td class="invoice_address_line"></td>
      </tr>
      <tr>
        <td class="invoice_time_reference">
          <span th:text="#{main.invoice.daterange}">Zeitraum</span>:
          <span th:text="${#temporals.format(invoiceData.billingPeriod.from, 'dd.MM.yyyy')}"></span> -
          <span th:text="${#temporals.format(invoiceData.billingPeriod.until, 'dd.MM.yyyy')}"></span>
        </td>
      </tr>
    </table>
    <span style="float: right" class="invoice_date"><span th:text="#{main.invoice.asof.text}">Stand:</span> <span th:text="${#temporals.format(today, 'dd.MM.yyyy')}"></span></span>
    <br style="clear: both"/>
    <table width="100%" style="border-collapse: collapse">
      <!--/* the column titles once, repeated on every printed page; every group carries its subtotal in its own row (#217) */-->
      <thead>
        <tr th:replace="~{invoice/invoice-groups :: printHeader}"></tr>
      </thead>
      <th:block th:each="group : ${invoiceData.groups}">
        <th:block th:replace="~{invoice/invoice-groups :: printGroup(${group})}"></th:block>
      </th:block>
      <tbody>
        <tr class="invoice_totalsum_row">
          <td class="invoice_totalsum_row invoice_total_rule right" style="width: 100%" th:colspan="${dynamicColumnCount}" th:text="#{main.invoice.overall.text}"></td>
          <td class="invoice_totalsum_row invoice_total_rule nonproportional right" style="min-width: 2cm" th:text="${@durationUtils.format(invoiceData.totalDurationVisible)}"></td>
          <td class="invoice_totalsum_row invoice_total_rule nonproportional right" style="min-width: 2cm" th:text="${#numbers.formatDecimal(invoiceData.totalHoursVisible, 1, 2)}"></td>
        </tr>
      </tbody>
      <!--/* the time surcharges as positions of their own (#1470), unless they are part of the hours */-->
      <tbody th:unless="${#lists.isEmpty(invoiceData.surcharges)}">
        <tr class="invoice_suborder_row">
          <td class="invoice_suborder_row wrap" th:colspan="${dynamicColumnCount + 2}" th:text="#{main.invoice.surcharges.text}">Zeitzuschläge</td>
        </tr>
        <tr th:each="surcharge : ${invoiceData.surcharges}" class="invoice_booking_row">
          <td class="invoice_booking_row right" th:colspan="${dynamicColumnCount}" style="width: 100%"
              th:text="#{main.invoice.surcharge.line(${@surchargeViewHelper.flag(surcharge.kind, surcharge.percent)}, ${@durationUtils.format(surcharge.basis)})}"></td>
          <td class="invoice_booking_row nonproportional right" style="min-width: 2cm"
              th:text="${@surchargeCreditViewHelper.credit(surcharge.credit)}"></td>
          <td class="invoice_booking_row nonproportional right" style="min-width: 2cm"
              th:text="'+' + ${#numbers.formatDecimal(surcharge.hours, 1, 2)}"></td>
        </tr>
        <tr class="invoice_totalsum_row">
          <td class="invoice_totalsum_row right" style="width: 100%" th:colspan="${dynamicColumnCount}" th:text="#{main.invoice.overall.withsurcharges.text}"></td>
          <td class="invoice_totalsum_row nonproportional right" style="min-width: 2cm" th:text="${@durationUtils.format(invoiceData.totalDurationVisibleWithSurcharges)}"></td>
          <td class="invoice_totalsum_row nonproportional right" style="min-width: 2cm" th:text="${#numbers.formatDecimal(invoiceData.totalHoursVisibleWithSurcharges, 1, 2)}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
