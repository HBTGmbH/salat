        - update:
            columns:
              - column:
                  name: debitMinutes
                  valueNumeric: 0
            tableName: suborder
            where: debitMinutes is null
        - addNotNullConstraint:
            tableName: suborder
            columnName: debitMinutes
            columnDataType: int
        - dropColumn:
            tableName: suborder
            columnName: debithours
  - changeSet:
      id: 11
      author: kr
      comment: Introduce overtime in minutes
