        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `employee` GROUP BY `sign` HAVING COUNT(*) > 1) d
      # Eigenes SQL statt addNotNullConstraint: MODIFY ueber Liquibase verliert die Kollation der
