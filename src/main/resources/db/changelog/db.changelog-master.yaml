  - changeSet:
      id: 74
      author: kr
      comment: Create tables order_flat_rate and order_flat_rate_instalment - flat rate revenues per order (#972)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: order_flat_rate
      changes:
        - createTable:
            tableName: order_flat_rate
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_flat_rate
                    nullable: false
              - column:
                  name: customerorder_sign
                  type: varchar(255)
                  constraints:
                    nullable: false
              # Empty means the flat rate applies to the customer order as a whole.
              - column:
                  name: suborder_sign
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: rhythm
                  type: varchar(20)
                  constraints:
                    nullable: false
              # Null for instalments, which carry an amount each.
              - column:
                  name: amount
                  type: decimal(15,2)
              - column:
                  name: valid_from
                  type: date
                  constraints:
                    nullable: false
              # Never open ended, unlike order_pricing.valid_until: an open end would let a monthly
              # flat rate run up an unbounded revenue.
              - column:
                  name: valid_until
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: datetime
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int
        - createIndex:
            tableName: order_flat_rate
            indexName: idx_order_flat_rate_co_sign
            columns:
              - column:
                  name: customerorder_sign
        - createTable:
            tableName: order_flat_rate_instalment
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_flat_rate_instalment
                    nullable: false
              - column:
                  name: order_flat_rate_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_flat_rate_instalment_flat_rate
                    references: order_flat_rate(id)
                    deleteCascade: true
              - column:
                  name: amount
                  type: decimal(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: due
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: varchar(2000)
              - column:
                  name: created
                  type: datetime
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int

  - changeSet:
      id: 75
      author: kr
      comment: Add ticket_reference to timereport - optional free text reference to an external ticket (#982)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: timereport
                columnName: ticket_reference
      changes:
        - addColumn:
            tableName: timereport
            columns:
              # Free text, deliberately without a foreign key to jira_ticket: the reference has to
              # survive a booking whose ticket was never replicated.
              - column:
                  name: ticket_reference
                  type: varchar(64)

  - changeSet:
      id: 76
      author: kr
      comment: Add additional_field_names and inherited_field_names to jira_replication_config - which extra JIRA fields a replication reads (#881)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_replication_config
                columnName: additional_field_names
      changes:
        - addColumn:
            tableName: jira_replication_config
            columns:
              # Comma separated response keys, the same shape as parent_field_names. Which business
              # term a key stands for stays outside the module, in a customer specific view.
              - column:
                  name: additional_field_names
                  type: varchar(1000)
              - column:
                  name: inherited_field_names
                  type: varchar(1000)

  - changeSet:
      id: 77
      author: kr
      comment: Add custom_fields, custom_fields_effective and field_config_hash to jira_ticket - the replicated extra fields and their inherited values (#881)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_ticket
                columnName: custom_fields
      changes:
        - addColumn:
            tableName: jira_ticket
            columns:
              # Native json, not text: a json column cannot hold an empty string, and JSON_EXTRACT
              # on an empty document aborts with ERROR 3141 and takes the whole ETL statement with
              # it. NULL is answered with NULL and is therefore the safe empty state.
              - column:
                  name: custom_fields
                  type: json
              - column:
                  name: custom_fields_effective
                  type: json
              # SHA-256 of the configured field lists: a ticket written under a different list is
              # rewritten on the next run even though JIRA reports it as unchanged.
              - column:
                  name: field_config_hash
                  type: varchar(64)

  - changeSet:
      id: 78
      author: kr
      comment: Add ticket_reference to favorite - a favourite carries the ticket reference of the booking it was made from (#1029)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: favorite
                columnName: ticket_reference
      changes:
        - addColumn:
            tableName: favorite
            columns:
              # Same length as on timereport: what a favourite hands back must fit the column it is
              # written into. Nullable - a favourite from before this change has no reference.
              - column:
                  name: ticket_reference
                  type: varchar(64)

  - changeSet:
      id: 79
      author: kr
      comment: Rename jira_replication_config.customerorder_sign to scope_sign - a replication is scoped to an order or to one suborder of it (#1025)
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: jira_replication_config
            columnName: customerorder_sign
      changes:
        # The column keeps its shape and its content: an existing row carries an order sign, and
        # that is exactly what "the whole order" means under the new reading. A suborder scope is
        # the fully qualified sign, AUFTRAG/01/02, which fits the same varchar(255) - the segments
        # are capped at 16 characters each.
        - renameColumn:
            tableName: jira_replication_config
            oldColumnName: customerorder_sign
            newColumnName: scope_sign
            columnDataType: varchar(255)
        # MySQL's CHANGE COLUMN rebuilds the definition from what it is given, so the nullability
        # has to be stated again - the same trap changeset 71 ran into with modifyDataType.
        - addNotNullConstraint:
            tableName: jira_replication_config
            columnName: scope_sign
            columnDataType: varchar(255)

  - changeSet:
      id: 80
      author: kr
      comment: Rename jira_ticket.customerorder_sign to scope_sign - a ticket belongs to the scope of the replication that fetched it (#1025)
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: jira_ticket
            columnName: customerorder_sign
      changes:
        # The two unique constraints (uq_jira_ticket_co_jiraid, uq_jira_ticket_co_issue_key) and
        # the index idx_jira_ticket_co_updated follow the column and stay in force unchanged; only
        # their names still read "co", which is what the column used to be called.
        - renameColumn:
            tableName: jira_ticket
            oldColumnName: customerorder_sign
            newColumnName: scope_sign
            columnDataType: varchar(255)
        - addNotNullConstraint:
            tableName: jira_ticket
            columnName: scope_sign
            columnDataType: varchar(255)

  - changeSet:
      id: 81
      author: kr
      comment: Worklog-Abgleich je Replikationskonfiguration ein- und ausschaltbar (#1007)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_replication_config
                columnName: worklog_sync_enabled
      changes:
        - addColumn:
            tableName: jira_replication_config
            columns:
              # Ausgeschaltet fuer jede bestehende wie neue Konfiguration: der Abgleich schreibt in
              # ein fremdes System, das darf kein Nebeneffekt einer Migration sein.
              - column:
                  name: worklog_sync_enabled
                  type: bit(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Ab wann Buchungen geschrieben werden. Ohne diesen Tag wuerde der erste Lauf nach dem
              # Einschalten die gesamte Historie des Auftrags nach JIRA tragen.
              - column:
                  name: worklog_sync_from
                  type: date

  - changeSet:
      id: 82
      author: kr
      comment: Gedaechtnis darueber, welche Worklogs SALAT in JIRA geschrieben hat (#1007)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: jira_worklog_sync
      changes:
        # Ohne diese Tabelle laesst sich weder ein von SALAT geschriebenes Worklog von einem fremden
        # unterscheiden, noch bemerken, dass ein Tag/Ticket-Paar gar keine Buchungen mehr hat und
        # sein Worklog geloescht gehoert.
        - createTable:
            tableName: jira_worklog_sync
            columns:
              - column:
                  name: id
                  type: BIGINT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_jira_worklog_sync
              # Der Scope der Replikation, die das Worklog geschrieben hat - wie bei jira_ticket ein
              # Kuerzel und kein Fremdschluessel: die Zeilen ueberleben ihre Konfiguration.
              - column:
                  name: scope_sign
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: issue_key
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: work_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: worklog_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: minutes
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: last_synced
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: created
                  type: datetime
              - column:
                  name: updatecounter
                  type: int
        # Je Scope, Ticket und Tag genau ein Worklog - das ist die Zusage des Abgleichs, hier als
        # Bedingung der Datenbank.
        - addUniqueConstraint:
            tableName: jira_worklog_sync
            columnNames: scope_sign, issue_key, work_date
            constraintName: uq_jira_worklog_sync_scope_key_date
        - createIndex:
            tableName: jira_worklog_sync
            indexName: idx_jira_worklog_sync_scope_date
            columns:
              - column:
                  name: scope_sign
              - column:
                  name: work_date

  - changeSet:
      id: 83
      author: kr
      comment: Kundenstundensatz optional an einen Budgetplan binden (#1065)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: order_pricing
                columnName: order_budget_id
      changes:
        # Optional: alle Bestandssaetze bleiben planlos und verhalten sich unveraendert. Gesetzt
        # wirkt die Spalte als vierte Spezifitaetsstufe - unter dem Mitarbeitenden, ueber dem
        # Unterauftragsmuster.
        - addColumn:
            tableName: order_pricing
            columns:
              - column:
                  name: order_budget_id
                  type: bigint
        # Plaene werden nie geloescht, nur deaktiviert - der Fremdschluessel kann also nicht ins
        # Leere zeigen und braucht keine Loeschregel.
        - addForeignKeyConstraint:
            baseTableName: order_pricing
            baseColumnNames: order_budget_id
            referencedTableName: order_budget
            referencedColumnNames: id
