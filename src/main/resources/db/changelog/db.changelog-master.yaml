        - onFail: MARK_RAN
        - columnExists:
            tableName: timereport
            columnName: costs
      changes:
        - dropColumn:
            tableName: timereport
            columnName: costs
  - changeSet:
      id: 14
      author: kr
      comment: Minutes columns must be 0 at least
      changes:
        - update:
            columns:
              - column:
                  name: debitMinutes
                  valueNumeric: 0
            tableName: customerorder
            where: debitMinutes is null
        - update:
            columns:
              - column:
                  name: debitMinutes
                  valueNumeric: 0
            tableName: employeeorder
            where: debitMinutes is null
        - update:
            columns:
              - column:
                  name: debitMinutes
                  valueNumeric: 0
            tableName: suborder
            where: debitMinutes is null
  - changeSet:
      id: 15
      author: kr
      comment: Drop foreign key (test db)
      changes:
        - dropForeignKeyConstraint:
            baseTableName: employeeorder
            constraintName: FKB798CD408F771E12
  - changeSet:
      id: 16
      author: kr
      comment: Remove statusreport table and foreign key
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: employeeorder
            columnName: EMPLOYEEORDERCONTENT_ID
      changes:
        - dropColumn:
            tableName: employeeorder
            columnName: EMPLOYEEORDERCONTENT_ID
        - dropColumn:
            tableName: suborder
            columnName: NOEMPLOYEEORDERCONTENT
        - dropTable:
            tableName: EMPLOYEEORDERCONTENT
            cascadeConstraints: true
  - changeSet:
      id: 17
      author: kr
      comment: Add table for user access tokens
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_access_token
      changes:
        - createTable:
            tableName: user_access_token
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int
              - column:
                  name: employee_id
                  type: bigint
              - column:
                  name: token_id
                  type: varchar(255)
              - column:
                  name: token_secret_encrypted
                  type: varchar(255)
              - column:
                  name: valid_until
                  type: datetime
              - column:
                  name: comment
                  type: varchar(255)
  - changeSet:
      id: 18
      author: kr
      comment: Add table for reports definitions
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: report_definition
      changes:
        - createTable:
            tableName: report_definition
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: sql
                  type: varchar(10000)
  - changeSet:
      id: 19
      author: kr
      comment: Add table for employee to employee data access grant
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: employee_to_employee_authorization_rule
      changes:
        - createTable:
            tableName: employee_to_employee_authorization_rule
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int
              - column:
                  name: grantor_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_e2eauthrule_grantor
                    referencedTableName: employee
                    referencedColumnNames:
                      - id
              - column:
                  name: recipient_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_e2eauthrule_recipient
                    referencedTableName: employee
                    referencedColumnNames:
                      - id
              - column:
                  name: access_level
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: valid_from
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: valid_until
                  type: date
                  constraints:
                    nullable: false
  - changeSet:
      id: 20
      author: kr
      comment: Allow to reduce grant to single customer order
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: employee_to_employee_authorization_rule
                columnName: customer_order_id
      changes:
        - addColumn:
            tableName: employee_to_employee_authorization_rule
            columns:
              - column:
                  name: customer_order_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_e2eauthrule_customerorder
                    referencedTableName: customerorder
                    referencedColumnNames:
                      - id
  - changeSet:
      id: 21
      author: jp
      changes:
        - createTable:
            tableName: favorite
            columns:
              - column:
                  name: id
                  type: bigint(20)
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employeeId
                  type: bigint(20)
                  constraints:
                    nullable: false
              - column:
                  name: employeeorderId
                  type: bigint(20)
                  constraints:
                    nullable: false
              - column:
                  name: hours
                  type: int(11)
                  constraints:
                    nullable: false
              - column:
                  name: minutes
                  type: int(11)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: text
                  defaultOnNull: true
  - changeSet:
      id: 22
      author: kr
      comment: Add table for data access grants
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: authorization_rule
      changes:
        - createTable:
            tableName: authorization_rule
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int
              - column:
                  name: category
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: object_id
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: grantor_id
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: grantee_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                      - id
              - column:
                  name: access_level
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: valid_from
                  type: date
                  constraints:
                    nullable: true
              - column:
                  name: valid_until
                  type: date
                  constraints:
                    nullable: true
        - sql:
            sql: insert into authorization_rule (category, created, createdby, lastupdate, lastupdatedby, updatecounter, object_id, grantor_id, grantee_id, access_level, valid_from,  valid_until) select 'TIMEREPORT' as category, created, createdby, lastupdate, lastupdatedby, updatecounter, customer_order_id as object_id, grantor_id, recipient_id as grantee_id, access_level, valid_from,  valid_until from employee_to_employee_authorization_rule
        - dropTable:
            tableName: employee_to_employee_authorization_rule
            cascadeConstraints: true
  - changeSet:
      id: 23
      author: cpe+kr
      comment: Add an OrderType to mark orders as a specific type
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: customerorder
                columnName: orderType
      changes:
        - addColumn:
            tableName: customerorder
            columns:
              - column:
                  name: orderType
                  type: varchar(255)
                  defaultValue: 'STANDARD'
        - update:
            tableName: customerorder
            columns:
              - column:
                  name: orderType
                  value: KRANK_URLAUB_ABWESEND
            where: sign IN ('URLAUB','S-URLAUB','KRANK','ELTERNZEIT','MUTTERSCHUTZ','REISEZEIT')
  - changeSet:
      id: 24
      author: kr
      comment: Add delete column to timereport to introduce soft delete
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: timereport
                columnName: deleted
      changes:
        - addColumn:
            tableName: timereport
            columns:
              - column:
                  name: deleted
                  type: bit(1)
                  defaultValue: 0
  - changeSet:
      id: 25
      author: kr
      comment: Add type column to workingday
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: workingday
                columnName: type
      changes:
        - addColumn:
            tableName: workingday
            columns:
              - column:
                  name: type
                  type: varchar(100)
                  defaultValue: 'WORKED'
  - changeSet:
      id: 26
      author: kr
      comment: Add an OrderType to mark suborders as a specific type, overriding ordertype in customerorder
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: suborder
                columnName: orderType
      changes:
        - addColumn:
            tableName: suborder
            columns:
              - column:
                  name: orderType
                  type: varchar(255)

  - changeSet:
      id: 27
      author: kr
      comment: Remove password and passwordchange columns from employee table
      preConditions:
        - onFail: MARK_RAN
        - or:
            - columnExists:
                tableName: employee
                columnName: password
            - columnExists:
                tableName: employee
                columnName: passwordchange
      changes:
        - dropColumn:
            columnName: password
            tableName: employee
        - dropColumn:
            columnName: passwordchange
            tableName: employee

  - changeSet:
      id: 28
      author: kr
      comment: Change all values from PARTIALLY to OVERTIME_COMPENSATED in column type of table workingday
      changes:
        - update:
            tableName: workingday
            columns:
              - column:
                  name: type
                  value: OVERTIME_COMPENSATED
            where: type = 'PARTIALLY'

  - changeSet:
      id: 29
      author: kr
      comment: Create table statistic_value
      changes:
        - createTable:
            tableName: statistic_value
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: category
                  type: varchar(255)
              - column:
                  name: key
                  type: varchar(255)
              - column:
                  name: object_id
                  type: bigint
              - column:
                  name: value
                  type: bigint
              - column:
                  name: comment
                  type: varchar(4000)
        - createIndex:
            indexName: idx_main
            tableName: statistic_value
            columns:
              - column:
                  name: category
              - column:
                  name: key
              - column:
                  name: object_id

  - changeSet:
      id: 30
      author: kr
      comment: Remove statusreport column from customerorder table
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: customerorder
            columnName: statusreport
      changes:
        - dropColumn:
            columnName: statusreport
            tableName: customerorder

  - changeSet:
      id: 31
      author: kr
      comment: Add effective date column to overtime table
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: overtime
                columnName: effective
      changes:
        - addColumn:
            tableName: overtime
            columns:
              - column:
                  name: effective
                  type: date
        - sql:
            sql: update overtime set effective = greatest(date(overtime.created), (select employeecontract.validFrom from employeecontract where id = overtime.EMPLOYEECONTRACT_ID))

  - changeSet:
      id: 32
      author: kr
      comment: Add table for ETL definitions
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: etl_definition
      changes:
        - createTable:
            tableName: etl_definition
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: description
