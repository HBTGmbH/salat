      # Die Hilfstabelle hat einen Primaerschluessel, damit sie auch unter sql_require_primary_key
      # angelegt werden kann.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: employeecontract_supervisor
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) > 0 FROM (SELECT 1 FROM `employeecontract_supervisor` GROUP BY `EMPLOYEECONTRACT_ID`, `SUPERVISOR_ID` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: CREATE TABLE `employeecontract_supervisor_distinct` (`EMPLOYEECONTRACT_ID` bigint NOT NULL, `SUPERVISOR_ID` bigint NOT NULL, PRIMARY KEY (`EMPLOYEECONTRACT_ID`, `SUPERVISOR_ID`))
        - sql:
            sql: INSERT INTO `employeecontract_supervisor_distinct` (`EMPLOYEECONTRACT_ID`, `SUPERVISOR_ID`) SELECT DISTINCT `EMPLOYEECONTRACT_ID`, `SUPERVISOR_ID` FROM `employeecontract_supervisor`
        - sql:
            sql: DELETE FROM `employeecontract_supervisor`
        - sql:
            sql: INSERT INTO `employeecontract_supervisor` (`EMPLOYEECONTRACT_ID`, `SUPERVISOR_ID`) SELECT `EMPLOYEECONTRACT_ID`, `SUPERVISOR_ID` FROM `employeecontract_supervisor_distinct`
        - sql:
            sql: DROP TABLE `employeecontract_supervisor_distinct`

  - changeSet:
      id: 114
      author: kr
      comment: Jede Zuordnung in employeecontract_supervisor nur einmal (#1208)
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            employeecontract_supervisor enthaelt doppelte Werte in (EMPLOYEECONTRACT_ID, SUPERVISOR_ID); vor dem Start bereinigen (#1208).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `employeecontract_supervisor` GROUP BY `EMPLOYEECONTRACT_ID`, `SUPERVISOR_ID` HAVING COUNT(*) > 1) d
