            sql: DROP TABLE IF EXISTS team_lead, team_member

  - changeSet:
      id: 149
      author: kr
      comment: Ausfuehrungshistorie geplanter Reports verweist per Fremdschluessel auf Job und Report (#1366)
      # job_id und report_definition_id hatten keinen Fremdschluessel. Ein geloeschter Job liess seine
      # Eintraege mit einer id zurueck, die ins Leere zeigt. Die Eintraege bleiben, die Verweise werden
      # leer; job_name und report_definition_name halten sie lesbar. Danach setzt ON DELETE SET NULL
      # dasselbe beim Loeschen fort.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyTableName: scheduled_report_execution_history
                foreignKeyName: fk_scheduled_report_execution_history_job
      changes:
        - sql:
            sql: |-
              UPDATE scheduled_report_execution_history h
                 SET h.job_id = NULL
               WHERE h.job_id IS NOT NULL
                 AND NOT EXISTS (SELECT 1 FROM scheduled_report_job j WHERE j.id = h.job_id);
              UPDATE scheduled_report_execution_history h
                 SET h.report_definition_id = NULL
               WHERE h.report_definition_id IS NOT NULL
                 AND NOT EXISTS (SELECT 1 FROM report_definition r WHERE r.id = h.report_definition_id);
        - addForeignKeyConstraint:
            baseTableName: scheduled_report_execution_history
            baseColumnNames: job_id
            constraintName: fk_scheduled_report_execution_history_job
            referencedTableName: scheduled_report_job
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: scheduled_report_execution_history
            baseColumnNames: report_definition_id
            constraintName: fk_scheduled_report_execution_history_report
            referencedTableName: report_definition
            referencedColumnNames: id
            onDelete: SET NULL

  - changeSet:
      id: 150
      author: kr
      comment: JIRA-Tabellen ohne scope_sign, Schluessel auf den Geltungsbereich ueber die ids (#1372)
      # Seit #1322/#1323 verweisen Konfigurationen, Tickets und Worklogs ueber customerorder_id und
      # suborder_id auf ihren Geltungsbereich; scope_sign war ein Spiegel, den keine Report-, ETL- oder
      # View-Definition liest. Er trug aber noch die eindeutigen Schluessel. Die gehen auf das Paar der
      # ids ueber, bevor die alten fallen. suborder_id ist NULL fuer den ganzen Auftrag, und NULL ist in
      # einem eindeutigen Schluessel nicht gleich NULL - deshalb der funktionale Teil
      # COALESCE(suborder_id, 0). Der Bestand hat unter den neuen Schluesseln keine Dubletten (geprueft
      # auf dem Stand der Produktion).
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: jira_ticket
            columnName: scope_sign
      changes:
        - sql:
            sql: |-
              ALTER TABLE jira_ticket
                ADD UNIQUE KEY uq_jira_ticket_scope_issue_key (customerorder_id, (COALESCE(suborder_id, 0)), issue_key),
                ADD UNIQUE KEY uq_jira_ticket_scope_jira_id (customerorder_id, (COALESCE(suborder_id, 0)), jira_id),
                ADD KEY idx_jira_ticket_scope_updated (customerorder_id, suborder_id, updated_ts);
              ALTER TABLE jira_worklog_sync
                ADD UNIQUE KEY uq_jira_worklog_sync_scope_issue_date (customerorder_id, (COALESCE(suborder_id, 0)), issue_key, work_date),
                ADD KEY idx_jira_worklog_sync_scope_work_date (customerorder_id, suborder_id, work_date);
              ALTER TABLE jira_ticket
                DROP INDEX uq_jira_ticket_co_issue_key,
                DROP INDEX uq_jira_ticket_co_jiraid,
                DROP INDEX idx_jira_ticket_co_updated,
                DROP COLUMN scope_sign;
              ALTER TABLE jira_worklog_sync
                DROP INDEX uq_jira_worklog_sync_scope_key_date,
                DROP INDEX idx_jira_worklog_sync_scope_date,
                DROP COLUMN scope_sign;
              ALTER TABLE jira_replication_config
                DROP COLUMN scope_sign;

  - changeSet:
      id: 151
      author: kr
      comment: Spalte sign des Mitarbeiterauftrags entfernen (#1373)
      # Jeder Mitarbeiterauftrag trug dasselbe Leerzeichen; die Anwendung las die Spalte nie, und keine
      # Report-, ETL- oder View-Definition liest sie.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: employeeorder
            columnName: sign
      changes:
        - dropColumn:
            tableName: employeeorder
            columnName: sign

  - changeSet:
      id: 152
      author: kr
      comment: Fehlende Fremdschluessel fuer Budgetplan-Eintraege, Favoriten und Benachrichtigungen (#1374)
      # Ohne Fremdschluessel blieben Zeilen zurueck, deren Ziel geloescht war. Ein Favorit ohne Person
      # oder Mitarbeiterauftrag und eine Benachrichtigung ohne Login sind wertlos: sie gehen vorab und
      # kuenftig per ON DELETE CASCADE mit ihrem Ziel. favorites kann auf das Loeschen eines
      # Mitarbeiterauftrags nicht per Event reagieren, es darf order nicht importieren. Die Eintraege
      # eines Budgetplans loescht der Plan selbst (cascade = ALL), dort genuegt der einfache Schluessel.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyTableName: favorite
                foreignKeyName: fk_favorite_employeeorder
      changes:
        - sql:
            sql: |-
              DELETE f FROM favorite f
               WHERE NOT EXISTS (SELECT 1 FROM employee e WHERE e.id = f.employeeId)
                  OR NOT EXISTS (SELECT 1 FROM employeeorder eo WHERE eo.id = f.employeeorderId);
              DELETE n FROM notification n
               WHERE NOT EXISTS (SELECT 1 FROM salat_user u WHERE u.id = n.recipient_user_id);
              DELETE s FROM order_budget_scope_entry s
               WHERE NOT EXISTS (SELECT 1 FROM order_budget b WHERE b.id = s.order_budget_id);
        - addForeignKeyConstraint:
            baseTableName: order_budget_scope_entry
            baseColumnNames: order_budget_id
            constraintName: fk_order_budget_scope_entry_budget
            referencedTableName: order_budget
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: favorite
            baseColumnNames: employeeId
            constraintName: fk_favorite_employee
            referencedTableName: employee
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: favorite
            baseColumnNames: employeeorderId
            constraintName: fk_favorite_employeeorder
            referencedTableName: employeeorder
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: notification
            baseColumnNames: recipient_user_id
            constraintName: fk_notification_recipient_user
            referencedTableName: salat_user
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 153
      author: kr
      comment: Spalte unresolved_dependencies der ETL-Definitionen entfernen (#1375)
      # Sie hielt die Namen, die die Umstellung auf ids (#1207) keiner Definition zuordnen konnte. Neue
      # entstehen nicht mehr. Steht doch noch ein Name darin, ueberspringt CONTINUE den Changeset, bis
      # er als Zeile in etl_definition_dependency eingetragen und hier geloescht ist.
      preConditions:
        - onFail: CONTINUE
        - columnExists:
            tableName: etl_definition
            columnName: unresolved_dependencies
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM etl_definition WHERE COALESCE(unresolved_dependencies, '') <> ''
      changes:
        - dropColumn:
            tableName: etl_definition
            columnName: unresolved_dependencies

  - changeSet:
      id: 154
      author: kr
      comment: Tabelle statusreport entfernen
      # Changeset 30 entfernte nur den Verweis customerorder.statusreport, die Tabelle blieb als Relikt
      # stehen; der Kommentar von Changeset 16 nennt sie, entfernt aber EMPLOYEEORDERCONTENT. Die
      # Anwendung kennt die Tabelle nicht, und keine Report-, ETL- oder View-Definition liest sie.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: statusreport
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS statusreport

  - changeSet:
      id: 155
      author: kr
      comment: Tabelle user_access_token entfernen (#1383)
      # Changeset 17 legte sie fuer die Token-Anmeldung an; #301 entfernte die Funktion, die Tabelle
      # blieb stehen. Die Anwendung kennt sie nicht, und keine Report-, ETL- oder View-Definition
      # liest sie.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: user_access_token
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS user_access_token

  - changeSet:
      id: 156
      author: kr
      comment: JIRA-Replikation meldet sich wahlweise per Personal Access Token an (#1385)
      # JIRA Server / Data Center nimmt einen PAT nur als Bearer-Token an. Jede bestehende
      # Konfiguration bleibt bei Basic, dem einzigen Verfahren bisher. Ein PAT traegt keinen
      # Benutzernamen, deshalb wird username nullable.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_replication_config
                columnName: auth_method
      changes:
        - addColumn:
            tableName: jira_replication_config
            columns:
              - column:
                  name: auth_method
                  type: varchar(30)
                  defaultValue: BASIC
                  constraints:
                    nullable: false
        - dropNotNullConstraint:
            tableName: jira_replication_config
            columnName: username
            columnDataType: varchar(255)

  - changeSet:
      id: 157
      author: kr
      comment: Tickets lassen sich manuell pflegen, ein Ticket kennt seine Replikation (#1386)
      # Ein manuell gepflegtes Ticket hat keine JIRA-ID, deshalb wird jira_id nullable; der eindeutige
      # Schluessel je Bereich ueber die JIRA-ID laesst NULL mehrfach zu. replication_id nennt die
      # Replikation, die ein Ticket pflegt, NULL bei einem manuellen. Wird eine Replikation geloescht,
      # bleiben ihre Tickets stehen (#1025) und verlieren nur den Verweis. Der Bestand bekommt die
      # Replikation seines Bereichs, wo es genau eine gibt.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_ticket
                columnName: replication_id
      changes:
        - dropNotNullConstraint:
            tableName: jira_ticket
            columnName: jira_id
            columnDataType: bigint
        - addColumn:
            tableName: jira_ticket
            columns:
              - column:
                  name: replication_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableName: jira_ticket
            baseColumnNames: replication_id
            constraintName: fk_jira_ticket_replication
            referencedTableName: jira_replication_config
            referencedColumnNames: id
            onDelete: SET NULL
        - sql:
            sql: |-
              UPDATE jira_ticket t
                JOIN (SELECT customerorder_id, COALESCE(suborder_id, 0) AS so, MIN(id) AS id
                        FROM jira_replication_config
                       GROUP BY customerorder_id, COALESCE(suborder_id, 0)
                      HAVING COUNT(*) = 1) c
                  ON c.customerorder_id = t.customerorder_id AND c.so = COALESCE(t.suborder_id, 0)
                 SET t.replication_id = c.id

  - changeSet:
      id: 158
      author: kr
      comment: Ticketimporte mit Herkunft und Spaltenzuordnung, Ticket kennt seinen Import (#1386)
      # Ein Import haelt fest, wer wann welche Datei in welchen Bereich gespielt hat, und wie ihre
      # Spalten gelesen wurden. Die Zuordnung des letzten Imports eines Bereichs schlaegt die Vorschau
      # wieder vor, und ihre vererbten Zusatzfelder gelten fuer die manuellen Tickets des Bereichs.
      # import_id nennt den Import, der ein Ticket zuletzt geschrieben hat.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: jira_ticket_import
      changes:
        - createTable:
            tableName: jira_ticket_import
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_jira_ticket_import
              - column:
                  name: customerorder_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_jira_ticket_import_customerorder
                    references: customerorder(id)
              - column:
                  name: suborder_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_jira_ticket_import_suborder
                    references: suborder(id)
              - column:
                  name: file_name
                  type: varchar(255)
              - column:
                  name: column_mapping
                  type: json
              - column:
                  name: created_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: datetime
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: lastupdate
                  type: datetime
              - column:
                  name: lastupdatedby
                  type: varchar(255)
              - column:
                  name: updatecounter
                  type: int
        - createIndex:
            tableName: jira_ticket_import
            indexName: idx_jira_ticket_import_scope
            columns:
              - column:
                  name: customerorder_id
              - column:
                  name: suborder_id
        - addColumn:
            tableName: jira_ticket
            columns:
              - column:
                  name: import_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableName: jira_ticket
            baseColumnNames: import_id
            constraintName: fk_jira_ticket_import
            referencedTableName: jira_ticket_import
            referencedColumnNames: id
            onDelete: SET NULL

  - changeSet:
      id: 159
      author: kr
      comment: JIRA-ID eindeutig je Replikation statt je Bereich; Bereiche mit mehreren Replikationen holen ihren Bestand neu (#1386)
      # Zwei Replikationen eines Bereichs duerfen nebeneinander bestehen, auch gegen zwei JIRA-Instanzen,
      # die dieselben numerischen ids vergeben. Eindeutig ist eine JIRA-ID deshalb je Replikation, der Key
      # bleibt eindeutig je Bereich. Fuer replication_id NULL gilt der Schluessel nicht: Tickets von Hand
      # und Tickets geloeschter Replikationen pruefen ihre id beim Import selbst.
      # Changeset 157 konnte die Tickets eines Bereichs mit mehreren Replikationen keiner zuordnen. Ohne
      # Wasserstand holt jede beim naechsten Lauf alles, was ihre JQL findet, und uebernimmt es.
      preConditions:
        - onFail: MARK_RAN
        - indexExists:
            tableName: jira_ticket
            indexName: uq_jira_ticket_scope_jira_id
      changes:
        - sql:
            sql: |-
              ALTER TABLE jira_ticket
                ADD UNIQUE KEY uq_jira_ticket_replication_jira_id (replication_id, jira_id),
                DROP INDEX uq_jira_ticket_scope_jira_id;
              UPDATE jira_replication_config c
                JOIN (SELECT customerorder_id, COALESCE(suborder_id, 0) AS so
                        FROM jira_replication_config
                       GROUP BY customerorder_id, COALESCE(suborder_id, 0)
                      HAVING COUNT(*) > 1) m
                  ON m.customerorder_id = c.customerorder_id AND m.so = COALESCE(c.suborder_id, 0)
                 SET c.last_max_updated = NULL

  - changeSet:
      id: 160
      author: kr
      comment: Spalte employeeId der Favoriten entfernen, die Person folgt aus dem Mitarbeiterauftrag (#1369)
      # Die Person eines Favoriten ist die Person seines Mitarbeiterauftrags (Mitarbeiterauftrag ->
      # Vertrag -> Person); employeeId war transitiv abhaengig und stimmte im Bestand bei jedem Favoriten
      # mit ihr ueberein. Keine Report-, ETL- oder View-Definition liest die Spalte. Ein Release vor
      # diesem startet danach nicht mehr, es mappt die Spalte.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: favorite
            columnName: employeeId
      changes:
        - dropForeignKeyConstraint:
            baseTableName: favorite
            constraintName: fk_favorite_employee
        - dropColumn:
            tableName: favorite
            columnName: employeeId

  - changeSet:
      id: 161
      author: kr
      comment: Dauer einer Buchung in einer Spalte duration_minutes (#1381)
      # Stunden und Minuten hatten keine Bedeutung fuer sich und liessen Minutenanteile ab 60 zu. Die
      # Anwendung liest und schreibt nur noch duration_minutes. durationhours und durationminutes bleiben
      # als berechnete Spalten (VIRTUAL) stehen, bis keine Report-, ETL- oder View-Definition sie mehr
      # liest (Changeset 164); bis dahin liefern sie dieselben Summen, ein Minutenanteil ab 60 erscheint
      # als volle Stunde. Die Summe aller Buchungen ist vorher und nachher gleich.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: timereport
                columnName: duration_minutes
      changes:
        - sql:
            sql: |-
              ALTER TABLE timereport ADD COLUMN duration_minutes INT NOT NULL DEFAULT 0;
              UPDATE timereport SET duration_minutes = COALESCE(durationhours, 0) * 60 + COALESCE(durationminutes, 0);
              ALTER TABLE timereport
                ALTER COLUMN duration_minutes DROP DEFAULT,
                DROP COLUMN durationhours,
                DROP COLUMN durationminutes;
              ALTER TABLE timereport
                ADD COLUMN durationhours INT GENERATED ALWAYS AS (duration_minutes DIV 60) VIRTUAL,
                ADD COLUMN durationminutes INT GENERATED ALWAYS AS (duration_minutes MOD 60) VIRTUAL;

  - changeSet:
      id: 162
      author: kr
      comment: Beginn und Pause eines Arbeitstags je in einer Spalte start_time und break_minutes (#1382)
      # Beginn als Uhrzeit (TIME), Pause in Minuten; die Aufteilung nach Stunden und Minuten hatte keine
      # Bedeutung. Die alten Spalten bleiben wie in Changeset 161 als berechnete Spalten stehen, bis keine
      # Definition sie mehr liest (Changeset 165).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: workingday
                columnName: start_time
      changes:
        - sql:
            sql: |-
              ALTER TABLE workingday
                ADD COLUMN start_time TIME NOT NULL DEFAULT '00:00:00',
                ADD COLUMN break_minutes INT NOT NULL DEFAULT 0;
              UPDATE workingday
                 SET start_time = MAKETIME(Starttimehour, Starttimeminute, 0),
                     break_minutes = breakhours * 60 + breakminutes;
              ALTER TABLE workingday
                ALTER COLUMN start_time DROP DEFAULT,
                ALTER COLUMN break_minutes DROP DEFAULT,
                DROP COLUMN Starttimehour,
                DROP COLUMN Starttimeminute,
                DROP COLUMN breakhours,
                DROP COLUMN breakminutes;
              ALTER TABLE workingday
                ADD COLUMN Starttimehour INT GENERATED ALWAYS AS (HOUR(start_time)) VIRTUAL,
                ADD COLUMN Starttimeminute INT GENERATED ALWAYS AS (MINUTE(start_time)) VIRTUAL,
                ADD COLUMN breakhours INT GENERATED ALWAYS AS (break_minutes DIV 60) VIRTUAL,
                ADD COLUMN breakminutes INT GENERATED ALWAYS AS (break_minutes MOD 60) VIRTUAL;

  - changeSet:
      id: 163
      author: kr
      comment: Umsatz-View liest die Dauer aus duration_minutes (#1381)
      # Wie Changeset 135, nur timereport_minutes aus der neuen Spalte; dieselben Zahlen.
      changes:
        - createView:
            viewName: revenue_view
            replaceIfExists: true
            selectQuery: |-
              SELECT tr.id                                                AS timereport_id,
                     co.id                                                AS customerorder_id,
                     co.sign                                              AS customerorder_sign,
                     so.id                                                AS suborder_id,
                     op.suborder_sign                                     AS suborder_sign_fully_qualified,
                     tr.EMPLOYEEORDER_ID                                  AS employeeorder_id,
                     op.refdate                                           AS timereport_date,
                     tr.duration_minutes                                  AS timereport_minutes,
                     IFNULL(op.price_eur_per_hour, 0) * 100 / 60          AS price_cents_per_minute,
                     op.price_eur_per_hour
              FROM order_pricing_view2 op
                       JOIN referenceday r ON r.refdate = op.refdate
                       JOIN timereport tr ON tr.REFERENCEDAY_ID = r.id AND tr.deleted = 0
                       JOIN employeeorder eo ON eo.id = tr.EMPLOYEEORDER_ID AND eo.SUBORDER_ID = op.SUBORDER_ID
                       JOIN suborder so ON so.id = eo.SUBORDER_ID
                       JOIN customerorder co ON co.id = so.CUSTOMERORDER_ID
                       JOIN employee e ON e.sign = op.employee_sign
                       JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID AND ec.EMPLOYEE_ID = e.id

  - changeSet:
      id: 164
      author: kr
      comment: Berechnete Spalten durationhours und durationminutes entfernen, sobald keine Definition sie liest (#1381)
      # Report- und ETL-Definitionen pflegt die Anwendung nicht; sie werden nach dem Release in Produktion
      # auf duration_minutes umgestellt. Solange eine Definition oder View die alten Namen noch nennt,
      # ueberspringt CONTINUE den Changeset und prueft beim naechsten Start erneut.
      preConditions:
        - onFail: CONTINUE
        - columnExists:
            tableName: timereport
            columnName: durationhours
        - sqlCheck:
            expectedResult: 0
            sql: |-
              SELECT (SELECT COUNT(*) FROM report_definition
                       WHERE LOWER(`sql`) REGEXP 'durationhours|durationminutes')
                   + (SELECT COUNT(*) FROM etl_definition
