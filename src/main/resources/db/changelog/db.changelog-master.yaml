  - changeSet:
      id: 7
      author: kr
      comment: Introduce daily working time in minutes
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: employeecontract
            columnName: dailyWorkingTime
      changes:
        - addColumn:
            tableName: employeecontract
            columns:
              - column:
                  name: dailyWorkingTimeMinutes
                  type: int
        - update:
            columns:
              - column:
                  name: dailyWorkingTimeMinutes
                  valueComputed: ROUND(dailyWorkingTime * 60)
            tableName: employeecontract
            where: dailyWorkingTimeMinutes is null
        - addNotNullConstraint:
            tableName: employeecontract
            columnName: dailyWorkingTimeMinutes
            columnDataType: int
        - dropColumn:
            tableName: employeecontract
            columnName: dailyWorkingTime
  - changeSet:
      id: 8
      author: kr
      comment: Introduce overtime static in minutes
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: employeecontract
            columnName: overtimeStatic
      changes:
        - addColumn:
            tableName: employeecontract
            columns:
              - column:
                  name: overtimeStaticMinutes
                  type: int
        - update:
            columns:
              - column:
                  name: overtimeStaticMinutes
                  valueComputed: ROUND(overtimeStatic * 60)
            tableName: employeecontract
            where: overtimeStaticMinutes is null
        - addNotNullConstraint:
            tableName: employeecontract
            columnName: overtimeStaticMinutes
            columnDataType: int
        - dropColumn:
            tableName: employeecontract
            columnName: overtimeStatic
  - changeSet:
      id: 9
      author: kr
      comment: Introduce customer order debit hours in minutes
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: customerorder
            columnName: debithours
        - not:
            - columnExists:
                tableName: customerorder
                columnName: debitMinutes
      changes:
        - addColumn:
            tableName: customerorder
            columns:
              - column:
                  name: debitMinutes
                  type: int
        - update:
            columns:
              - column:
                  name: debitMinutes
                  valueComputed: ROUND(debithours * 60)
            tableName: customerorder
            where: debitMinutes is null
        - update:
            columns:
              - column:
                  name: debitMinutes
                  valueNumeric: 0
            tableName: customerorder
            where: debitMinutes is null
        - addNotNullConstraint:
            tableName: customerorder
            columnName: debitMinutes
            columnDataType: int
        - dropColumn:
            tableName: customerorder
            columnName: debithours
  - changeSet:
      id: 10
      author: kr
      comment: Introduce suborder debit hours in minutes
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: suborder
            columnName: debithours
        - not:
            - columnExists:
                tableName: suborder
                columnName: debitMinutes
      changes:
        - addColumn:
            tableName: suborder
            columns:
              - column:
                  name: debitMinutes
                  type: int
        - update:
            columns:
              - column:
                  name: debitMinutes
