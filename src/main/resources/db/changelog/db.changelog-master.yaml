  - changeSet:
      id: 86
      author: kr
      comment: Urlaubsanspruch als Spalte am Vertrag statt als eigene Entity Vacation (#1077)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: employeecontract
                columnName: vacationEntitlement
      changes:
        - addColumn:
            tableName: employeecontract
            columns:
              - column:
                  name: vacationEntitlement
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        # Die Jahreszeilen eines Vertrags tragen denselben Wert - adjustVacations hat sie bei jedem
        # Speichern gleichgesetzt, und das Formular kennt nur ein Feld. MAX greift ihn und antwortet
        # auch dann, wenn ein Vertrag gar keine Zeile hat; die Spalte bleibt dann auf 0.
        - sql:
            sql: >-
              UPDATE employeecontract ec
              SET ec.vacationEntitlement = COALESCE(
                (SELECT MAX(v.entitlement) FROM vacation v WHERE v.EMPLOYEECONTRACT_ID = ec.id), 0)

  - changeSet:
      id: 87
      author: kr
      comment: Tabelle vacation ablegen - der Anspruch steht jetzt am Vertrag (#1077)
      # Abgelegt wird erst, wenn das Ziel nachweislich steht: die Spalte ist da und jeder Vertrag
      # traegt einen Wert. Schlaegt eine der Bedingungen fehl, bleibt die Tabelle stehen - MARK_RAN
      # haelt den Changeset dann fuer erledigt, und das ist hier die gewollte Richtung: lieber eine
      # verwaiste Tabelle als ein Drop gegen eine Uebernahme, die nicht gelaufen ist.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: vacation
        - columnExists:
            tableName: employeecontract
            columnName: vacationEntitlement
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM employeecontract WHERE vacationEntitlement IS NULL
      changes:
        # Laeuft nach Changeset 86, das den Anspruch in employeecontract.vacationEntitlement
        # uebernommen hat. Die Tabelle traegt darueber hinaus nichts: year war je Vertrag immer
        # derselbe Anspruch, und used wurde seit jeher geschrieben, aber nie gelesen - der
        # Urlaubsverbrauch kommt aus den Buchungen.
        - dropTable:
            tableName: vacation

  - changeSet:
      id: 88
      author: kr
      comment: View suborder_fqs nachtragen, die Reporting und ETL schon benutzen
      runOnChange: true
      # Der vollstaendige Auftragsschluessel eines Unterauftrags, von der Wurzel bis zum Blatt und mit
      # abschliessendem Schraegstrich. Der Strich am Ende ist die Bedingung dafuer, dass ein LIKE-Muster
      # einen Teilbaum trifft und nicht in einen Nachbarn laeuft, dessen Schluessel zufaellig gleich
      # anfaengt - dieselbe Zusage, auf die sich OrderPricingLookup in der Anwendung stuetzt.
      #
      # Der Aufstieg laeuft rekursiv und kennt damit keine feste Maximaltiefe. Die Vorgaengerform hatte
      # zehn LEFT JOINs aufgereiht: bei einer elften Ebene waere der oberste Teil des Schluessels
      # kommentarlos weggefallen, und ein zu kurzer Schluessel faellt nirgends auf - er trifft einfach
      # andere Muster. Bricht die Rekursion wider Erwarten nicht ab, laeuft sie gegen
      # cte_max_recursion_depth und die Abfrage scheitert, statt still etwas Falsches zu liefern.
      #
      # Der Kundenauftrag kommt vom Blatt und wird beim Aufstieg mitgefuehrt, nicht von der Wurzel
      # geholt - so steht vorne derselbe Auftrag, den auch die aufrufende Abfrage am Unterauftrag sieht.
      #
      # Der Pfad ist ausdruecklich utf8mb3_bin wie alle Tabellen (#1212). Ein CAST ohne Zeichensatz
      # nimmt den der Verbindung (utf8mb4_0900_ai_ci); Vergleiche und LIKE gegen die View ignorierten
      # damit Gross-/Kleinschreibung und Akzente, waehrend die Anwendung exakt vergleicht.
      changes:
        - createView:
            viewName: suborder_fqs
            replaceIfExists: true
            selectQuery: |-
              WITH RECURSIVE pfad AS (SELECT s.id                                   AS suborder_id,
                                             s.CUSTOMERORDER_ID                     AS customerorder_id,
                                             s.PARENTORDER_ID,
                                             CAST(CONCAT(s.sign, '/') AS CHAR(1000) CHARACTER SET utf8mb3) COLLATE utf8mb3_bin AS teilpfad
                                      FROM suborder s
                                      UNION ALL
                                      SELECT p.suborder_id,
                                             p.customerorder_id,
                                             eltern.PARENTORDER_ID,
                                             CAST(CONCAT(eltern.sign, '/', p.teilpfad) AS CHAR(1000) CHARACTER SET utf8mb3) COLLATE utf8mb3_bin
                                      FROM pfad p
                                               JOIN suborder eltern ON p.PARENTORDER_ID = eltern.id)
              SELECT pfad.suborder_id,
                     CONCAT(c.sign, '/', pfad.teilpfad) AS sign_fully_qualified
              FROM pfad
                       JOIN customerorder c ON pfad.customerorder_id = c.id
              WHERE pfad.PARENTORDER_ID IS NULL

  - changeSet:
      id: 89
      author: kr
      comment: Gewaehrenden in das Objekt der Berechtigungsregel ueberfuehren und grantor_id entfernen
      # Eine Regel nannte zwei Gegenueber: den Gewaehrenden und das Objekt. In vier von fuenf Kategorien
      # war der Gewaehrende genau das, worauf Zugriff gewaehrt wird, und das Objekt blieb leer; nur
      # TIMEREPORT nutzte beide Achsen. Die zweite Achse zieht in den Objektwert um: <kuerzel>:<auftrag>.
      #
      # Umgerechnet wird elementweise, denn object_id ist eine kommaseparierte Menge: aus "a,b" mit dem
      # Gewaehrenden "xx" wird "xx:a,xx:b". Das leistet ein REPLACE auf den Trennkommas - eine Schleife
      # ueber die Elemente braucht es dafuer nicht.
      #
      # Ein Gewaehrender "*" hiess "von wem auch immer" und ist damit keine Einschraenkung; er faellt
      # weg, statt in einen Wert "*:..." einzugehen, den niemand abfragt.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: authorization_rule
            columnName: grantor_id
      changes:
        - sql:
            sql: |-
              UPDATE authorization_rule
                 SET object_id = CASE
                       WHEN grantor_id = '*' THEN NULLIF(object_id, '')
                       WHEN object_id IS NULL OR object_id = '' THEN grantor_id
                       ELSE CONCAT(grantor_id, ':', REPLACE(object_id, ',', CONCAT(',', grantor_id, ':')))
                     END
               WHERE grantor_id IS NOT NULL AND grantor_id <> ''
        - dropColumn:
            tableName: authorization_rule
            columnName: grantor_id

  - changeSet:
      id: 90
      author: kr
      comment: Berechtigungsregel bekommt einen Namen (#1168)
      # Nullable, damit der Bestand ohne erfundene Namen weiterlaeuft: eine Regel ohne Namen bekommt
      # ihn beim naechsten Speichern im Editor. Kein Unique-Index - die Eindeutigkeit gilt ohne
      # Ruecksicht auf Gross-/Kleinschreibung und wird im AuthorizationRuleService geprueft.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: authorization_rule
                columnName: name
      changes:
        - addColumn:
            tableName: authorization_rule
            columns:
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: true

  - changeSet:
      id: 91
      author: kr
      comment: Kostenzuordnung verweist ueber employee_id auf die Person (#968)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: employee_cost_employee
                columnName: employee_id
      changes:
        # Neben employee_sign, nicht an seiner Stelle: Views, ETL-Definitionen und Reports lesen das
        # Kuerzel noch. Die Anwendung schluesselt ab jetzt ueber die id und haelt das Kuerzel als
        # Spiegel der Person aktuell, bis die Leser umgestellt sind; entfernt wird es erst danach.
        #
        # Nullable, weil ein Kuerzel, das keine oder mehr als eine Person traegt, sich nicht zuordnen
        # laesst. Solche Zeilen bleiben mit ihrem Kuerzel stehen - verworfen wird nichts - und die
        # Kategorieseite markiert sie, bis jemand die Person waehlt.
        - addColumn:
            tableName: employee_cost_employee
            columns:
              - column:
                  name: employee_id
                  type: bigint
        # Uebernommen wird nur bei genau einer Person. Beide Spalten sind utf8mb3_bin, das = vergleicht
        # also binaer - so, wie EmployeeCostLookup das Kuerzel bisher mit equals verglichen hat.
        - sql:
            sql: >-
              UPDATE employee_cost_employee a
              SET a.employee_id = (SELECT MIN(e.id) FROM employee e WHERE e.sign = a.employee_sign)
              WHERE (SELECT COUNT(*) FROM employee e WHERE e.sign = a.employee_sign) = 1
        # Ohne Loeschregel: eine Person mit Kostenzuordnung laesst sich nicht loeschen, genau wie eine
        # mit Vertrag. Anonymisieren aendert die id nicht.
        - addForeignKeyConstraint:
            baseTableName: employee_cost_employee
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_employee_cost_employee_employee
        - createIndex:
            tableName: employee_cost_employee
            indexName: idx_employee_cost_employee_employee
            columns:
              - column:
                  name: employee_id

  - changeSet:
      id: 92
      author: kr
      comment: Kundenstundensatz verweist ueber employee_id auf die Person (#968)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: order_pricing
                columnName: employee_id
      changes:
        # Wie in Changeset 91 neben employee_sign. Leer heisst hier weiterhin "gilt fuer alle" - aber
        # nur, solange auch das Kuerzel leer ist: ein Satz mit Kuerzel und ohne id ist einer, dessen
        # Person sich nicht zuordnen liess, und gilt fuer niemanden, wie bisher auch.
        - addColumn:
            tableName: order_pricing
            columns:
              - column:
                  name: employee_id
                  type: bigint
        - sql:
            sql: >-
              UPDATE order_pricing p
              SET p.employee_id = (SELECT MIN(e.id) FROM employee e WHERE e.sign = p.employee_sign)
              WHERE p.employee_sign IS NOT NULL AND p.employee_sign <> ''
                AND (SELECT COUNT(*) FROM employee e WHERE e.sign = p.employee_sign) = 1
        - addForeignKeyConstraint:
            baseTableName: order_pricing
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_order_pricing_employee
        - createIndex:
            tableName: order_pricing
            indexName: idx_order_pricing_employee
            columns:
              - column:
                  name: employee_id
  - changeSet:
      id: 93
      author: kr
      comment: Beendete Vertraege mit freigegebenem Folgevertrag bis zum Vertragsende freigeben (#1215)
      changes:
        # Freigabe und Abnahme laufen je Vertrag, und die Seite der Freigabe schlaegt den laufenden
        # vor. Der letzte Monat eines alten Vertrags blieb deshalb oft offen - und damit fuer die
        # Person selbst aenderbar, auch Jahre spaeter. Gemeint sind dieselben Vertraege, die die Regel
        # in TimereportAuthorization ab jetzt fuer die Person schliesst: beendet, und auf einem
        # spaeteren Vertrag derselben Person wurde schon freigegeben. Ein Vertrag, dessen letzter
        # Monat gerade noch nachgebucht wird, ist nicht dabei. Das GROUP BY laesst MySQL die
        # abgeleitete Tabelle materialisieren; ohne es verweigert MySQL das Lesen der Tabelle, die das
        # UPDATE schreibt (Fehler 1093).
        #
        # Nur freigegeben, nicht abgenommen: die Abnahme setzt overtimeStatic, und das rechnet nur die
        # Anwendung. Das Abnahmedatum bleibt, damit bleibt auch der Ueberstundensaldo, wie er ist. Die
        # Abnahme selbst bleibt Sache der Geschaeftsfuehrung.
        - sql:
            sql: >-
              UPDATE employeecontract ec
              JOIN (
                SELECT p.id FROM employeecontract p
                JOIN employeecontract s ON s.employee_id = p.employee_id
                  AND s.validfrom > p.validuntil
                  AND s.reportreleasedate IS NOT NULL
                GROUP BY p.id
              ) succeeded ON succeeded.id = ec.id
              SET ec.reportreleasedate = ec.validuntil,
                  ec.lastupdate = NOW(),
                  ec.lastupdatedby = 'SYSTEM',
                  ec.updatecounter = COALESCE(ec.updatecounter, 0) + 1
              WHERE (ec.reportreleasedate IS NULL OR ec.reportreleasedate < ec.validuntil)
                AND (ec.reportacceptancedate IS NULL OR ec.reportacceptancedate <= ec.validuntil)
        # Danach traegt jede nicht geloeschte Buchung den Status, den ihr Tag nach den Daten ihres
        # Vertrags hat (ReportPeriod.statusOn) - das fasst auch die vereinzelten Buchungen, die vor dem
        # Freigabe- oder Abnahmedatum noch offen oder nur freigegeben waren. Es geht nur in Richtung
        # abgeschlossen: eine Buchung, die strenger steht als ihr Tag, wird nicht wieder geoeffnet.
        # Der Status allein aendert keinen Saldo, der haengt am Abnahmedatum des Vertrags.
        - sql:
            sql: >-
              UPDATE timereport tr
              JOIN referenceday r ON r.id = tr.referenceday_id
              JOIN employeecontract ec ON ec.id = tr.employeecontract_id
              SET tr.status = 'commited',
                  tr.released = COALESCE(tr.released, NOW()),
                  tr.releasedby = COALESCE(tr.releasedby, 'SYSTEM'),
                  tr.lastupdate = NOW(),
                  tr.lastupdatedby = 'SYSTEM',
                  tr.updatecounter = COALESCE(tr.updatecounter, 0) + 1
              WHERE tr.deleted = 0
                AND tr.status = 'open'
                AND r.refdate <= ec.reportreleasedate
        - sql:
            sql: >-
              UPDATE timereport tr
              JOIN referenceday r ON r.id = tr.referenceday_id
              JOIN employeecontract ec ON ec.id = tr.employeecontract_id
              SET tr.status = 'closed',
                  tr.accepted = COALESCE(tr.accepted, NOW()),
                  tr.acceptedby = COALESCE(tr.acceptedby, 'SYSTEM'),
                  tr.lastupdate = NOW(),
                  tr.lastupdatedby = 'SYSTEM',
                  tr.updatecounter = COALESCE(tr.updatecounter, 0) + 1
              WHERE tr.deleted = 0
                AND tr.status = 'commited'
                AND r.refdate <= ec.reportacceptancedate

  - changeSet:
      id: 94
      author: kr
      comment: Worklog-Abgleich wahlweise nur mit fakturierbaren Buchungen (#1218)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_replication_config
                columnName: worklog_sync_invoiceable_only
      changes:
        - addColumn:
            tableName: jira_replication_config
            columns:
              # Ausgeschaltet fuer jede bestehende Konfiguration: sie schreibt weiter, was sie bisher
              # geschrieben hat, bis jemand den Schalter setzt.
              - column:
                  name: worklog_sync_invoiceable_only
                  type: bit(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 95
      author: kr
      comment: View suborder_fqs zurueck auf die flache Form mit fester Tiefe (#1224)
      # Die rekursive Form aus Changeset 88 kann MySQL nicht in die aufrufende Abfrage einfalten. Es
      # baut sie in jeder Abfrage als Zwischenergebnis ohne Index auf und verbindet sie je nach
      # Schaetzung als Kreuzprodukt mit den Tagen: die ETL auftrag-umsatz-kosten brauchte damit 737
      # statt 66 s. Die flache Form faltet MySQL ein, der Zugriff laeuft wieder ueber die Indizes von
      # suborder.
      #
      # Der Preis ist die feste Tiefe: zehn Ebenen, heute ist der Baum hoechstens fuenf tief. Bei einer
      # elften Ebene fiele der oberste Teil des Schluessels kommentarlos weg.
      #
      # Der Schluessel traegt wieder die Kollation der Spalten, utf8mb3_bin. Die rekursive Form lieferte
      # ueber ihr CAST utf8mb4_0900_ai_ci, und damit verglichen die LIKE-Muster der Preis- und
      # Kostenregeln ohne Unterschied von Gross- und Kleinschreibung - anders als OrderPricingLookup in
      # der Anwendung, das dieselben Muster mit Unterschied vergleicht.
      changes:
        - createView:
            viewName: suborder_fqs
            replaceIfExists: true
            selectQuery: |-
              SELECT s0.id AS suborder_id,
                     CONCAT(c.sign, '/',
                            CONCAT_WS('/', s9.sign, s8.sign, s7.sign, s6.sign, s5.sign,
                                      s4.sign, s3.sign, s2.sign, s1.sign, s0.sign),
                            '/') AS sign_fully_qualified
              FROM suborder s0
                       JOIN customerorder c ON c.id = s0.CUSTOMERORDER_ID
                       LEFT JOIN suborder s1 ON s1.id = s0.PARENTORDER_ID
                       LEFT JOIN suborder s2 ON s2.id = s1.PARENTORDER_ID
                       LEFT JOIN suborder s3 ON s3.id = s2.PARENTORDER_ID
                       LEFT JOIN suborder s4 ON s4.id = s3.PARENTORDER_ID
                       LEFT JOIN suborder s5 ON s5.id = s4.PARENTORDER_ID
                       LEFT JOIN suborder s6 ON s6.id = s5.PARENTORDER_ID
                       LEFT JOIN suborder s7 ON s7.id = s6.PARENTORDER_ID
                       LEFT JOIN suborder s8 ON s8.id = s7.PARENTORDER_ID
                       LEFT JOIN suborder s9 ON s9.id = s8.PARENTORDER_ID

  - changeSet:
      id: 96
      author: kr
      comment: Add table jira_replication_run - die Laufhistorie der JIRA-Replikationen (#1282)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: jira_replication_run
      changes:
        - createTable:
            tableName: jira_replication_run
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_jira_replication_run
              # Ohne ON DELETE CASCADE: JiraReplicationConfigService.delete raeumt die Laeufe einer
              # Replikation selbst ab, der Fremdschluessel faengt nur den Fall, der daran vorbeigeht.
              - column:
                  name: replication_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_jira_replication_run_config
                    references: jira_replication_config(id)
              # Beim Start geschrieben, nicht am Ende: nur so unterscheidet sich ein Lauf, der nie
              # zu Ende kam (status RUNNING, finished_at NULL), von einem, der nie begann.
              - column:
                  name: started_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: finished_at
                  type: datetime
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: triggered_by
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: varchar(4000)
        - createIndex:
            tableName: jira_replication_run
            indexName: idx_jira_replication_run_started_at
            columns:
              - column:
                  name: started_at
        # Die Sperre fragt je Replikation nach der Zeile mit RUNNING.
        - createIndex:
            tableName: jira_replication_run
            indexName: idx_jira_replication_run_replication_status
            columns:
              - column:
                  name: replication_id
              - column:
                  name: status

  - changeSet:
      id: 97
      author: kr
      comment: Berechtigungsregeln verweisen ueber die id auf Personen und Objekte (#1204)
      # Loginname, Kuerzel und Name einer ETL-Definition lassen sich aendern, und die Anonymisierung
      # ueberschreibt Loginname und Kuerzel. Eine Regel, die darauf verwies, verlor dann ihr Recht -
      # oder vererbte es an den, der den alten Wert als Naechstes bekam. Ab hier steht die id:
      #
      #   grantee_id                                  -> salat_user.id (die Anmeldung)
      #   object_id EMPLOYEE                          -> salat_user.id (die Anmeldung, die uebernommen wird)
      #   object_id ACCEPT_/RELEASE_TIMEREPORTS,
      #             WORKINGDAY                        -> employee.id
      #   object_id ETL                               -> etl_definition.id
      #   object_id TIMEREPORT  1453 / 1453/01        -> C<customerorder.id> / S<suborder.id>
      #                         xx:1453 / xx:1453/01  -> E<employee.id>:C<id> / E<employee.id>:S<id>
      #                         xx:*                  -> E<employee.id>:*
      #   object_id REPORT_DEFINITION                 -> unveraendert, war schon die id
      #
      # Die Spalten sind kommaseparierte Mengen, umgerechnet wird deshalb elementweise: JSON_TABLE
      # zerlegt die Menge, GROUP_CONCAT setzt sie in derselben Reihenfolge wieder zusammen. Der
      # Platzhalter "*" bleibt. Ein Wert, der nicht genau einen Datensatz trifft, geht nicht verloren:
      # er bekommt ein "?" vorangestellt, trifft damit nie eine id und wird im Regeleditor als nicht
      # zugeordnet markiert.
      #
      # Kein zweistufiger Weg wie bei #968: ausserhalb der Anwendung liest niemand authorization_rule,
      # weder View noch Routine noch ETL-Definition noch Report.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: authorization_rule
      changes:
        - sql:
            sql: |-
              UPDATE authorization_rule r
                JOIN (SELECT e.rule_id,
                             GROUP_CONCAT(e.mapped ORDER BY e.n SEPARATOR ',') AS grantee_ids
                        FROM (SELECT ar.id AS rule_id, g.n,
                                     CASE
                                       WHEN TRIM(g.v) = '*' THEN '*'
                                       WHEN (SELECT COUNT(*) FROM salat_user su WHERE BINARY su.loginname = BINARY TRIM(g.v)) = 1
                                         THEN (SELECT CAST(su.id AS CHAR) FROM salat_user su WHERE BINARY su.loginname = BINARY TRIM(g.v))
                                       ELSE CONCAT('?', TRIM(g.v))
                                     END AS mapped
                                FROM authorization_rule ar
                                JOIN JSON_TABLE(
                                       CONCAT('["', REPLACE(REPLACE(REPLACE(ar.grantee_id, '\\', '\\\\'), '"', '\\"'), ',', '","'), '"]'),
                                       '$[*]' COLUMNS (n FOR ORDINALITY, v VARCHAR(255) PATH '$')) g
                               WHERE TRIM(g.v) <> '') e
                       GROUP BY e.rule_id) m ON m.rule_id = r.id
                 SET r.grantee_id = m.grantee_ids;
              
              UPDATE authorization_rule r
                JOIN (SELECT e.rule_id,
                             GROUP_CONCAT(e.mapped ORDER BY e.n SEPARATOR ',') AS object_ids
                        FROM (SELECT x.rule_id, x.n,
                                     CASE
                                       WHEN x.v = '*' THEN '*'
                                       WHEN x.category = 'EMPLOYEE' THEN
                                         CASE WHEN (SELECT COUNT(*) FROM salat_user su WHERE BINARY su.loginname = BINARY x.v) = 1
                                              THEN (SELECT CAST(su.id AS CHAR) FROM salat_user su WHERE BINARY su.loginname = BINARY x.v)
                                              ELSE CONCAT('?', x.v) END
                                       WHEN x.category IN ('ACCEPT_TIMEREPORTS', 'RELEASE_TIMEREPORTS', 'WORKINGDAY') THEN
                                         CASE WHEN (SELECT COUNT(*) FROM employee em WHERE BINARY em.sign = BINARY x.v) = 1
                                              THEN (SELECT CAST(em.id AS CHAR) FROM employee em WHERE BINARY em.sign = BINARY x.v)
                                              ELSE CONCAT('?', x.v) END
                                       WHEN x.category = 'ETL' THEN
                                         CASE WHEN (SELECT COUNT(*) FROM etl_definition d WHERE BINARY d.name = BINARY x.v) = 1
                                              THEN (SELECT CAST(d.id AS CHAR) FROM etl_definition d WHERE BINARY d.name = BINARY x.v)
                                              ELSE CONCAT('?', x.v) END
                                       WHEN x.category = 'TIMEREPORT' THEN
                                         CASE WHEN (x.person IS NOT NULL AND x.person_id IS NULL) OR x.order_token IS NULL
                                              THEN CONCAT('?', x.v)
                                              WHEN x.person IS NULL THEN x.order_token
                                              ELSE CONCAT('E', x.person_id, ':', x.order_token) END
                                       ELSE x.v
                                     END AS mapped
                                FROM (SELECT p.*,
                                             CASE WHEN p.person IS NULL THEN NULL
                                                  WHEN (SELECT COUNT(*) FROM employee em WHERE BINARY em.sign = BINARY p.person) = 1
                                                  THEN (SELECT em.id FROM employee em WHERE BINARY em.sign = BINARY p.person) END AS person_id,
                                             CASE WHEN p.order_part = '*' AND p.person IS NOT NULL THEN '*'
                                                  WHEN p.order_part LIKE '%/%' THEN
                                                    CASE WHEN (SELECT COUNT(*) FROM suborder_fqs f
                                                                WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(p.order_part, '/')) = 1
                                                         THEN (SELECT CONCAT('S', f.suborder_id) FROM suborder_fqs f
                                                                WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(p.order_part, '/')) END
                                                  WHEN (SELECT COUNT(*) FROM customerorder c WHERE BINARY c.sign = BINARY p.order_part) = 1
                                                  THEN (SELECT CONCAT('C', c.id) FROM customerorder c WHERE BINARY c.sign = BINARY p.order_part)
                                             END AS order_token
                                        FROM (SELECT ar.id AS rule_id, ar.category, o.n, TRIM(o.v) AS v,
                                                     CASE WHEN LOCATE(':', TRIM(o.v)) > 0
                                                          THEN SUBSTRING_INDEX(TRIM(o.v), ':', 1) END AS person,
                                                     CASE WHEN LOCATE(':', TRIM(o.v)) > 0
                                                          THEN SUBSTRING(TRIM(o.v), LOCATE(':', TRIM(o.v)) + 1)
                                                          ELSE TRIM(o.v) END AS order_part
                                                FROM authorization_rule ar
                                                JOIN JSON_TABLE(
                                                       CONCAT('["', REPLACE(REPLACE(REPLACE(ar.object_id, '\\', '\\\\'), '"', '\\"'), ',', '","'), '"]'),
                                                       '$[*]' COLUMNS (n FOR ORDINALITY, v VARCHAR(255) PATH '$')) o
                                               WHERE ar.category IN ('EMPLOYEE', 'ACCEPT_TIMEREPORTS', 'RELEASE_TIMEREPORTS',
                                                                     'WORKINGDAY', 'ETL', 'TIMEREPORT')
                                                 AND TRIM(o.v) <> '') p) x) e
                       GROUP BY e.rule_id) m ON m.rule_id = r.id
                 SET r.object_id = m.object_ids;
  - changeSet:
      id: 98
      author: kr
      comment: Budgetplan, Pauschale und Kostenzuordnung verweisen ueber die id auf Auftrag und Unterauftrag (#1205)
      # Auftrags- und Unterauftragskuerzel lassen sich aendern, und ein Unterauftrag laesst sich
      # umhaengen. Ein Plan, eine Pauschale oder eine Kostenzuordnung, die ueber das Kuerzel verwies,
      # zeigte danach ins Leere: der Plan verschwand aus dem Controlling, die Kostenzuordnung griff
      # nicht mehr. Ab hier stehen customerorder_id und suborder_id mit Fremdschluessel daneben.
      #
      # Neben den Kuerzeln, nicht an ihrer Stelle (der Weg aus #968): Reports lesen order_budget,
      # Views, ETL-Definitionen und Reports employee_cost_employee. Die Anwendung loest ab hier ueber
      # die id auf und schreibt die Kuerzel als Spiegel des referenzierten Datensatzes; sie folgen
      # einer Umbenennung (OrderSignMirrorListener).
      #
      # Uebernommen wird nur eine eindeutige Zuordnung, verglichen wird binaer: die View suborder_fqs
      # traegt eine Kollation ohne Gross-/Kleinschreibung (#1212). Bleibt die id leer, obwohl ein
      # Kuerzel dasteht, deckt der Datensatz nichts ab und ist in seiner Liste markiert. Ein
      # unaufgeloester Unterauftrag wird dabei ausdruecklich nicht auftragsweit.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: order_budget
                columnName: customerorder_id
      changes:
        - addColumn:
            tableName: order_budget
            columns:
              - column:
                  name: customerorder_id
                  type: bigint
              - column:
                  name: suborder_id
                  type: bigint
        - addColumn:
            tableName: order_flat_rate
            columns:
              - column:
                  name: customerorder_id
                  type: bigint
              - column:
                  name: suborder_id
                  type: bigint
        - addColumn:
            tableName: employee_cost_employee
            columns:
              - column:
                  name: suborder_id
                  type: bigint
        - sql:
            sql: |-
              UPDATE order_budget b
                 SET b.customerorder_id = (SELECT MIN(c.id) FROM customerorder c
                                            WHERE BINARY c.sign = BINARY b.customerorder_sign
                                           HAVING COUNT(*) = 1);
              UPDATE order_flat_rate b
                 SET b.customerorder_id = (SELECT MIN(c.id) FROM customerorder c
                                            WHERE BINARY c.sign = BINARY b.customerorder_sign
                                           HAVING COUNT(*) = 1);
              UPDATE order_budget b
                 SET b.suborder_id = (SELECT MIN(f.suborder_id) FROM suborder_fqs f
                                       WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(b.suborder_sign, '/')
                                      HAVING COUNT(*) = 1)
               WHERE b.suborder_sign IS NOT NULL AND b.suborder_sign <> '';
              UPDATE order_flat_rate b
                 SET b.suborder_id = (SELECT MIN(f.suborder_id) FROM suborder_fqs f
                                       WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(b.suborder_sign, '/')
                                      HAVING COUNT(*) = 1)
               WHERE b.suborder_sign IS NOT NULL AND b.suborder_sign <> '';
              UPDATE employee_cost_employee a
                 SET a.suborder_id = (SELECT MIN(f.suborder_id) FROM suborder_fqs f
                                       WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(a.suborder_sign, '/')
                                      HAVING COUNT(*) = 1)
               WHERE a.suborder_sign IS NOT NULL AND a.suborder_sign <> '';
              UPDATE order_budget b
                 SET b.suborder_id = NULL
               WHERE b.suborder_id IS NOT NULL
                 AND NOT EXISTS (SELECT 1 FROM suborder s
                                  WHERE s.id = b.suborder_id AND s.customerorder_id = b.customerorder_id);
              UPDATE order_flat_rate b
                 SET b.suborder_id = NULL
               WHERE b.suborder_id IS NOT NULL
                 AND NOT EXISTS (SELECT 1 FROM suborder s
                                  WHERE s.id = b.suborder_id AND s.customerorder_id = b.customerorder_id)
        - addForeignKeyConstraint:
            baseTableName: order_budget
            baseColumnNames: customerorder_id
            constraintName: fk_order_budget_customerorder
            referencedTableName: customerorder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: order_budget
            baseColumnNames: suborder_id
            constraintName: fk_order_budget_suborder
            referencedTableName: suborder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: order_flat_rate
            baseColumnNames: customerorder_id
            constraintName: fk_order_flat_rate_customerorder
            referencedTableName: customerorder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: order_flat_rate
            baseColumnNames: suborder_id
            constraintName: fk_order_flat_rate_suborder
            referencedTableName: suborder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: employee_cost_employee
            baseColumnNames: suborder_id
            constraintName: fk_employee_cost_employee_suborder
            referencedTableName: suborder
            referencedColumnNames: id
  - changeSet:
      id: 99
      author: kr
      comment: Namen der ETL-Definitionen vor der Umstellung auf Eindeutigkeit pruefen (#1207)
      # Die Definitionen werden von Hand in der Datenbank gepflegt; nichts hat ihre Namen bisher
      # eindeutig oder gefuellt gehalten. Changeset 100 macht den Namen eindeutig und Pflicht. Bevor
      # das scheitert, nennt dieser Check die Definitionen, die das verhindern, und aendert nichts.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: etl_definition_dependency
      changes:
        - customChange:
            class: de.hbt.salat.etl.persistence.ETLDefinitionNamesCheck

  - changeSet:
      id: 100
      author: kr
      comment: Abhaengigkeiten zwischen ETL-Definitionen ueber die id (#1207)
      # Eine Abhaengigkeit nannte die andere Definition ueber ihren Namen (etl_definition.dependencies,
      # kommasepariert). Wer eine Definition umbenannte, musste jede Abhaengigkeit von Hand nachziehen;
      # vergass er eine, scheiterte der ganze Lauf "alle Definitionen", auch der naechtliche. Ab hier
      # steht jede Abhaengigkeit als Zeile in etl_definition_dependency, mit zwei Fremdschluesseln.
      #
      # Uebernommen wird jeder Name, der genau eine Definition trifft - nach Changeset 99 heisst das:
      # jeder, den es gibt -, binaer verglichen. Ein Name ohne Definition geht nicht verloren: er
      # bleibt in der umbenannten Spalte unresolved_dependencies, steht in der Meldung jedes Laufs
      # dieser Definition und laesst den Lauf nicht scheitern.
      #
      # Danach ist der Name Pflicht und eindeutig. Wer Definitionen per SQL pflegt, traegt
      # Abhaengigkeiten kuenftig als ids ein - siehe docs/etl-definitionen.md.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: etl_definition_dependency
      changes:
        - sql:
            sql: |-
              CREATE TABLE etl_definition_dependency (
                etl_definition_id BIGINT NOT NULL,
                depends_on_id BIGINT NOT NULL,
                PRIMARY KEY (etl_definition_id, depends_on_id),
                CONSTRAINT fk_etl_definition_dependency_definition FOREIGN KEY (etl_definition_id) REFERENCES etl_definition (id) ON DELETE CASCADE,
                CONSTRAINT fk_etl_definition_dependency_depends_on FOREIGN KEY (depends_on_id) REFERENCES etl_definition (id)
              );
              INSERT INTO etl_definition_dependency (etl_definition_id, depends_on_id)
              SELECT DISTINCT d.id, o.id
                FROM etl_definition d
                JOIN JSON_TABLE(
                       CONCAT('["', REPLACE(REPLACE(REPLACE(d.dependencies, '\\', '\\\\'), '"', '\\"'), ',', '","'), '"]'),
                       '$[*]' COLUMNS (v VARCHAR(255) PATH '$')) j
                JOIN etl_definition o ON BINARY o.name = BINARY TRIM(j.v)
               WHERE TRIM(j.v) <> '';
              UPDATE etl_definition d
                LEFT JOIN (SELECT d2.id, GROUP_CONCAT(TRIM(j.v) ORDER BY j.n SEPARATOR ',') AS names
                             FROM etl_definition d2
                             JOIN JSON_TABLE(
                                    CONCAT('["', REPLACE(REPLACE(REPLACE(d2.dependencies, '\\', '\\\\'), '"', '\\"'), ',', '","'), '"]'),
                                    '$[*]' COLUMNS (n FOR ORDINALITY, v VARCHAR(255) PATH '$')) j
                            WHERE TRIM(j.v) <> ''
                              AND NOT EXISTS (SELECT 1 FROM etl_definition o WHERE BINARY o.name = BINARY TRIM(j.v))
                            GROUP BY d2.id) u ON u.id = d.id
                 SET d.dependencies = u.names;
        # Als SQL statt renameColumn/addNotNullConstraint: deren MODIFY in MySQL liesse die Kollation
        # utf8mb3_bin fallen, und der eindeutige Name ignorierte dann Gross-/Kleinschreibung.
        - sql:
            sql: |-
              ALTER TABLE etl_definition RENAME COLUMN dependencies TO unresolved_dependencies;
              ALTER TABLE etl_definition MODIFY name VARCHAR(255) CHARACTER SET utf8mb3 COLLATE utf8mb3_bin NOT NULL;
              ALTER TABLE etl_definition ADD CONSTRAINT uk_etl_definition_name UNIQUE (name)
  - changeSet:
      id: 101
      author: kr
      comment: Doppelte Zeilen in year_month entfernen (#1208)
      # year_month traegt seit jeher manche Monate doppelt; vor dem Primaerschluessel muessen sie weg.
      # Laeuft nur, wenn es Duplikate gibt; sonst haelt MARK_RAN den Changeset fuer erledigt, und der
      # Schluessel im naechsten Changeset sorgt dafuer, dass keine neuen entstehen.
      # Die Hilfstabelle hat einen Primaerschluessel, damit sie auch unter sql_require_primary_key
      # angelegt werden kann.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: year_month
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) > 0 FROM (SELECT 1 FROM `year_month` GROUP BY `year`, `month` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: CREATE TABLE `year_month_distinct` (`year` int NOT NULL, `month` int NOT NULL, PRIMARY KEY (`year`, `month`))
        - sql:
            sql: INSERT INTO `year_month_distinct` (`year`, `month`) SELECT DISTINCT `year`, `month` FROM `year_month`
        - sql:
            sql: DELETE FROM `year_month`
        - sql:
            sql: INSERT INTO `year_month` (`year`, `month`) SELECT `year`, `month` FROM `year_month_distinct`
        - sql:
            sql: DROP TABLE `year_month_distinct`

  - changeSet:
      id: 102
      author: kr
      comment: year_month erhaelt den Primaerschluessel (year, month) (#1208)
      # Der Tabellenname ist in MySQL ein reserviertes Wort (Intervall YEAR_MONTH), deshalb eigenes SQL
      # mit Backticks statt addPrimaryKey.
      #
      # Kein Changeset legt year_month an, die Tabelle kommt nur aus dem alten Bestand. Ohne sie gilt
      # der Changeset als gelaufen (#1383); Duplikate kann es nach Changeset 101 nicht mehr geben.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: year_month
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `year_month` GROUP BY `year`, `month` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: ALTER TABLE `year_month` ADD PRIMARY KEY (`year`, `month`)

