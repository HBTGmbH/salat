  - changeSet:
      id: 115
      author: kr
      comment: Kalenderangaben der Referenztage aus Datum und publicholiday ableiten (#1211)
      # holiday heisst ab jetzt nur noch "Eintrag in publicholiday". Bis 2024 trugen Wochenenden
      # holiday gesetzt; einzelne Feiertage waren am Referenztag nicht oder anders vermerkt, weil der
      # Referenztag vor dem Feiertag angelegt worden war. Danach haelt Referenceday.applyCalendar die
      # Spalten in derselben Form. Soll und Ueberstunden lesen diese Spalten nicht (sie rechnen mit
      # dem Datum und publicholiday), abgeschlossene Salden bleiben also, wie sie sind.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            publicholiday enthaelt doppelte Werte in (refdate); vor dem Start bereinigen (#1211).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM publicholiday GROUP BY refdate HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: >-
              UPDATE referenceday r LEFT JOIN publicholiday p ON p.refdate = r.refdate
              SET r.holiday = (p.id IS NOT NULL),
                  r.name = COALESCE(p.name, ''),
                  r.workingday = (p.id IS NULL AND DAYOFWEEK(r.refdate) NOT IN (1, 7)),
                  r.dow = ELT(DAYOFWEEK(r.refdate), 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat')

  - changeSet:
      id: 116
      author: kr
      comment: Kundenstundensatz verweist ueber die id auf den Auftrag (#1212)
      # Der Weg aus #1205 fuer order_pricing: customerorder_id mit Fremdschluessel neben dem Kuerzel,
      # das Reports und ETL-Definitionen weiter lesen. Die Anwendung loest ueber die id auf und
      # schreibt das Kuerzel aus dem Auftrag. suborder_sign ist hier kein Bezug, sondern ein
      # LIKE-Muster ueber den vollstaendigen Auftragsschluessel; es bleibt, wie getippt.
      #
      # Uebernommen wird nur eine eindeutige, binaer verglichene Zuordnung. Bleibt die id leer,
      # bepreist der Satz nichts und ist in der Liste markiert.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: order_pricing
                columnName: customerorder_id
      changes:
        - addColumn:
            tableName: order_pricing
            columns:
              - column:
                  name: customerorder_id
                  type: bigint
        - sql:
            sql: |-
              UPDATE order_pricing p
                 SET p.customerorder_id = (SELECT MIN(c.id) FROM customerorder c
                                            WHERE BINARY c.sign = BINARY p.customerorder_sign
                                           HAVING COUNT(*) = 1)
        - addForeignKeyConstraint:
            baseTableName: order_pricing
            baseColumnNames: customerorder_id
            constraintName: fk_order_pricing_customerorder
            referencedTableName: customerorder
            referencedColumnNames: id
  - changeSet:
      id: 117
      author: kr
      comment: Fortbildungskennzeichen von Buchung und Unterauftrag sind NOT NULL mit Default false (#1246)
      # Ein fehlender Wert hiess schon immer "keine Fortbildung"; die Anwendung fing NULL an jeder
      # Lesestelle selbst ab. Ab hier sagt es die Spalte. Eigenes SQL statt addNotNullConstraint und
      # addDefaultValue: ein MODIFY statt zweier, timereport ist gross.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: timereport
            columnName: training
        - columnExists:
            tableName: suborder
            columnName: trainingFlag
      changes:
        - sql:
            sql: UPDATE timereport SET training = 0 WHERE training IS NULL
        - sql:
            sql: ALTER TABLE timereport MODIFY training bit(1) NOT NULL DEFAULT b'0'
        - sql:
            sql: UPDATE suborder SET trainingFlag = 0 WHERE trainingFlag IS NULL
        - sql:
            sql: ALTER TABLE suborder MODIFY trainingFlag bit(1) NOT NULL DEFAULT b'0'
  - changeSet:
      id: 118
      author: kr
      comment: Buchungsstatus commited heisst committed (#1249)
      # Der Statuswert der freigegebenen Buchung war falsch geschrieben. Changeset 94 setzt und liest
      # noch den alten Wert; er laeuft vorher, die Umbenennung erfasst also auch, was er gesetzt hat.
      #
      # Report- und ETL-Definitionen liegen als SQL in der Datenbank und koennten den Wert abfragen.
      # Sie ziehen per allgemeinem REPLACE mit, nur in Zeilen, die ihn enthalten - so geht alles mit
      # einem Release raus. Im Bestand bei Einfuehrung enthielt keine Definition und keine View den Wert.
      changes:
        - sql:
            sql: UPDATE timereport SET status = 'committed' WHERE status = 'commited'
        - sql:
            sql: >-
              UPDATE report_definition SET `sql` = REPLACE(`sql`, 'commited', 'committed')
              WHERE `sql` LIKE '%commited%'
        - sql:
            sql: >-
              UPDATE etl_definition
              SET `init` = REPLACE(`init`, 'commited', 'committed'),
                  `execute` = REPLACE(`execute`, 'commited', 'committed'),
                  `cleanup` = REPLACE(`cleanup`, 'commited', 'committed')
              WHERE CONCAT_WS(' ', `init`, `execute`, `cleanup`) LIKE '%commited%'
  - changeSet:
      id: 119
      author: kr
      comment: Budgetplan, Pauschale, Kundenstundensatz und Kostenzuordnung verweisen sicher auf Auftrag und Unterauftrag (#1212)
      # Die Changesets 98 und 116 uebernahmen die ids nur bei eindeutiger Zuordnung und liessen den
      # Rest ohne id stehen, markiert in den Listen. Im Produktionsbestand vor dem Release liess sich
      # jeder Bezug zuordnen; die Markierung ist deshalb entfallen. Damit das so bleibt, haelt dieser
      # Changeset an, falls doch ein Satz ohne Auftrag oder mit einem Unterauftragskuerzel ohne id
      # dasteht, und macht den Auftrag zur Pflicht. Ein Unterauftrag ohne id heisst ab hier: der ganze
      # Auftrag.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            Budgetplan, Pauschale, Kundenstundensatz oder Kostenzuordnung ohne zugeordneten Auftrag bzw.
            Unterauftrag; vor dem Start zuordnen (#1212).
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT (SELECT COUNT(*) FROM order_budget
                       WHERE customerorder_id IS NULL OR (suborder_id IS NULL AND TRIM(COALESCE(suborder_sign, '')) <> ''))
                   + (SELECT COUNT(*) FROM order_flat_rate
                       WHERE customerorder_id IS NULL OR (suborder_id IS NULL AND TRIM(COALESCE(suborder_sign, '')) <> ''))
                   + (SELECT COUNT(*) FROM order_pricing WHERE customerorder_id IS NULL)
                   + (SELECT COUNT(*) FROM employee_cost_employee
                       WHERE suborder_id IS NULL AND TRIM(COALESCE(suborder_sign, '')) <> '')
      changes:
        - addNotNullConstraint:
            tableName: order_budget
            columnName: customerorder_id
            columnDataType: BIGINT
        - addNotNullConstraint:
            tableName: order_flat_rate
            columnName: customerorder_id
            columnDataType: BIGINT
        - addNotNullConstraint:
            tableName: order_pricing
            columnName: customerorder_id
            columnDataType: BIGINT
  - changeSet:
      id: 120
      author: kr
      comment: JIRA-Replikation verweist ueber die id auf Auftrag und Unterauftrag (#1322)
      # Der Geltungsbereich einer Replikation stand bisher nur als Kuerzel in scope_sign: das Kuerzel
      # des Auftrags oder der vollstaendige Schluessel eines Unterauftrags. Nach einer Umbenennung
      # oder einem Umhaengen zeigte er ins Leere, und die Replikation fand nichts mehr. Ab hier
      # stehen customerorder_id und suborder_id mit Fremdschluessel daneben; suborder_id ist NULL,
      # wenn der ganze Auftrag gemeint ist. scope_sign bleibt als Spiegel fuer Reports und
      # ETL-Definitionen und folgt einer Umbenennung (JiraScopeSignMirrorListener).
      #
      # Uebernommen wird nur eine eindeutige, binaer verglichene Zuordnung (#1212: die View
      # suborder_fqs vergleicht sonst ohne Gross-/Kleinschreibung). Ein Auftragskuerzel geht einem
      # gleichlautenden Unterauftragspfad vor, wie in der Anwendung bisher: jede Replikation von
      # vor #1025 traegt ein Auftragskuerzel. Eine Replikation, deren Geltungsbereich sich nicht
      # eindeutig aufloesen laesst, wird geloescht - samt ihrer Lauf-Historie, wie beim Loeschen
      # in der Anwendung. Ihre Tickets und Worklogs bleiben; sie behandelt #1323.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_replication_config
                columnName: customerorder_id
      changes:
        - addColumn:
            tableName: jira_replication_config
            columns:
              - column:
                  name: customerorder_id
                  type: bigint
              - column:
                  name: suborder_id
                  type: bigint
        - sql:
            sql: |-
              UPDATE jira_replication_config c
                 SET c.customerorder_id = (SELECT MIN(o.id) FROM customerorder o
                                            WHERE BINARY o.sign = BINARY c.scope_sign
                                           HAVING COUNT(*) = 1);
              UPDATE jira_replication_config c
                 SET c.suborder_id = (SELECT MIN(f.suborder_id) FROM suborder_fqs f
                                       WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(c.scope_sign, '/')
                                      HAVING COUNT(*) = 1)
               WHERE c.customerorder_id IS NULL
                 AND NOT EXISTS (SELECT 1 FROM customerorder o WHERE BINARY o.sign = BINARY c.scope_sign);
              UPDATE jira_replication_config c
                 SET c.customerorder_id = (SELECT s.customerorder_id FROM suborder s WHERE s.id = c.suborder_id)
               WHERE c.customerorder_id IS NULL
                 AND c.suborder_id IS NOT NULL;
              DELETE FROM jira_replication_run
               WHERE replication_id IN (SELECT c.id FROM jira_replication_config c WHERE c.customerorder_id IS NULL);
              DELETE FROM jira_replication_config
               WHERE customerorder_id IS NULL
        - addNotNullConstraint:
            tableName: jira_replication_config
            columnName: customerorder_id
            columnDataType: BIGINT
        - addForeignKeyConstraint:
            baseTableName: jira_replication_config
            baseColumnNames: customerorder_id
            constraintName: fk_jira_replication_config_customerorder
            referencedTableName: customerorder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: jira_replication_config
            baseColumnNames: suborder_id
            constraintName: fk_jira_replication_config_suborder
            referencedTableName: suborder
            referencedColumnNames: id
  - changeSet:
      id: 121
      author: kr
      comment: JIRA-Tickets und Worklogs verweisen ueber die id auf Auftrag und Unterauftrag (#1323)
      # Der Weg aus Changeset 120 fuer jira_ticket und jira_worklog_sync: customerorder_id und
      # suborder_id mit Fremdschluessel neben scope_sign, das Reports und ETL-Definitionen weiter
      # lesen. Die Anwendung loest ueber die ids auf und schreibt scope_sign aus Auftrag bzw.
      # Unterauftrag; die Spalte folgt einer Umbenennung (JiraScopeSignMirrorListener).
      #
      # Uebernommen wird nur eine eindeutige, binaer verglichene Zuordnung, nach derselben Regel wie
      # fuer die Konfigurationen: ein Auftragskuerzel geht einem gleichlautenden Unterauftragspfad
      # vor. Aufgeloest werden die verschiedenen Kuerzel, nicht jede Zeile - die View suborder_fqs
      # ist rekursiv. Tickets und Worklogs, deren Geltungsbereich sich nicht eindeutig aufloesen
      # laesst, werden geloescht. Die eindeutigen Schluessel auf scope_sign bleiben unveraendert.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: jira_ticket
                columnName: customerorder_id
      changes:
        - addColumn:
            tableName: jira_ticket
            columns:
              - column:
                  name: customerorder_id
                  type: bigint
              - column:
                  name: suborder_id
                  type: bigint
        - addColumn:
            tableName: jira_worklog_sync
            columns:
              - column:
                  name: customerorder_id
                  type: bigint
              - column:
                  name: suborder_id
                  type: bigint
        - sql:
            sql: |-
              UPDATE jira_ticket t
                JOIN (SELECT x.scope_sign,
                             (SELECT MIN(o.id) FROM customerorder o
                               WHERE BINARY o.sign = BINARY x.scope_sign
                              HAVING COUNT(*) = 1) AS customerorder_id
                        FROM (SELECT DISTINCT scope_sign FROM jira_ticket) x) m
                  ON BINARY m.scope_sign = BINARY t.scope_sign
                 SET t.customerorder_id = m.customerorder_id;
              UPDATE jira_ticket t
                JOIN (SELECT x.scope_sign,
                             (SELECT MIN(f.suborder_id) FROM suborder_fqs f
                               WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(x.scope_sign, '/')
                              HAVING COUNT(*) = 1) AS suborder_id
                        FROM (SELECT DISTINCT scope_sign FROM jira_ticket WHERE customerorder_id IS NULL) x
                       WHERE NOT EXISTS (SELECT 1 FROM customerorder o
                                          WHERE BINARY o.sign = BINARY x.scope_sign)) m
                  ON BINARY m.scope_sign = BINARY t.scope_sign
                 SET t.suborder_id = m.suborder_id
               WHERE t.customerorder_id IS NULL;
              UPDATE jira_ticket t
                JOIN suborder s ON s.id = t.suborder_id
                 SET t.customerorder_id = s.customerorder_id
               WHERE t.customerorder_id IS NULL;
              DELETE FROM jira_ticket WHERE customerorder_id IS NULL;
              UPDATE jira_worklog_sync t
                JOIN (SELECT x.scope_sign,
                             (SELECT MIN(o.id) FROM customerorder o
                               WHERE BINARY o.sign = BINARY x.scope_sign
                              HAVING COUNT(*) = 1) AS customerorder_id
                        FROM (SELECT DISTINCT scope_sign FROM jira_worklog_sync) x) m
                  ON BINARY m.scope_sign = BINARY t.scope_sign
                 SET t.customerorder_id = m.customerorder_id;
              UPDATE jira_worklog_sync t
                JOIN (SELECT x.scope_sign,
                             (SELECT MIN(f.suborder_id) FROM suborder_fqs f
                               WHERE BINARY f.sign_fully_qualified = BINARY CONCAT(x.scope_sign, '/')
                              HAVING COUNT(*) = 1) AS suborder_id
                        FROM (SELECT DISTINCT scope_sign FROM jira_worklog_sync WHERE customerorder_id IS NULL) x
                       WHERE NOT EXISTS (SELECT 1 FROM customerorder o
                                          WHERE BINARY o.sign = BINARY x.scope_sign)) m
                  ON BINARY m.scope_sign = BINARY t.scope_sign
                 SET t.suborder_id = m.suborder_id
               WHERE t.customerorder_id IS NULL;
              UPDATE jira_worklog_sync t
                JOIN suborder s ON s.id = t.suborder_id
                 SET t.customerorder_id = s.customerorder_id
               WHERE t.customerorder_id IS NULL;
              DELETE FROM jira_worklog_sync WHERE customerorder_id IS NULL
        - addNotNullConstraint:
            tableName: jira_ticket
            columnName: customerorder_id
            columnDataType: BIGINT
        - addNotNullConstraint:
            tableName: jira_worklog_sync
            columnName: customerorder_id
            columnDataType: BIGINT
        - addForeignKeyConstraint:
            baseTableName: jira_ticket
            baseColumnNames: customerorder_id
            constraintName: fk_jira_ticket_customerorder
            referencedTableName: customerorder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: jira_ticket
            baseColumnNames: suborder_id
            constraintName: fk_jira_ticket_suborder
            referencedTableName: suborder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: jira_worklog_sync
            baseColumnNames: customerorder_id
            constraintName: fk_jira_worklog_sync_customerorder
            referencedTableName: customerorder
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: jira_worklog_sync
            baseColumnNames: suborder_id
            constraintName: fk_jira_worklog_sync_suborder
            referencedTableName: suborder
            referencedColumnNames: id
  - changeSet:
      id: 122
      author: kr
      comment: Report-Definition und geplanter Report gehoeren einem Login ueber dessen id (#1330)
      # Wem ein Report gehoert, ergab sich bisher aus createdby, dem Loginnamen als Text. Ein
      # Loginname laesst sich aendern oder anonymisieren; der Besitz ging dann verloren, und wer den
      # Namen spaeter bekam, erbte ihn (der Grund aus #1204). owner_user_id verweist auf salat_user;
      # createdby bleibt als Audit-Feld unveraendert.
      #
      # Uebernommen wird nur eine eindeutige, binaer verglichene Zuordnung. Ohne Zuordnung bleibt
      # owner_user_id NULL, dann aendert nur noch ein Manager den Satz. Wird ein Login geloescht
      # (mit seiner Person), setzt der Fremdschluessel den Besitzer auf NULL, statt das Loeschen
      # aufzuhalten.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: report_definition
                columnName: owner_user_id
      changes:
        - addColumn:
            tableName: report_definition
            columns:
              - column:
                  name: owner_user_id
                  type: bigint
        - addColumn:
            tableName: scheduled_report_job
            columns:
              - column:
                  name: owner_user_id
                  type: bigint
        - sql:
            sql: |-
              UPDATE report_definition r
                 SET r.owner_user_id = (SELECT MIN(u.id) FROM salat_user u
                                         WHERE BINARY u.loginname = BINARY r.createdby
                                        HAVING COUNT(*) = 1);
              UPDATE scheduled_report_job j
                 SET j.owner_user_id = (SELECT MIN(u.id) FROM salat_user u
                                         WHERE BINARY u.loginname = BINARY j.createdby
                                        HAVING COUNT(*) = 1)
        - addForeignKeyConstraint:
            baseTableName: report_definition
            baseColumnNames: owner_user_id
            constraintName: fk_report_definition_owner_user
            referencedTableName: salat_user
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: scheduled_report_job
            baseColumnNames: owner_user_id
            constraintName: fk_scheduled_report_job_owner_user
            referencedTableName: salat_user
            referencedColumnNames: id
            onDelete: SET NULL
  - changeSet:
      id: 123
      author: kr
      comment: salat_user.loginname ist eindeutig (#1333)
      # Die Anmeldung, die Einstellungen und der Besitz von Reports (#1330) suchen genau ein Login je
      # Namen. Binaer verglichen wie die Spalte (utf8mb3_bin); NULL bleibt mehrfach zulaessig.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            salat_user enthaelt doppelte Anmeldenamen; vor dem Start bereinigen (#1333).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `salat_user` WHERE `loginname` IS NOT NULL GROUP BY `loginname` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: ALTER TABLE `salat_user` ADD CONSTRAINT `uk_salat_user_loginname` UNIQUE (`loginname`)

  - changeSet:
      id: 124
      author: kr
      comment: report_definition.name ist eindeutig (#1333)
      # Die REST-Schnittstelle ruft einen Report ueber seinen Namen auf.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            report_definition enthaelt doppelte Namen; vor dem Start bereinigen (#1333).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `report_definition` WHERE `name` IS NOT NULL GROUP BY `name` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: ALTER TABLE `report_definition` ADD CONSTRAINT `uk_report_definition_name` UNIQUE (`name`)

  - changeSet:
      id: 125
      author: kr
      comment: Der Name einer Berechtigungsregel ist ohne Ruecksicht auf Gross-/Kleinschreibung eindeutig (#1333)
      # Der Service prueft das seit #1168; zwei gleichzeitige Speichervorgaenge kamen aber beide durch.
      # Die Spalte sortiert binaer, ein einfacher Schluessel unterschiede Abc und abc. Deshalb ueber
      # eine generierte Spalte LOWER(name), die die Anwendung nicht abbildet.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            authorization_rule enthaelt Namen, die sich nur in Gross-/Kleinschreibung unterscheiden; vor dem
            Start bereinigen (#1333).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `authorization_rule` WHERE `name` IS NOT NULL GROUP BY LOWER(`name`) HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: >-
              ALTER TABLE `authorization_rule`
                ADD COLUMN `name_lower` varchar(255) CHARACTER SET utf8mb3 COLLATE utf8mb3_bin
                  GENERATED ALWAYS AS (LOWER(`name`)) STORED,
                ADD CONSTRAINT `uk_authorization_rule_name_lower` UNIQUE (`name_lower`)

  - changeSet:
      id: 126
      author: kr
      comment: customer.shortname ist eindeutig (#1333)
      # Der Kurzname unterscheidet Kunden in jeder Auswahlliste (#1266); der Service prueft ihn beim
      # Speichern (CU-0003). Haelt an, solange der Bestand Duplikate traegt - sie sind vorher von Hand
      # umzubenennen.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            customer enthaelt doppelte Kurznamen; vor dem Start bereinigen (#1333).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `customer` WHERE `shortname` IS NOT NULL GROUP BY `shortname` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: ALTER TABLE `customer` ADD CONSTRAINT `uk_customer_shortname` UNIQUE (`shortname`)

  - changeSet:
      id: 127
      author: kr
      comment: Das Kuerzel eines Unterauftrags ist unter seinen Geschwistern eindeutig (#1333)
      # Der vollstaendige Auftragsschluessel (AUFTRAG/01/02) nennt einen Unterauftrag in Reports,
      # Importen und den Mustern der Kundenstundensaetze; er ist nur eindeutig, wenn es das Kuerzel
      # unter Geschwistern ist. Ein Unique-Schluessel behandelt NULL als verschieden, und jeder
      # Unterauftrag direkt unter dem Auftrag hat keinen Elternteil - deshalb ueber die generierte
      # Spalte parent_key = COALESCE(parentorder_id, 0). Haelt an, solange der Bestand Duplikate
      # traegt - sie sind vorher von Hand umzubenennen.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            suborder enthaelt Geschwister mit gleichem Kuerzel; vor dem Start bereinigen (#1333).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `suborder` GROUP BY `customerorder_id`, COALESCE(`parentorder_id`, 0), `sign` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: >-
              ALTER TABLE `suborder`
                ADD COLUMN `parent_key` bigint GENERATED ALWAYS AS (COALESCE(`parentorder_id`, 0)) STORED,
                ADD CONSTRAINT `uk_suborder_customerorder_parent_sign` UNIQUE (`customerorder_id`, `parent_key`, `sign`)

  - changeSet:
      id: 128
      author: kr
      comment: Kostenkategorie als eigene Tabelle, Zeitscheiben und Zuordnungen verweisen per Fremdschluessel darauf (#1209)
      # Bisher war eine Kategorie nur ein Name, den mehrere Zeitscheiben (employee_cost.name) und jede
      # Zuordnung (employee_cost_employee.employee_cost_name) trugen. Eine Umbenennung musste alle
      # treffen, und ein Tippfehler legte stillschweigend eine neue Kategorie an.
      #
      # Jeder Name, den eine Zeitscheibe oder eine Zuordnung traegt, wird eine Kategorie - auch der einer
      # Zuordnung ohne Zeitscheibe (#895). Verglichen wird binaer wie bisher (utf8mb3_bin): Namen, die
      # sich nur in der Schreibweise unterscheiden, bleiben zwei Kategorien, so wie die Anwendung sie
      # schon unterschied.
      #
      # Die Namensspalten bleiben als Spiegel stehen, weil Views, ETL-Definitionen und Reports darueber
      # verknuepfen. Die Anwendung schreibt sie aus der Kategorie und liest sie nicht mehr. Der
      # eindeutige Schluessel einer Zeitscheibe geht vom Namen auf die Kategorie ueber.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: employee_cost_category
      changes:
        - sql:
            sql: >-
              CREATE TABLE `employee_cost_category` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `name` varchar(255) CHARACTER SET utf8mb3 COLLATE utf8mb3_bin NOT NULL,
                `created` datetime DEFAULT NULL,
                `lastupdate` datetime DEFAULT NULL,
                `createdby` varchar(255) CHARACTER SET utf8mb3 COLLATE utf8mb3_bin DEFAULT NULL,
                `lastupdatedby` varchar(255) CHARACTER SET utf8mb3 COLLATE utf8mb3_bin DEFAULT NULL,
                `updatecounter` int DEFAULT NULL,
                CONSTRAINT `pk_employee_cost_category` PRIMARY KEY (`id`),
                CONSTRAINT `uk_employee_cost_category_name` UNIQUE (`name`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_bin
        - sql:
            sql: >-
              INSERT INTO `employee_cost_category` (`name`, `created`, `createdby`, `updatecounter`)
              SELECT n.`name`, NOW(), 'liquibase', 0
              FROM (SELECT `name` FROM `employee_cost`
                    UNION
                    SELECT `employee_cost_name` FROM `employee_cost_employee`) n
              ORDER BY n.`name`
        - sql:
            sql: >-
              ALTER TABLE `employee_cost` ADD COLUMN `category_id` bigint NULL AFTER `id`
        - sql:
            sql: >-
              UPDATE `employee_cost` c JOIN `employee_cost_category` k ON k.`name` = c.`name`
              SET c.`category_id` = k.`id`
        - sql:
            sql: >-
              ALTER TABLE `employee_cost`
                MODIFY `category_id` bigint NOT NULL,
                ADD CONSTRAINT `fk_employee_cost_category` FOREIGN KEY (`category_id`) REFERENCES `employee_cost_category` (`id`),
                DROP INDEX `uk_employee_cost_name_valid_from`,
                ADD CONSTRAINT `uk_employee_cost_category_valid_from` UNIQUE (`category_id`, `valid_from`)
        - sql:
            sql: >-
              ALTER TABLE `employee_cost_employee` ADD COLUMN `employee_cost_category_id` bigint NULL AFTER `id`
        - sql:
            sql: >-
              UPDATE `employee_cost_employee` a JOIN `employee_cost_category` k ON k.`name` = a.`employee_cost_name`
              SET a.`employee_cost_category_id` = k.`id`
        - sql:
            sql: >-
              ALTER TABLE `employee_cost_employee`
                MODIFY `employee_cost_category_id` bigint NOT NULL,
                ADD CONSTRAINT `fk_employee_cost_employee_category` FOREIGN KEY (`employee_cost_category_id`) REFERENCES `employee_cost_category` (`id`)

  - changeSet:
      id: 129
      author: kr
      comment: Kostenzuordnung auch fuer einen ganzen Auftrag (#1343)
      # Eine Kostenzuordnung galt fuer einen Unterauftrag oder allgemein. Ab hier kann sie auch fuer
      # einen ganzen Auftrag gelten, ueber customerorder_id mit Fremdschluessel; sie greift dann fuer
      # alle seine Unterauftraege. Unterauftrag und Auftrag schliessen sich aus, das prueft der Service.
      #
      # customerorder_sign ist ein Spiegel des Auftragskuerzels fuer Views, ETL-Definitionen und
      # Reports, wie suborder_sign (#1212). Die Anwendung schreibt ihn aus dem Auftrag, liest ihn nie
      # und zieht ihn bei einer Umbenennung nach (OrderSignMirrorListener). Bestehende Zeilen bleiben
      # leer: keine gilt bisher fuer einen ganzen Auftrag.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: employee_cost_employee
                columnName: customerorder_id
      changes:
        - addColumn:
            tableName: employee_cost_employee
            columns:
              - column:
                  name: customerorder_id
                  type: bigint
              - column:
                  name: customerorder_sign
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: employee_cost_employee
            baseColumnNames: customerorder_id
            constraintName: fk_employee_cost_employee_customerorder
            referencedTableName: customerorder
            referencedColumnNames: id

  - changeSet:
      id: 130
      author: kr
      comment: Wie viele Ticket-Referenzen eine Buchung tragen darf, an Auftrag und Unterauftrag (#1326)
      # Keine, hoechstens n oder beliebig viele: ticket_reference_mode NONE, LIMITED oder UNLIMITED,
      # ticket_reference_limit traegt n nur bei LIMITED. Am Auftrag Pflicht, am Unterauftrag leer heisst
      # erben (vom naechsten Unterauftrag darueber mit Einstellung, sonst vom Auftrag). Jeder bestehende
      # Auftrag bekommt "beliebig viele", die Vorgabe auch fuer neue; jeder Unterauftrag erbt. Keine
      # bestehende Buchung traegt mehr als eine Referenz, keine wird also ungueltig.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: customerorder
                columnName: ticket_reference_mode
      changes:
        - sql:
            sql: >-
              ALTER TABLE `customerorder`
                ADD COLUMN `ticket_reference_mode` varchar(16) NOT NULL DEFAULT 'UNLIMITED',
                ADD COLUMN `ticket_reference_limit` int NULL
        - sql:
            sql: >-
              ALTER TABLE `suborder`
                ADD COLUMN `ticket_reference_mode` varchar(16) NULL,
                ADD COLUMN `ticket_reference_limit` int NULL

  - changeSet:
      id: 131
      author: kr
      comment: Ticket-Referenzen einer Buchung in eigener Tabelle (#1326)
      # Je Buchung, Position (ab 1) und Referenz eine Zeile; eine Referenz haengt an einer Buchung nur
      # einmal. Kollation wie jira_ticket.issue_key (utf8mb3_bin) und ein Index auf der Referenz, damit
      # ein Join referenz = issue_key den Index nutzt (#1327). ON DELETE CASCADE, weil das Bereinigen
      # weich geloeschter Buchungen ein natives DELETE ist (hardDeleteSoftDeletedByEmployeeorderId).
      #
      # Der Bestand wird ohne Aufteilen uebernommen, auch fuer weich geloeschte Buchungen, und dabei
      # normalisiert wie in TicketReferences: ohne umgebende Leerzeichen, ein Ticket-Schluessel in
      # Grossbuchstaben. timereport.ticket_reference bleibt als Spiegel der ersten Referenz fuer die
      # Report-Definitionen; die Anwendung schreibt ihn und liest ihn nicht mehr.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: timereport_ticket_reference
      changes:
        - sql:
            sql: >-
              CREATE TABLE `timereport_ticket_reference` (
                `timereport_id` bigint NOT NULL,
                `position` int NOT NULL,
                `reference` varchar(64) NOT NULL,
                CONSTRAINT `pk_timereport_ticket_reference` PRIMARY KEY (`timereport_id`, `position`),
                CONSTRAINT `uk_timereport_ticket_reference_timereport_id_reference` UNIQUE (`timereport_id`, `reference`),
                INDEX `idx_timereport_ticket_reference_reference` (`reference`),
                CONSTRAINT `fk_timereport_ticket_reference_timereport` FOREIGN KEY (`timereport_id`)
                  REFERENCES `timereport` (`id`) ON DELETE CASCADE
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_bin
        - sql:
            sql: >-
              UPDATE `timereport` SET `ticket_reference` = NULL
              WHERE `ticket_reference` IS NOT NULL AND TRIM(`ticket_reference`) = ''
        - sql:
            sql: >-
              UPDATE `timereport` SET `ticket_reference` =
                CASE WHEN TRIM(`ticket_reference`) REGEXP '^[A-Za-z][A-Za-z0-9_]+-[0-9]+$'
                     THEN UPPER(TRIM(`ticket_reference`)) ELSE TRIM(`ticket_reference`) END
              WHERE `ticket_reference` IS NOT NULL
        - sql:
            sql: >-
              INSERT INTO `timereport_ticket_reference` (`timereport_id`, `position`, `reference`)
              SELECT `id`, 1, `ticket_reference` FROM `timereport` WHERE `ticket_reference` IS NOT NULL

  - changeSet:
      id: 132
      author: kr
      comment: Ticket-Referenzen eines Favoriten in eigener Tabelle (#1326)
      # Ein Favorit gibt alle Referenzen der Buchung zurueck, aus der er entstand - also wie die Buchung
      # eine Liste. Der Bestand wird normalisiert uebernommen. Die alte Spalte favorite.ticket_reference
      # bleibt vorerst stehen, die Anwendung liest und schreibt sie nicht mehr: ein Stand davor validiert
      # beim Start gegen sie (ddl-auto: validate), ein Zuruecksetzen auf das vorige Release bliebe sonst
      # haengen. Sie entfaellt mit dem Spiegel timereport.ticket_reference.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: favorite_ticket_reference
      changes:
        - sql:
            sql: >-
              CREATE TABLE `favorite_ticket_reference` (
                `favorite_id` bigint NOT NULL,
                `position` int NOT NULL,
                `reference` varchar(64) NOT NULL,
                CONSTRAINT `pk_favorite_ticket_reference` PRIMARY KEY (`favorite_id`, `position`),
                CONSTRAINT `uk_favorite_ticket_reference_favorite_id_reference` UNIQUE (`favorite_id`, `reference`),
                CONSTRAINT `fk_favorite_ticket_reference_favorite` FOREIGN KEY (`favorite_id`)
                  REFERENCES `favorite` (`id`) ON DELETE CASCADE
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_bin
        - sql:
            sql: >-
              INSERT INTO `favorite_ticket_reference` (`favorite_id`, `position`, `reference`)
              SELECT `id`, 1,
                CASE WHEN TRIM(`ticket_reference`) REGEXP '^[A-Za-z][A-Za-z0-9_]+-[0-9]+$'
                     THEN UPPER(TRIM(`ticket_reference`)) ELSE TRIM(`ticket_reference`) END
              FROM `favorite` WHERE `ticket_reference` IS NOT NULL AND TRIM(`ticket_reference`) <> ''

  - changeSet:
      id: 133
      author: kr
      comment: Kosten- und Preis-Views verknuepfen ueber die ids (#1345, #1202, #1359)
      # Die drei Views sind bisher von Hand in der Datenbank gepflegt worden und stehen hiermit zum ersten
      # Mal im Changelog. Sie lasen die Spiegelspalten employee_cost.name, employee_cost_employee.employee_cost_name,
      # employee_sign, customerorder_sign und suborder_sign sowie order_pricing.employee_sign und customerorder_sign.
      # Jetzt treffen sie Person, Auftrag, Unterauftrag und Kostenkategorie ueber die id, so wie die Anwendung
      # (EmployeeCostLookup, OrderPricingLookup). Die Spiegelspalten koennen danach entfallen.
      #
      # Die Spalten der Views und ihre Bedeutung bleiben, damit die Reports darauf unveraendert laufen:
      # - cost_suborder_sign_matcher ist der vollstaendige Schluessel des Unterauftrags der Zuordnung ohne
      #   Schraegstrich, bei einer Zuordnung zum Auftrag dessen Kuerzel, sonst leer. Die Laenge ordnet weiter
      #   von der speziellen zur allgemeinen Zuordnung.
      # - price_employee_sign_matcher ist das Kuerzel der Person bei einem persoenlichen Satz, sonst leer.
      # - order_pricing.suborder_sign ist ein LIKE-Muster und kein Verweis, es bleibt (#1212).
      #
      # Unterschiede zur Fassung von Hand, gegen den Bestand geprueft:
      # - Eine Zuordnung zu einem Unterauftrag gilt fuer dessen Teilbaum, verglichen mit abschliessendem
      #   Schraegstrich; ein Geschwister mit gleichem Anfang (AUFTRAG/010 zu AUFTRAG/01) faellt nicht mehr hinein.
      # - Eine Zuordnung zu einem Auftrag gilt nur fuer diesen Auftrag (#1343), nicht mehr fuer alle.
      # - Ein persoenlicher Stundensatz gilt nur fuer seine Person. Die alte Fassung verglich das Kuerzel per
      #   LIKE mit angehaengtem Prozentzeichen und traf damit jede Person, deren Kuerzel gleich anfaengt.
      # - Eine Zuordnung ohne Person (#968) gilt fuer niemanden.
      changes:
        - createView:
            viewName: order_cost_view
            replaceIfExists: true
            selectQuery: |-
              SELECT DISTINCT data.customer_name,
                              data.order_sign,
                              data.employee_sign,
                              data.suborder_sign,
                              GREATEST(data.employee_order_from, data.ecost_from)  AS valid_from,
                              LEAST(data.employee_order_until, data.ecost_until)   AS valid_until,
                              data.ecost_name                                      AS cost_name,
                              ROUND(data.ecost_cost_cents_per_hour / 100, 2)       AS cost_eur_per_hour,
                              data.ece_suborder_sign                               AS cost_suborder_sign_matcher
              FROM (SELECT cust.shortname                                                                    AS customer_name,
                           co.sign                                                                           AS order_sign,
                           emp.sign                                                                          AS employee_sign,
                           s_fqs.sign_fully_qualified                                                        AS suborder_sign,
                           so.invoice                                                                        AS suborder_invoice,
                           eo.fromDate                                                                       AS employee_order_from,
                           IFNULL(eo.untilDate, IFNULL(so.untilDate, IFNULL(co.untilDate, '2999-12-31')))    AS employee_order_until,
                           IFNULL(TRIM(TRAILING '/' FROM (SELECT f.sign_fully_qualified FROM suborder_fqs f
                                                          WHERE f.suborder_id = ece.suborder_id)),
                                  IFNULL((SELECT c2.sign FROM customerorder c2 WHERE c2.id = ece.customerorder_id), '')) AS ece_suborder_sign,
                           IFNULL((SELECT ecat.name FROM employee_cost_category ecat WHERE ecat.id = ecost.category_id),
                                  '???')                                                                     AS ecost_name,
                           IFNULL(ecost.cost_cents_per_hour, 99999)                                          AS ecost_cost_cents_per_hour,
                           GREATEST(IFNULL(ecost.valid_from, '2000-01-01'), IFNULL(ece.valid_from, '2000-01-01'))  AS ecost_from,
                           LEAST(IFNULL(ecost.valid_until, '2999-12-31'), IFNULL(ece.valid_until, '2999-12-31'))   AS ecost_until
                    FROM customerorder co
                             JOIN customer cust ON cust.id = co.CUSTOMER_ID
                             JOIN suborder so ON so.CUSTOMERORDER_ID = co.id
                             JOIN employeeorder eo ON eo.SUBORDER_ID = so.id
                             JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID
                             JOIN employee emp ON emp.id = ec.EMPLOYEE_ID
                             JOIN suborder_fqs s_fqs ON s_fqs.suborder_id = so.id
                             LEFT JOIN employee_cost_employee ece
                                       ON ece.employee_id = emp.id
                                           AND (ece.customerorder_id IS NULL OR ece.customerorder_id = co.id)
                                           AND (ece.suborder_id IS NULL OR s_fqs.sign_fully_qualified LIKE
                                               CONCAT((SELECT f.sign_fully_qualified FROM suborder_fqs f
                                                       WHERE f.suborder_id = ece.suborder_id), '%'))
                             LEFT JOIN employee_cost ecost ON ecost.category_id = ece.employee_cost_category_id) data
              WHERE data.employee_order_until >= data.ecost_from
                AND data.employee_order_from <= data.ecost_until
        - createView:
            viewName: order_pricing_cost_view
            replaceIfExists: true
            selectQuery: |-
              SELECT data.customer_name,
                     data.order_sign,
                     data.employee_sign,
                     data.suborder_sign,
                     data.suborder_invoice,
                     GREATEST(data.employee_order_from, data.ecost_from, data.op_from)  AS valid_from,
                     LEAST(data.employee_order_until, data.ecost_until, data.op_until)  AS valid_until,
                     data.ecost_name                                                    AS cost_name,
                     ROUND(data.ecost_cost_cents_per_hour / 100, 2)                     AS cost_eur_per_hour,
                     data.op_description                                                AS price_description,
                     ROUND(data.op_price_cents_per_hour / 100, 2)                       AS price_eur_per_hour,
                     data.ece_suborder_sign                                             AS cost_suborder_sign_matcher,
                     data.op_employee_sign                                              AS price_employee_sign_matcher,
                     data.op_suborder_sign                                              AS price_suborder_sign_matcher
              FROM (SELECT cust.shortname                                                                    AS customer_name,
                           co.sign                                                                           AS order_sign,
                           emp.sign                                                                          AS employee_sign,
                           s_fqs.sign_fully_qualified                                                        AS suborder_sign,
                           so.invoice                                                                        AS suborder_invoice,
                           eo.fromDate                                                                       AS employee_order_from,
                           IFNULL(eo.untilDate, IFNULL(so.untilDate, IFNULL(co.untilDate, '2999-12-31')))    AS employee_order_until,
                           IFNULL(TRIM(TRAILING '/' FROM (SELECT f.sign_fully_qualified FROM suborder_fqs f
                                                          WHERE f.suborder_id = ece.suborder_id)),
                                  IFNULL((SELECT c2.sign FROM customerorder c2 WHERE c2.id = ece.customerorder_id), '')) AS ece_suborder_sign,
                           IFNULL((SELECT ecat.name FROM employee_cost_category ecat WHERE ecat.id = ecost.category_id),
                                  '???')                                                                     AS ecost_name,
                           IFNULL(ecost.cost_cents_per_hour, 99999)                                          AS ecost_cost_cents_per_hour,
                           GREATEST(IFNULL(ecost.valid_from, '2000-01-01'), IFNULL(ece.valid_from, '2000-01-01'))  AS ecost_from,
                           LEAST(IFNULL(ecost.valid_until, '2999-12-31'), IFNULL(ece.valid_until, '2999-12-31'))   AS ecost_until,
                           IFNULL(op.description, '???')                                                     AS op_description,
                           IFNULL(op.price_cents_per_hour, 0)                                                AS op_price_cents_per_hour,
                           IFNULL(op.valid_from, '2000-01-01')                                               AS op_from,
                           IFNULL(op.valid_until, '2999-12-31')                                              AS op_until,
                           IF(op.employee_id IS NULL, '', emp.sign)                                          AS op_employee_sign,
                           IFNULL(op.suborder_sign, '')                                                      AS op_suborder_sign
                    FROM customerorder co
                             JOIN customer cust ON cust.id = co.CUSTOMER_ID
                             JOIN suborder so ON so.CUSTOMERORDER_ID = co.id
                             JOIN employeeorder eo ON eo.SUBORDER_ID = so.id
                             JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID
                             JOIN employee emp ON emp.id = ec.EMPLOYEE_ID
                             JOIN suborder_fqs s_fqs ON s_fqs.suborder_id = so.id
                             LEFT JOIN employee_cost_employee ece
                                       ON ece.employee_id = emp.id
                                           AND (ece.customerorder_id IS NULL OR ece.customerorder_id = co.id)
                                           AND (ece.suborder_id IS NULL OR s_fqs.sign_fully_qualified LIKE
                                               CONCAT((SELECT f.sign_fully_qualified FROM suborder_fqs f
                                                       WHERE f.suborder_id = ece.suborder_id), '%'))
                             LEFT JOIN employee_cost ecost ON ecost.category_id = ece.employee_cost_category_id
                             LEFT JOIN order_pricing op
                                       ON op.customerorder_id = co.id
                                           AND (op.employee_id IS NULL OR op.employee_id = emp.id)
                                           AND s_fqs.sign_fully_qualified LIKE CONCAT(IFNULL(op.suborder_sign, ''), '%')) data
              WHERE data.employee_order_until >= data.op_from
                AND data.employee_order_from <= data.op_until
                AND data.employee_order_until >= data.ecost_from
                AND data.employee_order_from <= data.ecost_until
        - createView:
            viewName: order_pricing_view
            replaceIfExists: true
            selectQuery: |-
              SELECT DISTINCT data.customer_name,
                              data.order_sign,
                              data.employee_sign,
                              data.suborder_sign,
                              data.suborder_id,
                              GREATEST(data.employee_order_from, data.op_from)  AS valid_from,
                              LEAST(data.employee_order_until, data.op_until)   AS valid_until,
                              data.op_description                               AS price_description,
                              ROUND(data.op_price_cents_per_hour / 100, 2)      AS price_eur_per_hour,
                              data.op_employee_sign                             AS price_employee_sign_matcher,
                              data.op_suborder_sign                             AS price_suborder_sign_matcher
              FROM (SELECT cust.shortname                                                                 AS customer_name,
                           co.sign                                                                        AS order_sign,
                           emp.sign                                                                       AS employee_sign,
                           s_fqs.sign_fully_qualified                                                     AS suborder_sign,
                           so.invoice                                                                     AS suborder_invoice,
                           eo.fromDate                                                                    AS employee_order_from,
                           IFNULL(eo.untilDate, IFNULL(so.untilDate, IFNULL(co.untilDate, '2999-12-31'))) AS employee_order_until,
                           IFNULL(op.description, '???')                                                  AS op_description,
                           IFNULL(op.price_cents_per_hour, 0)                                             AS op_price_cents_per_hour,
                           IFNULL(op.valid_from, '2000-01-01')                                            AS op_from,
                           IFNULL(op.valid_until, '2999-12-31')                                           AS op_until,
                           IF(op.employee_id IS NULL, '', emp.sign)                                       AS op_employee_sign,
                           IFNULL(op.suborder_sign, '')                                                   AS op_suborder_sign,
                           so.id                                                                          AS suborder_id
                    FROM customerorder co
                             JOIN customer cust ON cust.id = co.CUSTOMER_ID
                             JOIN suborder so ON so.CUSTOMERORDER_ID = co.id
                             JOIN employeeorder eo ON eo.SUBORDER_ID = so.id
                             JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID
                             JOIN employee emp ON emp.id = ec.EMPLOYEE_ID
                             JOIN suborder_fqs s_fqs ON s_fqs.suborder_id = so.id
                             LEFT JOIN order_pricing op
                                       ON op.customerorder_id = co.id
                                           AND (op.employee_id IS NULL OR op.employee_id = emp.id)
                                           AND s_fqs.sign_fully_qualified LIKE CONCAT(IFNULL(op.suborder_sign, ''), '%')) data
              WHERE data.employee_order_until >= data.op_from
                AND data.employee_order_from <= data.op_until
                AND data.suborder_invoice = 'Y'

  - changeSet:
      id: 134
      author: kr
      comment: View team_membership - Teamzuordnung aus Vertrag und Vorgesetzten (#1320)
      # Je Vertrag und Vorgesetzter/Vorgesetztem eine Zeile. Fuehrende Quelle sind die Vorgesetzten des
      # Vertrags (employeecontract_supervisor), ueber die auch die Anwendung entscheidet, wessen Buchungen
      # eine Person mit der Rolle People Lead lesen darf. Die Tabellen team_lead/team_member, die Reports
      # bisher lasen, pflegt niemand und sie verknuepfen ueber Kuerzel; sie entfallen nach der Umstellung.
      #
      # Ein Team ist die Menge der Vorgesetzten eines Vertrags, eine Doppelspitze also ein Team. Schluessel
      # ist team_key (die ids der Vorgesetzten); team_name aus den Vornamen dient nur der Anzeige, zwei
      # Leitungen gleichen Vornamens waeren daran nicht zu unterscheiden.
      #
      # lead_login ist der Login der Leitung: Reports setzen ###-AUTH-USER-SIGN-### auf den Login der
      # angemeldeten Person, und der ist nicht bei jeder Person gleich ihrem Kuerzel.
      #
      # Vertraege mit Freelancer-Kennzeichen sind nicht enthalten. Ein Report schraenkt die Zeilen ueber
      # valid_from/valid_until auf seinen Zeitraum ein.
      changes:
        - createView:
            viewName: team_membership
            replaceIfExists: true
            selectQuery: |-
              SELECT ec.id         AS employeecontract_id,
                     ec.validFrom  AS valid_from,
                     ec.validUntil AS valid_until,
                     e.id          AS member_id,
                     e.sign        AS member_sign,
                     s.id          AS lead_id,
                     s.sign        AS lead_sign,
                     su.loginname  AS lead_login,
                     tn.team_key,
                     tn.team_name
              FROM employeecontract ec
                       JOIN employee e ON e.id = ec.EMPLOYEE_ID
                       JOIN employeecontract_supervisor es ON es.EMPLOYEECONTRACT_ID = ec.id
                       JOIN employee s ON s.id = es.SUPERVISOR_ID
                       LEFT JOIN employee_salat_user esu ON esu.employee_id = s.id
                       LEFT JOIN salat_user su ON su.id = esu.salat_user_id
                       JOIN (SELECT es2.EMPLOYEECONTRACT_ID,
                                    GROUP_CONCAT(s2.id ORDER BY s2.id SEPARATOR ',') AS team_key,
                                    CONCAT('Team ', GROUP_CONCAT(s2.firstname ORDER BY s2.firstname SEPARATOR ' und ')) AS team_name
                             FROM employeecontract_supervisor es2
                                      JOIN employee s2 ON s2.id = es2.SUPERVISOR_ID
                             GROUP BY es2.EMPLOYEECONTRACT_ID) tn ON tn.EMPLOYEECONTRACT_ID = ec.id
              WHERE NOT COALESCE(ec.freelancer, 0)

  - changeSet:
      id: 135
      author: kr
      comment: Preis- und Umsatz-View lesen Unterauftrag und Vertrag der Buchung ueber den Mitarbeiterauftrag (#1210)
      # Beide Views wurden bisher von Hand in der Datenbank gepflegt und stehen hiermit zum ersten Mal im
      # Changelog. Sie lasen timereport.SUBORDER_ID und EMPLOYEECONTRACT_ID, die Changeset 136 entfernt; vorher
      # muessen sie ersetzt sein, sonst werden sie ungueltig. Ergebnis gegen den Bestand geprueft: zeilengleich,
      # nachdem die Buchungen mit abweichendem Unterauftrag den ihres Mitarbeiterauftrags angenommen haben.
      # Spalten und Bedeutung bleiben, der Report darauf laeuft unveraendert.
      changes:
        - createView:
            viewName: order_pricing_view2
            replaceIfExists: true
            selectQuery: |-
              SELECT data2.refdate,
                     data2.employee_sign,
                     data2.order_sign,
                     data2.suborder_sign,
                     data2.SUBORDER_ID,
                     data2.price_eur_per_hour
              FROM (SELECT data.refdate,
                           data.employee_sign,
                           data.order_sign,
                           data.suborder_sign,
                           data.SUBORDER_ID,
                           data.price_eur_per_hour,
                           ROW_NUMBER() OVER (PARTITION BY data.employee_sign, data.order_sign, data.suborder_sign, data.SUBORDER_ID, data.refdate
                                              ORDER BY LENGTH(IFNULL(data.price_employee_sign_matcher, '')) DESC,
                                                       LENGTH(IFNULL(data.price_suborder_sign_matcher, '')) DESC) AS rn
                    FROM (SELECT DISTINCT eo.SUBORDER_ID,
                                          r.refdate,
                                          op.price_eur_per_hour,
                                          op.employee_sign,
                                          op.order_sign,
                                          op.suborder_sign,
                                          op.price_employee_sign_matcher,
                                          op.price_suborder_sign_matcher
                          FROM referenceday r
                                   JOIN timereport t ON t.REFERENCEDAY_ID = r.id
                                   JOIN employeeorder eo ON eo.id = t.EMPLOYEEORDER_ID
                                   JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID
                                   JOIN suborder so ON so.id = eo.SUBORDER_ID
                                   JOIN customerorder co ON co.id = so.CUSTOMERORDER_ID
                                   JOIN employee e ON e.id = ec.EMPLOYEE_ID
                                   JOIN order_pricing_view op
                                        ON r.refdate BETWEEN op.valid_from AND op.valid_until
                                            AND op.suborder_id = eo.SUBORDER_ID
                                            AND op.order_sign = co.sign
                                            AND op.employee_sign = e.sign
                          WHERE t.deleted = 0) data) data2
              WHERE data2.rn = 1
        - createView:
            viewName: revenue_view
            replaceIfExists: true
            selectQuery: |-
              SELECT tr.id                                                AS timereport_id,
                     co.id                                                AS customerorder_id,
                     co.sign                                              AS customerorder_sign,
                     so.id                                                AS suborder_id,
                     op.suborder_sign                                     AS suborder_sign_fully_qualified,
                     tr.EMPLOYEEORDER_ID                                  AS employeeorder_id,
                     op.refdate                                           AS timereport_date,
                     tr.durationminutes + tr.durationhours * 60           AS timereport_minutes,
                     IFNULL(op.price_eur_per_hour, 0) * 100 / 60          AS price_cents_per_minute,
                     op.price_eur_per_hour
              FROM order_pricing_view2 op
                       JOIN referenceday r ON r.refdate = op.refdate
                       JOIN timereport tr ON tr.REFERENCEDAY_ID = r.id AND tr.deleted = 0
                       JOIN employeeorder eo ON eo.id = tr.EMPLOYEEORDER_ID AND eo.SUBORDER_ID = op.SUBORDER_ID
                       JOIN suborder so ON so.id = eo.SUBORDER_ID
                       JOIN customerorder co ON co.id = so.CUSTOMERORDER_ID
                       JOIN employee e ON e.sign = op.employee_sign
                       JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID AND ec.EMPLOYEE_ID = e.id

  - changeSet:
      id: 136
      author: kr
      comment: Unterauftrag und Vertrag einer Buchung kommen aus dem Mitarbeiterauftrag (#1210)
      # timereport.SUBORDER_ID und timereport.EMPLOYEECONTRACT_ID waren Kopien dessen, was der
      # Mitarbeiterauftrag (EMPLOYEEORDER_ID) schon festlegt. Massgeblich ist der Mitarbeiterauftrag;
      # die Anwendung liest Unterauftrag und Vertrag einer Buchung seitdem von dort. Altbuchungen, deren
      # SUBORDER_ID vom Unterauftrag ihres Mitarbeiterauftrags abwich, gehoeren damit zu diesem - so
      # entschieden. Ein abweichender Vertrag kam im Bestand nicht vor. Erst fallen die Fremdschluessel,
      # dann die Spalten; die gleichnamigen Indizes ueber je eine Spalte gehen mit der Spalte.
      #
      # Report- und ETL-Definitionen pflegt die Anwendung nicht per Changeset: sie muessen in der Datenbank
      # umgestellt sein, bevor dieses Changeset laeuft, sonst brechen sie. Die beiden Views ersetzt Changeset 135.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: timereport
            columnName: SUBORDER_ID
        - columnExists:
            tableName: timereport
            columnName: EMPLOYEECONTRACT_ID
      changes:
        - dropForeignKeyConstraint:
            baseTableName: timereport
            constraintName: FKDA2C76616F5511F2
        - dropForeignKeyConstraint:
            baseTableName: timereport
            constraintName: FKDA2C7661789484B2
        - dropColumn:
            tableName: timereport
            columnName: SUBORDER_ID
        - dropColumn:
            tableName: timereport
            columnName: EMPLOYEECONTRACT_ID

  - changeSet:
      id: 137
      author: kr
      comment: Unterauftrag erhaelt die Spalte complete_order_sign fuer den vollstaendigen Schluessel (#1342)
      # Der vollstaendige Schluessel (AUFTRAG/01/02, ohne abschliessenden Schraegstrich) wird redundant am
      # Unterauftrag gespeichert. Bisher baute ihn jeder Leser aus der Kette der Elternknoten neu, die
      # Anwendung Ebene fuer Ebene, Reports und ETL ueber die View suborder_fqs mit neun festen Self-Joins.
      # Ab jetzt haelt das Modul order die Spalte aktuell (Suborder#deriveCompleteOrderSign).
      #
      # Erst leer anlegen, in eigenen Changesets befuellen und dann verschaerfen: MySQL fuehrt DDL ohne
      # Transaktion aus. Stuende alles in einem Changeset und schluege die Befuellung fehl, liefe er beim
      # naechsten Start nicht wieder an - die Spalte gaebe es dann ja schon.
      #
      # Kollation utf8mb3_bin wie die Kuerzelspalten, damit Vergleich und Eindeutigkeit Gross- und
      # Kleinschreibung unterscheiden wie die Anwendung. Laenge 1000: mehr passt mit utf8mb3 nicht in einen
      # eindeutigen Index (3072 Bytes). Die Anwendung laesst Kuerzel mit 16 Zeichen zu, das reicht fuer
      # ueber 50 Ebenen; der laengste Schluessel im Bestand hat 61 Zeichen.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: suborder
                columnName: complete_order_sign
      changes:
        - sql:
            sql: ALTER TABLE `suborder` ADD COLUMN `complete_order_sign` varchar(1000) CHARACTER SET utf8mb3 COLLATE utf8mb3_bin NULL

  - changeSet:
      id: 138
      author: kr
      comment: complete_order_sign aus dem Bestand befuellen (#1342)
      # Rekursiv und damit ohne feste Tiefe, anders als suborder_fqs: die Befuellung laeuft nur einmal, ihre
      # Laufzeit spielt keine Rolle. Ausgangspunkt sind die Unterauftraege ohne Elternteil; ein Unterauftrag,
      # den die Kette nicht von dort erreicht, bliebe leer, und Changeset 139 haelt dann an. Gegen den
      # Bestand geprueft: fuer jeden Unterauftrag gleich suborder_fqs.sign_fully_qualified ohne den
      # abschliessenden Schraegstrich.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: suborder
            columnName: complete_order_sign
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) > 0 FROM `suborder` WHERE `complete_order_sign` IS NULL
      changes:
        - sql:
            sql: |-
              UPDATE suborder s
                  JOIN (WITH RECURSIVE chain (id, complete_order_sign) AS (
                            SELECT top.id,
                                   CAST(CONCAT(c.sign, '/', top.sign) AS CHAR(1000) CHARACTER SET utf8mb3) COLLATE utf8mb3_bin
                            FROM suborder top
                                     JOIN customerorder c ON c.id = top.CUSTOMERORDER_ID
                            WHERE top.PARENTORDER_ID IS NULL
                            UNION ALL
                            SELECT child.id, CONCAT(parent.complete_order_sign, '/', child.sign)
                            FROM suborder child
                                     JOIN chain parent ON parent.id = child.PARENTORDER_ID)
                        SELECT id, complete_order_sign FROM chain) derived ON derived.id = s.id
              SET s.complete_order_sign = derived.complete_order_sign

  - changeSet:
      id: 139
      author: kr
      comment: complete_order_sign ist Pflicht und eindeutig (#1342)
      # Eindeutig, weil Auftragskuerzel (uk_customerorder_sign) und Kuerzel unter einem Elternteil
      # (uk_suborder_customerorder_parent_sign) es sind. Einzige Luecke: ein Auftragskuerzel mit
      # Schraegstrich kann denselben Pfad ergeben wie ein Unterauftrag eines anderen Auftrags. Der Bestand
      # hat keinen solchen Fall; der Schluessel verhindert, dass einer entsteht.
      #
      # Eigenes SQL statt addNotNullConstraint: MODIFY ueber Liquibase verliert die Kollation der Spalte.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            suborder enthaelt fehlende oder doppelte Werte in (complete_order_sign); Changeset 138 haette
            jeden Unterauftrag befuellen muessen (#1342).
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM `suborder` WHERE `complete_order_sign` IS NULL
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM (SELECT 1 FROM `suborder` GROUP BY `complete_order_sign` HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: ALTER TABLE `suborder` MODIFY `complete_order_sign` varchar(1000) CHARACTER SET utf8mb3 COLLATE utf8mb3_bin NOT NULL, ADD CONSTRAINT `uk_suborder_complete_order_sign` UNIQUE (`complete_order_sign`)

  - changeSet:
      id: 140
      author: kr
      comment: suborder_fqs und die Kosten- und Preis-Views lesen complete_order_sign (#1342)
      # Uebergang: suborder_fqs liefert denselben Schluessel mit abschliessendem Schraegstrich, jetzt aus der
      # Spalte statt ueber neun Self-Joins - ohne feste Tiefe, und Report- und ETL-Definitionen laufen
      # unveraendert weiter, bis sie umgestellt sind. Die Kollation bleibt utf8mb3_bin, die der Spalte.
      #
      # Die drei Views aus Changeset 133 lesen die Spalte direkt. Ihre Spalten und Werte bleiben gleich,
      # suborder_sign weiter mit Schraegstrich; der Schraegstrich steckt im Vergleich, nicht in den Daten.
      # Gegen den Bestand geprueft: zeilengleich.
      changes:
        - createView:
            viewName: suborder_fqs
            replaceIfExists: true
            selectQuery: |-
              SELECT s.id AS suborder_id,
                     CONCAT(s.complete_order_sign, '/') AS sign_fully_qualified
              FROM suborder s
        - createView:
            viewName: order_cost_view
            replaceIfExists: true
            selectQuery: |-
              SELECT DISTINCT data.customer_name,
                              data.order_sign,
                              data.employee_sign,
                              data.suborder_sign,
                              GREATEST(data.employee_order_from, data.ecost_from)  AS valid_from,
                              LEAST(data.employee_order_until, data.ecost_until)   AS valid_until,
                              data.ecost_name                                      AS cost_name,
                              ROUND(data.ecost_cost_cents_per_hour / 100, 2)       AS cost_eur_per_hour,
                              data.ece_suborder_sign                               AS cost_suborder_sign_matcher
              FROM (SELECT cust.shortname                                                                    AS customer_name,
                           co.sign                                                                           AS order_sign,
                           emp.sign                                                                          AS employee_sign,
                           CONCAT(so.complete_order_sign, '/')                                              AS suborder_sign,
                           so.invoice                                                                        AS suborder_invoice,
                           eo.fromDate                                                                       AS employee_order_from,
                           IFNULL(eo.untilDate, IFNULL(so.untilDate, IFNULL(co.untilDate, '2999-12-31')))    AS employee_order_until,
                           IFNULL((SELECT f.complete_order_sign FROM suborder f WHERE f.id = ece.suborder_id),
                                  IFNULL((SELECT c2.sign FROM customerorder c2 WHERE c2.id = ece.customerorder_id), '')) AS ece_suborder_sign,
                           IFNULL((SELECT ecat.name FROM employee_cost_category ecat WHERE ecat.id = ecost.category_id),
                                  '???')                                                                     AS ecost_name,
                           IFNULL(ecost.cost_cents_per_hour, 99999)                                          AS ecost_cost_cents_per_hour,
                           GREATEST(IFNULL(ecost.valid_from, '2000-01-01'), IFNULL(ece.valid_from, '2000-01-01'))  AS ecost_from,
                           LEAST(IFNULL(ecost.valid_until, '2999-12-31'), IFNULL(ece.valid_until, '2999-12-31'))   AS ecost_until
                    FROM customerorder co
                             JOIN customer cust ON cust.id = co.CUSTOMER_ID
                             JOIN suborder so ON so.CUSTOMERORDER_ID = co.id
                             JOIN employeeorder eo ON eo.SUBORDER_ID = so.id
                             JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID
                             JOIN employee emp ON emp.id = ec.EMPLOYEE_ID
                             LEFT JOIN employee_cost_employee ece
                                       ON ece.employee_id = emp.id
                                           AND (ece.customerorder_id IS NULL OR ece.customerorder_id = co.id)
                                           AND (ece.suborder_id IS NULL OR CONCAT(so.complete_order_sign, '/') LIKE
                                               CONCAT((SELECT f.complete_order_sign FROM suborder f
                                                       WHERE f.id = ece.suborder_id), '/%'))
                             LEFT JOIN employee_cost ecost ON ecost.category_id = ece.employee_cost_category_id) data
              WHERE data.employee_order_until >= data.ecost_from
                AND data.employee_order_from <= data.ecost_until
        - createView:
            viewName: order_pricing_cost_view
            replaceIfExists: true
            selectQuery: |-
              SELECT data.customer_name,
                     data.order_sign,
                     data.employee_sign,
                     data.suborder_sign,
                     data.suborder_invoice,
                     GREATEST(data.employee_order_from, data.ecost_from, data.op_from)  AS valid_from,
                     LEAST(data.employee_order_until, data.ecost_until, data.op_until)  AS valid_until,
                     data.ecost_name                                                    AS cost_name,
                     ROUND(data.ecost_cost_cents_per_hour / 100, 2)                     AS cost_eur_per_hour,
                     data.op_description                                                AS price_description,
                     ROUND(data.op_price_cents_per_hour / 100, 2)                       AS price_eur_per_hour,
                     data.ece_suborder_sign                                             AS cost_suborder_sign_matcher,
                     data.op_employee_sign                                              AS price_employee_sign_matcher,
                     data.op_suborder_sign                                              AS price_suborder_sign_matcher
              FROM (SELECT cust.shortname                                                                    AS customer_name,
                           co.sign                                                                           AS order_sign,
                           emp.sign                                                                          AS employee_sign,
                           CONCAT(so.complete_order_sign, '/')                                              AS suborder_sign,
                           so.invoice                                                                        AS suborder_invoice,
                           eo.fromDate                                                                       AS employee_order_from,
                           IFNULL(eo.untilDate, IFNULL(so.untilDate, IFNULL(co.untilDate, '2999-12-31')))    AS employee_order_until,
                           IFNULL((SELECT f.complete_order_sign FROM suborder f WHERE f.id = ece.suborder_id),
                                  IFNULL((SELECT c2.sign FROM customerorder c2 WHERE c2.id = ece.customerorder_id), '')) AS ece_suborder_sign,
                           IFNULL((SELECT ecat.name FROM employee_cost_category ecat WHERE ecat.id = ecost.category_id),
                                  '???')                                                                     AS ecost_name,
                           IFNULL(ecost.cost_cents_per_hour, 99999)                                          AS ecost_cost_cents_per_hour,
                           GREATEST(IFNULL(ecost.valid_from, '2000-01-01'), IFNULL(ece.valid_from, '2000-01-01'))  AS ecost_from,
                           LEAST(IFNULL(ecost.valid_until, '2999-12-31'), IFNULL(ece.valid_until, '2999-12-31'))   AS ecost_until,
                           IFNULL(op.description, '???')                                                     AS op_description,
                           IFNULL(op.price_cents_per_hour, 0)                                                AS op_price_cents_per_hour,
                           IFNULL(op.valid_from, '2000-01-01')                                               AS op_from,
                           IFNULL(op.valid_until, '2999-12-31')                                              AS op_until,
                           IF(op.employee_id IS NULL, '', emp.sign)                                          AS op_employee_sign,
                           IFNULL(op.suborder_sign, '')                                                      AS op_suborder_sign
                    FROM customerorder co
                             JOIN customer cust ON cust.id = co.CUSTOMER_ID
                             JOIN suborder so ON so.CUSTOMERORDER_ID = co.id
                             JOIN employeeorder eo ON eo.SUBORDER_ID = so.id
                             JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID
                             JOIN employee emp ON emp.id = ec.EMPLOYEE_ID
                             LEFT JOIN employee_cost_employee ece
                                       ON ece.employee_id = emp.id
                                           AND (ece.customerorder_id IS NULL OR ece.customerorder_id = co.id)
                                           AND (ece.suborder_id IS NULL OR CONCAT(so.complete_order_sign, '/') LIKE
                                               CONCAT((SELECT f.complete_order_sign FROM suborder f
                                                       WHERE f.id = ece.suborder_id), '/%'))
                             LEFT JOIN employee_cost ecost ON ecost.category_id = ece.employee_cost_category_id
                             LEFT JOIN order_pricing op
                                       ON op.customerorder_id = co.id
                                           AND (op.employee_id IS NULL OR op.employee_id = emp.id)
                                           AND CONCAT(so.complete_order_sign, '/') LIKE CONCAT(IFNULL(op.suborder_sign, ''), '%')) data
              WHERE data.employee_order_until >= data.op_from
                AND data.employee_order_from <= data.op_until
                AND data.employee_order_until >= data.ecost_from
                AND data.employee_order_from <= data.ecost_until
        - createView:
            viewName: order_pricing_view
            replaceIfExists: true
            selectQuery: |-
              SELECT DISTINCT data.customer_name,
                              data.order_sign,
                              data.employee_sign,
                              data.suborder_sign,
                              data.suborder_id,
                              GREATEST(data.employee_order_from, data.op_from)  AS valid_from,
                              LEAST(data.employee_order_until, data.op_until)   AS valid_until,
                              data.op_description                               AS price_description,
                              ROUND(data.op_price_cents_per_hour / 100, 2)      AS price_eur_per_hour,
                              data.op_employee_sign                             AS price_employee_sign_matcher,
                              data.op_suborder_sign                             AS price_suborder_sign_matcher
              FROM (SELECT cust.shortname                                                                 AS customer_name,
                           co.sign                                                                        AS order_sign,
                           emp.sign                                                                       AS employee_sign,
                           CONCAT(so.complete_order_sign, '/')                                           AS suborder_sign,
                           so.invoice                                                                     AS suborder_invoice,
                           eo.fromDate                                                                    AS employee_order_from,
                           IFNULL(eo.untilDate, IFNULL(so.untilDate, IFNULL(co.untilDate, '2999-12-31'))) AS employee_order_until,
                           IFNULL(op.description, '???')                                                  AS op_description,
                           IFNULL(op.price_cents_per_hour, 0)                                             AS op_price_cents_per_hour,
                           IFNULL(op.valid_from, '2000-01-01')                                            AS op_from,
                           IFNULL(op.valid_until, '2999-12-31')                                           AS op_until,
                           IF(op.employee_id IS NULL, '', emp.sign)                                       AS op_employee_sign,
                           IFNULL(op.suborder_sign, '')                                                   AS op_suborder_sign,
                           so.id                                                                          AS suborder_id
                    FROM customerorder co
                             JOIN customer cust ON cust.id = co.CUSTOMER_ID
                             JOIN suborder so ON so.CUSTOMERORDER_ID = co.id
                             JOIN employeeorder eo ON eo.SUBORDER_ID = so.id
                             JOIN employeecontract ec ON ec.id = eo.EMPLOYEECONTRACT_ID
                             JOIN employee emp ON emp.id = ec.EMPLOYEE_ID
                             LEFT JOIN order_pricing op
                                       ON op.customerorder_id = co.id
                                           AND (op.employee_id IS NULL OR op.employee_id = emp.id)
                                           AND CONCAT(so.complete_order_sign, '/') LIKE CONCAT(IFNULL(op.suborder_sign, ''), '%')) data
              WHERE data.employee_order_until >= data.op_from
                AND data.employee_order_from <= data.op_until
                AND data.suborder_invoice = 'Y'

  - changeSet:
      id: 141
      author: kr
      comment: View suborder_fqs entfernen (#1342)
      # Laeuft erst, wenn keine Report-, ETL- oder View-Definition sie mehr liest. Die Definitionen pflegt
      # die Anwendung, nicht der Changelog; bis sie umgestellt sind, ueberspringt CONTINUE den Changeset und
      # versucht ihn beim naechsten Start wieder. Gesucht wird ohne Gross-/Kleinschreibung, die Spalten der
      # Definitionen sind utf8mb3_bin.
      preConditions:
        - onFail: CONTINUE
        - viewExists:
            viewName: suborder_fqs
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT (SELECT COUNT(*) FROM report_definition WHERE LOWER(`sql`) LIKE '%suborder!_fqs%' ESCAPE '!')
                   + (SELECT COUNT(*) FROM etl_definition
                      WHERE LOWER(CONCAT_WS(' ', `init`, `execute`, `cleanup`)) LIKE '%suborder!_fqs%' ESCAPE '!')
                   + (SELECT COUNT(*) FROM information_schema.VIEWS
                      WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME <> 'suborder_fqs'
                        AND LOWER(VIEW_DEFINITION) LIKE '%suborder!_fqs%' ESCAPE '!')
                   + (SELECT COUNT(*) FROM information_schema.ROUTINES
                      WHERE ROUTINE_SCHEMA = DATABASE() AND LOWER(ROUTINE_DEFINITION) LIKE '%suborder!_fqs%' ESCAPE '!')
      changes:
        - dropView:
            viewName: suborder_fqs

  - changeSet:
      id: 142
      author: kr
      comment: Index auf etl_execution_history.executed_at fuer das naechtliche Aufraeumen (#1357)
      # ETLExecutionHistoryCleanupService loescht taeglich alles vor der Aufbewahrungsfrist
      # (WHERE executed_at < :cutoff). Ohne Index ging das die ganze Tabelle durch.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: etl_execution_history
        - not:
            - indexExists:
                tableName: etl_execution_history
                indexName: idx_etl_execution_history_executed_at
      changes:
        - createIndex:
            tableName: etl_execution_history
            indexName: idx_etl_execution_history_executed_at
            columns:
              - column:
                  name: executed_at

  - changeSet:
      id: 143
      author: kr
      comment: Kostenzuordnung und Kundenstundensatz ohne Kuerzelspalte der Person (#1202)
      # employee_id ist seit #968 der Verweis auf die Person, employee_sign stand nur noch fuer Views,
      # ETL-Definitionen und Reports daneben. Die lesen seit der Umstellung ueber die id; geprueft per
      # EXPLAIN aller Definitionen gegen ein Schema ohne die Spalte, auf dem Stand der Produktion.
      #
      # Die Bedingung prueft die Daten: Eine Kostenzuordnung ohne Person wuerde NOT NULL scheitern
      # lassen, und ein Stundensatz mit Kuerzel ohne id galt bisher fuer niemanden - ohne die Spalte
      # gaelte er fuer alle. Gibt es solche Saetze, ueberspringt CONTINUE den Changeset und versucht
      # ihn beim naechsten Start wieder.
      preConditions:
        - onFail: CONTINUE
        - columnExists:
            tableName: employee_cost_employee
            columnName: employee_sign
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT (SELECT COUNT(*) FROM employee_cost_employee WHERE employee_id IS NULL)
                   + (SELECT COUNT(*) FROM order_pricing
                      WHERE employee_id IS NULL AND COALESCE(employee_sign, '') <> '')
      changes:
        - addNotNullConstraint:
            tableName: employee_cost_employee
            columnName: employee_id
            columnDataType: bigint
        - dropColumn:
            tableName: employee_cost_employee
            columnName: employee_sign
        - dropColumn:
            tableName: order_pricing
            columnName: employee_sign

  - changeSet:
      id: 144
      author: kr
      comment: Zeitscheibe und Zuordnung ohne Namensspalte der Kostenkategorie (#1345)
      # Seit #1209 verweisen beide per Fremdschluessel auf employee_cost_category; die Namensspalten
      # waren Spiegel fuer Views, ETL-Definitionen und Reports. Die lesen den Namen seither aus der
      # Kategorie, geprueft wie bei Changeset 143.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: employee_cost_employee
            columnName: employee_cost_name
      changes:
        - dropColumn:
            tableName: employee_cost
            columnName: name
        - dropColumn:
            tableName: employee_cost_employee
            columnName: employee_cost_name

  - changeSet:
      id: 145
      author: kr
      comment: Budgetplan und Pauschale ohne Kuerzelspalten des Auftragsbezugs (#1321)
      # customerorder_id und suborder_id sind seit #1205/#1212 der Verweis; die Kuerzelspalten waren
      # Spiegel fuer Reports, die seit der Umstellung ueber die ids lesen (geprueft wie bei Changeset
      # 143). Der Index idx_order_flat_rate_co_sign liegt nur auf customerorder_sign und geht mit der
