spring:
  datasource:
    url: jdbc:h2:mem:salat;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=MySQL;NON_KEYWORDS=YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        auto_quote_keyword: true
    database: h2
    hibernate:
      ddl-auto: create
  liquibase:
    enabled: false
salat:
  # Die Tests legen ihre Aufträge selbst an; die Sonderaufträge der application.yaml gibt es in der
  # leeren Datenbank nicht, und die Prüfung beim Start hielte an (#1341). E2ETestData setzt sie nach
  # dem Anlegen der Testdaten.
  training:
    regular-suborder-signs: []
  vacation:
    customerorder-sign: ""
    do-not-calculate-signs: []
  # Der Schlüssel des Secret-Speichers für die Tests (#1432). In einer Umgebung kommt er nur aus
  # Umgebungsvariablen; in src/main/resources steht nie einer (SecretKeyConfigurationTest).
  secret:
    active-key-id: test
    keys:
      test: OHTqP+7nahpYHU5ywXXpaYn1EM7J5u4w2fzpXxmTmyw=
  # Eine App-Registrierung für die Tests der OAuth-Verbindung (#1417). In einer Umgebung kommen
  # Client-ID und Client-Secret nur aus Umgebungsvariablen; die Token-Aufrufe sind in den Tests gemockt.
  jira:
    oauth:
      client-id: test-client
      client-secret: test-client-secret
